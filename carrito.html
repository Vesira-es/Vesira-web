<!DOCTYPE html>

<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Carrito · Vesira</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">

<style>

*:root{--f:#0a0a0a;--t:#fff;--s:#8c8c8c;--b:rgba(255,255,255,.1);--c:#141414}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--f);color:var(--t);font-family:Outfit,Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.nav{position:fixed;top:0;left:0;width:100%;height:70px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,10,.8);border-bottom:1px solid var(--b);backdrop-filter:blur(18px);z-index:5}.navleft{display:flex;align-items:center;gap:10px}.logo{width:100px}.eye{font-size:8px;letter-spacing:.18em;color:var(--s);text-transform:uppercase}.back{border:0;background:transparent;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:115px 0 80px}.head{margin-bottom:28px}.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--s);margin-bottom:10px}h1{font-family:Bricolage Grotesque,Arial,sans-serif;font-weight:400;font-size:clamp(52px,7vw,88px);letter-spacing:-.075em;line-height:.82}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.items{display:grid;gap:10px}.item{display:grid;grid-template-columns:130px 1fr auto;gap:16px;padding:10px;border:1px solid var(--b);border-radius:20px;background:#101010}.img{width:130px;aspect-ratio:1/.9;background:#f2f2ef;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}.img img{width:88%;height:88%;object-fit:contain}.info h2{font-family:Bricolage Grotesque,Arial,sans-serif;font-size:25px;font-weight:400;letter-spacing:-.05em;margin-bottom:6px}.price{font-size:11px;color:var(--s);margin-bottom:12px}.controls{display:flex;align-items:center;gap:8px}.qty{display:flex;align-items:center;border:1px solid var(--b);border-radius:999px}.qty button{width:30px;height:29px;border:0;background:transparent;color:#fff;cursor:pointer}.qty span{min-width:28px;text-align:center;font-size:10px}.del{border:0;background:transparent;color:#707070;font-size:9px;cursor:pointer}.totalitem{font-size:12px;white-space:nowrap}.summary{position:sticky;top:90px;padding:19px;border:1px solid var(--b);border-radius:22px;background:#101010}.summary h2{font-family:Bricolage Grotesque,Arial,sans-serif;font-size:28px;font-weight:400;letter-spacing:-.05em;margin-bottom:20px}.row{display:flex;justify-content:space-between;padding:8px 0;color:var(--s);font-size:11px}.row.total{border-top:1px solid var(--b);margin-top:7px;padding-top:14px;color:#fff;font-weight:500}.buy{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:999px;background:#fff;color:#0a0a0a;font-size:11px;cursor:pointer}.continue{display:block;margin-top:12px;color:var(--s);font-size:9px;text-decoration:underline;text-underline-offset:4px}.empty{border:1px solid var(--b);border-radius:22px;padding:70px 20px;text-align:center}.empty h2{font-family:Bricolage Grotesque,Arial,sans-serif;font-size:40px;font-weight:400;letter-spacing:-.06em;margin-bottom:10px}.empty p{color:var(--s);font-size:11px;margin-bottom:20px}.empty a{display:inline-flex;padding:0 20px;height:46px;align-items:center;border-radius:999px;background:#fff;color:#0a0a0a;font-size:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;background:#161616;border:1px solid var(--b);border-radius:999px;padding:11px 15px;font-size:10px;transition:.25s;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}}@media(max-width:600px){.nav{padding:0 18px}.logo{width:94px}.wrap{padding-top:100px}.item{grid-template-columns:92px 1fr;gap:10px}.img{width:92px}.info h2{font-size:20px}.totalitem{grid-column:2;justify-self:end;margin-top:-24px}.summary{padding:16px}.empty h2{font-size:34px}}

</style></head>
  <script src="vesira-navbar.js"></script>

<body>

<nav class="nav"><div class="navleft"><a href="index.html"><img class="logo" src="img/logo2.png" alt="Vesira"></a><span class="eye">Eyewear</span></div><button class="back material-symbols-outlined" id="back">arrow_back</button></nav>

<main class="wrap"><header class="head"><h1>Tu carrito</h1></header><div id="content"></div></main><div class="toast" id="toast"></div>

<script>

const content=document.getElementById('content'),toast=document.getElementById('toast');

function getCart(){try{return JSON.parse(localStorage.getItem('vesiraCarrito')||'[]')}catch{return[]}}

function saveCart(c){localStorage.setItem('vesiraCarrito',JSON.stringify(c))}

function eur(n){return Number(n).toFixed(2).replace('.',',')+' €'}

function msg(t){toast.textContent=t;toast.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>toast.classList.remove('on'),1400)}

function qty(id,d){const c=getCart(),x=c.find(i=>String(i.id)===String(id));if(!x)return;x.cantidad=Math.max(1,Number(x.cantidad||1)+d);saveCart(c);render()}

function removeItem(id){saveCart(getCart().filter(i=>String(i.id)!==String(id)));render();msg('Producto eliminado')}

function render(){const c=getCart(),units=c.reduce((s,i)=>s+Number(i.cantidad||0),0),sub=c.reduce((s,i)=>s+Number(i.precio||0)*Number(i.cantidad||0),0);if(!c.length){content.innerHTML='<section class="empty"><h2>Tu carrito está vacío.</h2><p>Aún no has añadido ningún par.</p><a href="index.html">Ver gafas</a></section>';return}

content.innerHTML=`<div class="layout"><section class="items">${c.map(i=>`<article class="item"><div class="img"><img src="${i.imagen||''}" alt="${i.nombre||'Vesira'}"></div><div class="info"><h2>${i.nombre||''}</h2><div class="price">${eur(i.precio)}</div><div class="controls"><div class="qty"><button onclick='qty(${JSON.stringify(i.id)},-1)'>−</button><span>${Number(i.cantidad||1)}</span><button onclick='qty(${JSON.stringify(i.id)},1)'>+</button></div><button class="del" onclick='removeItem(${JSON.stringify(i.id)})'>Eliminar</button></div></div><div class="totalitem">${eur(Number(i.precio)*Number(i.cantidad||1))}</div></article>`).join('')}</section><aside class="summary"><h2>Resumen.</h2><div class="row"><span>Subtotal</span><strong>${eur(sub)}</strong></div><div class="row total"><span>Total</span><strong>${eur(sub)}</strong></div><button class="buy" id="buy">Continuar con el pedido</button><a class="continue" href="index.html">Seguir comprando</a></aside></div>`;

document.getElementById('buy').onclick=()=>{ if(!getCart().length)return; window.location.href='checkout.html'; }}

document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='index.html';render();

</script></body></html>
