<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carrito · Vesira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined"
    rel="stylesheet"
  >

  <style>
    :root {
      --f: #0a0a0a;
      --t: #fff;
      --s: #8c8c8c;
      --b: rgba(255,255,255,.1);
      --c: #141414;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--f);
      color: var(--t);
      font-family: Outfit, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .wrap {
      width: min(1100px, calc(100% - 28px));
      margin: auto;
      padding: 115px 0 80px;
    }

    .head {
      margin-bottom: 28px;
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--s);
      margin-bottom: 10px;
    }

    h1 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-weight: 400;
      font-size: clamp(52px, 7vw, 88px);
      letter-spacing: -.075em;
      line-height: .82;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 18px;
      align-items: start;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .item {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 16px;
      padding: 10px;
      border: 1px solid var(--b);
      border-radius: 20px;
      background: #101010;
    }

    .img {
      width: 130px;
      aspect-ratio: 1 / .9;
      background: #f2f2ef;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img img {
      width: 88%;
      height: 88%;
      object-fit: contain;
    }

    .info h2 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: -.05em;
      margin-bottom: 6px;
    }

    .price {
      font-size: 11px;
      color: var(--s);
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty {
      display: flex;
      align-items: center;
      border: 1px solid var(--b);
      border-radius: 999px;
    }

    .qty button {
      width: 30px;
      height: 29px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }

    .qty span {
      min-width: 28px;
      text-align: center;
      font-size: 10px;
    }

    .del {
      border: 0;
      background: transparent;
      color: #707070;
      font-size: 9px;
      cursor: pointer;
    }

    .totalitem {
      font-size: 12px;
      white-space: nowrap;
    }

    .summary {
      position: sticky;
      top: 90px;
      align-self: start;
      padding: 17px 19px;
      border: 1px solid var(--b);
      border-radius: 22px;
      background: #101010;
    }

    .summary h2 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -.05em;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      color: var(--s);
      font-size: 11px;
    }

    .buy {
      width: 100%;
      min-height: 50px;
      margin-top: 15px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #0a0a0a;
      font-size: 11px;
      cursor: pointer;
    }

    .continue {
      display: block;
      margin-top: 11px;
      color: var(--s);
      font-size: 9px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .empty {
      border: 1px solid var(--b);
      border-radius: 22px;
      padding: 70px 20px;
      text-align: center;
    }

    .empty h2 {
      font-family: Bricolage Grotesque, Arial, sans-serif;
      font-size: 40px;
      font-weight: 400;
      letter-spacing: -.06em;
      margin-bottom: 10px;
    }

    .empty p {
      color: var(--s);
      font-size: 11px;
      margin-bottom: 20px;
    }

    .empty a {
      display: inline-flex;
      padding: 0 20px;
      height: 46px;
      align-items: center;
      border-radius: 999px;
      background: #fff;
      color: #0a0a0a;
      font-size: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 15px);
      opacity: 0;
      background: #161616;
      border: 1px solid var(--b);
      border-radius: 999px;
      padding: 11px 15px;
      font-size: 10px;
      transition: .25s;
      z-index: 20;
      pointer-events: none;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }

    @media (max-width: 600px) {
      .wrap {
        padding-top: 100px;
      }

      .item {
        grid-template-columns: 92px 1fr;
        gap: 10px;
      }

      .img {
        width: 92px;
      }

      .info h2 {
        font-size: 20px;
      }

      .totalitem {
        grid-column: 2;
        justify-self: end;
        margin-top: -24px;
      }

      .summary {
        padding: 15px 16px;
      }

      .summary h2 {
        font-size: 24px;
        margin-bottom: 12px;
      }

      .empty h2 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <script src="vesira-navbar.js"></script>

  <main class="wrap">

    <header class="head">
      <h1>Tu carrito</h1>
    </header>

    <div id="content"></div>

  </main>

  <div class="toast" id="toast"></div>

  <script>
    const content = document.getElementById('content');
    const toast = document.getElementById('toast');

    const CART_KEY = 'vesiraCarrito';


    /* =========================================================
       LEER CARRITO
    ========================================================= */

    function getCart() {
      try {
        const raw = localStorage.getItem(CART_KEY);

        if (!raw) {
          return [];
        }

        const cart = JSON.parse(raw);

        return Array.isArray(cart) ? cart : [];

      } catch (error) {
        console.error('Error leyendo el carrito:', error);
        return [];
      }
    }


    /* =========================================================
       CONTAR UNIDADES REALES
       
       IMPORTANTE:
       NO usamos cart.length.

       Ejemplo:
       1 producto con cantidad 4 = 4
       2 productos con cantidades 2 y 3 = 5
    ========================================================= */

    function getCartCount(cart = getCart()) {
      return cart.reduce((total, item) => {
        return total + Math.max(
          0,
          Number(item.cantidad || 0)
        );
      }, 0);
    }


    /* =========================================================
       ACTUALIZAR CONTADOR DE LA NAVBAR
    ========================================================= */

    function updateNavbarCartCount() {
      const count = getCartCount();

      /*
       * Intentamos localizar el contador del carrito
       * independientemente de cómo esté construido
       * el navbar.
       */
      const counters = document.querySelectorAll(
        '[data-cart-count], ' +
        '[data-cart-badge], ' +
        '.cart-count, ' +
        '.cart-badge, ' +
        '#cart-count, ' +
        '#cart-badge'
      );

      counters.forEach(counter => {
        counter.textContent = count;

        if (count > 0) {
          counter.style.display = '';
        } else {
          counter.style.display = 'none';
        }
      });

      /*
       * IMPORTANTE:
       * Emitimos también un evento global.
       *
       * vesira-navbar.js podrá escuchar este evento
       * para actualizar su propio contador.
       */
      window.dispatchEvent(
        new CustomEvent('vesira:cart-updated', {
          detail: {
            cart: getCart(),
            count: count
          }
        })
      );
    }


    /* =========================================================
       GUARDAR CARRITO
    ========================================================= */

    function saveCart(cart) {

      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );

      /*
       * Actualización inmediata.
       */
      updateNavbarCartCount();
    }


    /* =========================================================
       FORMATO DE PRECIO
    ========================================================= */

    function eur(n) {
      return Number(n || 0)
        .toFixed(2)
        .replace('.', ',') + ' €';
    }


    /* =========================================================
       TOAST
    ========================================================= */

    function msg(text) {

      toast.textContent = text;

      toast.classList.add('on');

      clearTimeout(window._t);

      window._t = setTimeout(() => {
        toast.classList.remove('on');
      }, 1400);
    }


    /* =========================================================
       CAMBIAR CANTIDAD
    ========================================================= */

    function qty(id, delta) {

      const cart = getCart();

      const item = cart.find(
        i => String(i.id) === String(id)
      );

      if (!item) {
        return;
      }

      const currentQuantity = Math.max(
        1,
        Number(item.cantidad || 1)
      );

      item.cantidad = Math.max(
        1,
        currentQuantity + Number(delta)
      );

      /*
       * Guarda el nuevo carrito Y actualiza la navbar.
       */
      saveCart(cart);

      /*
       * Redibuja el carrito.
       */
      render();

      if (delta > 0) {
        msg('Unidad añadida');
      } else {
        msg('Unidad retirada');
      }
    }


    /* =========================================================
       ELIMINAR PRODUCTO
    ========================================================= */

    function removeItem(id) {

      const cart = getCart();

      const newCart = cart.filter(
        i => String(i.id) !== String(id)
      );

      /*
       * Guarda y actualiza la navbar.
       */
      saveCart(newCart);

      /*
       * Redibuja el carrito.
       */
      render();

      msg('Producto eliminado');
    }


    /* =========================================================
       ESCAPAR HTML
    ========================================================= */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }


    /* =========================================================
       RENDER
    ========================================================= */

    function render() {

      const cart = getCart();

      /*
       * SIEMPRE sincronizamos el contador primero.
       */
      updateNavbarCartCount();


      const subtotal = cart.reduce(
        (sum, item) => {

          const precio = Number(
            item.precio || 0
          );

          const cantidad = Number(
            item.cantidad || 0
          );

          return sum + (
            precio * cantidad
          );

        },
        0
      );


      /* =======================================================
         CARRITO VACÍO
      ======================================================= */

      if (!cart.length) {

        content.innerHTML = `
          <section class="empty">

            <h2>
              Tu carrito está vacío.
            </h2>

            <p>
              Aún no has añadido ningún par.
            </p>

            <a href="index.html">
              Ver gafas
            </a>

          </section>
        `;

        return;
      }


      /* =======================================================
         PRODUCTOS
      ======================================================= */

      content.innerHTML = `
        <div class="layout">

          <section class="items">

            ${cart.map(item => {

              const cantidad = Math.max(
                1,
                Number(item.cantidad || 1)
              );

              const precio = Number(
                item.precio || 0
              );

              const totalItem =
                precio * cantidad;


              return `
                <article class="item">

                  <div class="img">

                    <img
                      src="${escapeHtml(item.imagen || '')}"
                      alt="${escapeHtml(item.nombre || 'Vesira')}"
                    >

                  </div>


                  <div class="info">

                    <h2>
                      ${escapeHtml(item.nombre || '')}
                    </h2>

                    <div class="price">
                      ${eur(precio)}
                    </div>


                    <div class="controls">

                      <div class="qty">

                        <button
                          type="button"
                          aria-label="Quitar una unidad"
                          onclick='qty(
                            ${JSON.stringify(item.id)},
                            -1
                          )'
                        >
                          −
                        </button>


                        <span>
                          ${cantidad}
                        </span>


                        <button
                          type="button"
                          aria-label="Añadir una unidad"
                          onclick='qty(
                            ${JSON.stringify(item.id)},
                            1
                          )'
                        >
                          +
                        </button>

                      </div>


                      <button
                        type="button"
                        class="del"
                        onclick='removeItem(
                          ${JSON.stringify(item.id)}
                        )'
                      >
                        Eliminar
                      </button>

                    </div>

                  </div>


                  <div class="totalitem">
                    ${eur(totalItem)}
                  </div>

                </article>
              `;

            }).join('')}

          </section>


          <aside class="summary">

            <h2>
              Resumen
            </h2>


            <div class="row">

              <span>
                Subtotal
              </span>

              <strong>
                ${eur(subtotal)}
              </strong>

            </div>


            <button
              class="buy"
              id="buy"
              type="button"
            >
              Continuar con el pedido
            </button>


            <a
              class="continue"
              href="index.html"
            >
              Seguir comprando
            </a>

          </aside>

        </div>
      `;


      const buy = document.getElementById('buy');

      if (buy) {

        buy.onclick = () => {

          if (!getCart().length) {
            return;
          }

          window.location.href =
            'checkout.html';
        };
      }
    }


    /* =========================================================
       CAMBIOS DESDE OTRA PESTAÑA
    ========================================================= */

    window.addEventListener('storage', event => {

      if (event.key !== CART_KEY) {
        return;
      }

      render();

    });


    /* =========================================================
       CAMBIOS DESDE OTRAS PARTES DE VESIRA
    ========================================================= */

    window.addEventListener(
      'vesira:cart-updated',
      () => {

        /*
         * No hacemos render aquí porque ya lo hacemos
         * después de qty/removeItem.
         *
         * Solo mantenemos el contador sincronizado.
         */
        updateNavbarCartCount();

      }
    );


    /* =========================================================
       INICIO
    ========================================================= */

    render();

  </script>

</body>
</html>
