<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vesira</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fafafa;
}

/* ---------- HERO ---------- */

.hero{

    min-height:85vh;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:80px 8%;

}

.hero-texto{

    max-width:550px;

}

.hero-texto h1{

    font-size:60px;

    line-height:1.1;

    margin-bottom:20px;

}

.hero-texto p{

    font-size:20px;

    color:#666;

    margin-bottom:40px;

}

.boton{

    display:inline-block;

    padding:16px 34px;

    background:#111;

    color:white;

    text-decoration:none;

    border-radius:999px;

    transition:.25s;

}

.boton:hover{

    background:#333;

}

.hero-imagen{

    width:450px;
    height:450px;

    border-radius:40px;

    background:linear-gradient(135deg,#0768A9,#FFCC02);

}

/* ---------- CATEGORÍAS ---------- */

.categorias{

    padding:60px 8%;

}

.categorias h2{

    margin-bottom:30px;

    font-size:34px;

}

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

    gap:25px;

}

.tarjeta{

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    border:1px solid #ececec;

    transition:.25s;

}

.tarjeta:hover{

    transform:translateY(-6px);

}

/* ---------- MÁS VENDIDOS ---------- */

.productos{

    padding:60px 8%;

}

.productos h2{

    margin-bottom:30px;

}

.productos-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:25px;

}

.producto{

    background:white;

    border-radius:20px;

    padding:25px;

    border:1px solid #ececec;

}

.imagen{

    height:180px;

    background:#f1f1f1;

    border-radius:15px;

    margin-bottom:20px;

}

.precio{

    font-weight:bold;

    margin-top:10px;

}

@media(max-width:900px){

.hero{

    flex-direction:column;

    text-align:center;

    gap:50px;

}

.hero-texto h1{

    font-size:40px;

}

.hero-imagen{

    width:280px;
    height:280px;

}

}

</style>

</head>

<body>

<section class="hero">

    <div class="hero-texto">

        <h1>
            Protege lo que más usas.
        </h1>

        <p>
            Fundas y accesorios seleccionados para tu dispositivo.
        </p>

        <a href="#" class="boton">
            Ver colección
        </a>

    </div>

    <div class="hero-imagen">

    </div>

</section>

<section class="categorias">

    <h2>Compra por categoría</h2>

    <div class="grid">

        <div class="tarjeta">📱<br><br>iPhone</div>

        <div class="tarjeta">🤖<br><br>Samsung</div>

        <div class="tarjeta">🎧<br><br>Audio</div>

        <div class="tarjeta">⌚<br><br>Smartwatch</div>

    </div>

</section>

<section class="productos">

    <h2>Más vendidos</h2>

    <div class="productos-grid">

        <div class="producto">

            <div class="imagen"></div>

            <h3>Funda Transparente</h3>

            <div class="precio">19,99 €</div>

        </div>

        <div class="producto">

            <div class="imagen"></div>

            <h3>Funda Negra</h3>

            <div class="precio">24,99 €</div>

        </div>

        <div class="producto">

            <div class="imagen"></div>

            <h3>MagSafe Case</h3>

            <div class="precio">29,99 €</div>

        </div>

        <div class="producto">

            <div class="imagen"></div>

            <h3>Silicone Case</h3>

            <div class="precio">22,99 €</div>

        </div>

    </div>

</section>

</body>
</html>
