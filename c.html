<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vesira - Colecciones</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

background:white;
    font-family:"Outfit",sans-serif;

    color:#111;

}

.colecciones{

    max-width:1200px;

    margin:auto;

    padding:90px 25px 120px;

}

.subtitulo{

    font-size:12px;

    letter-spacing:.35em;

    text-transform:uppercase;

    color:#8d8d8d;

}

h2{

    margin-top:8px;

    font-size:44px;

    font-weight:700;

    line-height:1.1;

}

.stack{

    position:relative;

    margin-top:70px;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

}

.card{

    position:relative;

    width:88%;

    height:165px;

    background:white;

    border-radius:32px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 45px;

    text-decoration:none;

    color:#111;

    overflow:visible;

    cursor:pointer;

    box-shadow:
    0 18px 45px rgba(0,0,0,.08);

    border:1px solid transparent;

    transition:
    .45s cubic-bezier(.22,1,.36,1);

}

/* efecto de pila */

.card:nth-child(2){

    margin-top:-55px;

    margin-left:45px;

    width:84%;

}

.card:nth-child(3){

    margin-top:-55px;

    margin-left:90px;

    width:80%;

}

.card:nth-child(4){

    margin-top:-55px;

    margin-left:135px;

    width:76%;

}

/* imagen flotante */

.producto{

    position:absolute;

    width:180px;
    left:-20px;



    transition:.45s;

    pointer-events:none;

    filter:drop-shadow(0 18px 25px rgba(0,0,0,.18));

}

.contenido{

    margin-left:160px;

}

.contenido h3{

    font-size:33px;

    font-weight:700;

}

.contenido p{

    margin-top:8px;

    color:#666;

    font-size:16px;

}

.flecha{

    font-size:34px;

    transition:.35s;

}

.card:hover{

    transform:translateY(-12px) translateX(-15px);

    border-color:#111;

    box-shadow:
    0 35px 70px rgba(0,0,0,.14);

    z-index:50;

}

.card:hover .producto{

    transform:
    translateY(-8px)
    rotate(-6deg)
    scale(1.08);

}

.card:hover .flecha{

    transform:translateX(10px);

}

.card::after{

    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0%;

    height:2px;

    background:#111;

    border-radius:999px;


    transition:.4s;

}

.card:hover::after{

    width:100%;

}

/* Animación inicial */

.card{

    opacity:0;

    transform:translateY(-60px);

}

.card.visible{

    opacity:1;

    transform:none;

}

@media(max-width:900px){

.stack{

    margin-top:45px;

}

.card{

    width:100%;

    margin-left:0!important;

    margin-top:18px!important;

    height:125px;

    padding:0 22px;

    border-radius:24px;

}

.producto{

    width:180px;
    left:-20px;

}

.contenido{

    margin-left:95px;

}

.contenido h3{

    font-size:24px;

}

.contenido p{

    font-size:14px;

    margin-top:4px;

}

.flecha{

    font-size:24px;

}

}
</style>
</head>

<body>

<section class="colecciones">

<p class="subtitulo">

EXPLORA

</p>

<h2>

Descubre nuestras colecciones

</h2>

<div class="stack">

<a href="fundas.html" class="card">

<img src="img/funda.png" class="producto">

<div class="contenido">

<h3>Fundas</h3>

<p>Protección elegante para tu dispositivo.</p>

</div>

<div class="flecha">

→

</div>

</a>

<a href="protectores.html" class="card">

<img src="img/protector.png" class="producto">

<div class="contenido">

<h3>Protectores</h3>

<p>Cristal templado de máxima resistencia.</p>

</div>

<div class="flecha">

→

</div>

</a>

<a href="cargadores.html" class="card">

<img src="img/cargador.png" class="producto">

<div class="contenido">

<h3>Cargadores</h3>

<p>Carga rápida y accesorios MagSafe.</p>

</div>

<div class="flecha">

→

</div>

</a>

<a href="accesorios.html" class="card">

<img src="img/accesorio.png" class="producto">

<div class="contenido">

<h3>Accesorios</h3>

<p>Todo para completar tu setup.</p>

</div>

<div class="flecha">

→

</div>

</a>

</div>

</section>

<script>

const cards = document.querySelectorAll(".card");

/* Entrada escalonada */

const observer = new IntersectionObserver((entries)=>{

    entries.forEach((entry,index)=>{

        if(entry.isIntersecting){

            setTimeout(()=>{

                entry.target.classList.add("visible");

            },index*170);

        }

    });

},{threshold:.3});

cards.forEach(card=>{

    observer.observe(card);

});


/* Selección */

cards.forEach(card=>{

    card.addEventListener("click",(e)=>{

        e.preventDefault();

        cards.forEach(c=>{

            c.classList.remove("active");

        });

        card.classList.add("active");

        card.style.transform="translateY(-18px) translateX(-20px)";

        setTimeout(()=>{

            window.location.href=card.href;

        },250);

    });

});


/* Efecto de profundidad */

cards.forEach((card,index)=>{

    card.addEventListener("mouseenter",()=>{

        cards.forEach((c,i)=>{

            if(i!==index){

                c.style.transform=`translateY(${i*2}px) scale(.985)`;

                c.style.opacity=".75";

            }

        });

    });

    card.addEventListener("mouseleave",()=>{

        cards.forEach(c=>{

            c.style.transform="";

            c.style.opacity="1";

        });

    });

});

</script>

</body>

</html>
