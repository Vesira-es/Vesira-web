<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Outfit",sans-serif;
}

body{

background:#f5f5f7;
color:#111;

}

.colecciones{

max-width:1300px;

margin:auto;

padding:80px 22px;

}

.subtitulo{

font-size:12px;

letter-spacing:.35em;

text-transform:uppercase;

color:#8a8a8a;

}

h2{

margin-top:8px;

font-size:42px;

font-weight:700;

line-height:1.1;

}

.grid{

margin-top:40px;

display:grid;

grid-template-columns:2fr 1fr;

gap:22px;

}

.grande{

position:relative;

height:620px;

background:white;

border-radius:32px;

overflow:hidden;

transition:.35s;

cursor:pointer;

}

.grande:hover{

transform:translateY(-6px);

}

.grande img{

width:100%;

height:100%;

object-fit:cover;

}

.info{

position:absolute;

left:40px;

top:40px;

}

.info h3{

font-size:48px;

font-weight:700;

}

.info p{

margin-top:10px;

font-size:18px;

color:#666;

max-width:320px;

}

.boton{

margin-top:25px;

display:inline-flex;

align-items:center;

gap:8px;

padding:13px 22px;

border-radius:999px;

background:#111;

color:white;

font-size:15px;

}

.columna{

display:flex;

flex-direction:column;

gap:22px;

}

.peque{

background:white;

border-radius:32px;

overflow:hidden;

height:299px;

position:relative;

transition:.35s;

cursor:pointer;

}

.peque:hover{

transform:translateY(-6px);

}

.peque img{

width:100%;

height:100%;

object-fit:cover;

}

.peque .info{

left:28px;

top:28px;

}

.peque h3{

font-size:32px;

}

.peque p{

font-size:15px;

max-width:220px;

}

@media(max-width:900px){

.grid{

display:flex;

flex-direction:column;

}

.grande{

height:420px;

}

.peque{

height:220px;

}

.info{

left:24px;

top:24px;

}

.info h3{

font-size:34px;

}

.info p{

font-size:15px;

}

h2{

font-size:32px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<p class="subtitulo">

DESCUBRE

</p>

<h2>

Explora nuestras colecciones

</h2>

<div class="grid">

<div class="grande">

<img src="https://picsum.photos/1200/900?1">

<div class="info">

<h3>

Fundas

</h3>

<p>

Diseños minimalistas para proteger tu dispositivo con estilo.

</p>

<div class="boton">

Descubrir →

</div>

</div>

</div>

<div class="columna">

<div class="peque">

<img src="https://picsum.photos/700/700?2">

<div class="info">

<h3>

Protectores

</h3>

<p>

Cristal templado premium.

</p>

</div>

</div>

<div class="peque">

<img src="https://picsum.photos/700/700?3">

<div class="info">

<h3>

Cargadores

</h3>

<p>

Carga rápida y segura.

</p>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
