<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{

    background:#fafafa;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    overflow:hidden;

}

.colecciones{

    width:1100px;

}

h2{

    font-size:48px;

    margin-bottom:80px;

}

.abanico{

    position:relative;

    width:100%;

    height:500px;

}

.card{

    position:absolute;

    width:420px;

    height:260px;

    background:white;

    border-radius:28px;

    box-shadow:0 20px 45px rgba(0,0,0,.12);

    overflow:hidden;

    cursor:pointer;

    transition:.6s cubic-bezier(.22,1,.36,1);

    transform-origin:bottom center;

}

.card img{

    position:absolute;

    width:240px;

    bottom:-15px;

    right:-25px;

    transition:.5s;

}

.info{

    padding:40px;

}

.info h3{

    font-size:36px;

}

.info p{

    margin-top:10px;

    color:#666;

}

.arrow{

    margin-top:35px;

    font-size:28px;

}

/* Posición inicial */

.card:nth-child(1){

    left:50%;
    bottom:0;

    transform:
    translateX(-50%)
    rotate(-18deg);

    z-index:1;

}

.card:nth-child(2){

    left:50%;
    bottom:0;

    transform:
    translateX(-50%)
    rotate(-6deg);

    z-index:2;

}

.card:nth-child(3){

    left:50%;
    bottom:0;

    transform:
    translateX(-50%)
    rotate(6deg);

    z-index:3;

}

.card:nth-child(4){

    left:50%;
    bottom:0;

    transform:
    translateX(-50%)
    rotate(18deg);

    z-index:4;

}

/* Abanico abierto */

.abanico:hover .card:nth-child(1){

    transform:
    translate(-360px,-35px)
    rotate(-25deg);

}

.abanico:hover .card:nth-child(2){

    transform:
    translate(-120px,-10px)
    rotate(-8deg);

}

.abanico:hover .card:nth-child(3){

    transform:
    translate(120px,-10px)
    rotate(8deg);

}

.abanico:hover .card:nth-child(4){

    transform:
    translate(360px,-35px)
    rotate(25deg);

}

.card:hover{

    margin-top:-35px;

    z-index:20!important;

}

.card:hover img{

    transform:scale(1.08) rotate(-5deg);

}

.card:hover{

    box-shadow:0 35px 70px rgba(0,0,0,.18);

}

@media(max-width:900px){

body{

overflow:auto;

padding:40px 20px;

}

.colecciones{

width:100%;

}

.abanico{

height:auto;

display:flex;

flex-direction:column;

gap:18px;

}

.card{

position:relative;

transform:none!important;

width:100%;

height:160px;

left:0!important;

bottom:0!important;

}

.card img{

width:130px;

}

.info{

padding:22px;

}

.info h3{

font-size:24px;

}

.info p{

display:none;

}

.arrow{

margin-top:12px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<h2>Explora nuestras colecciones</h2>

<div class="abanico">

<div class="card">

<div class="info">

<h3>Fundas</h3>

<p>Protección premium.</p>

<div class="arrow">→</div>

</div>

<img src="https://picsum.photos/400/400?1">

</div>

<div class="card">

<div class="info">

<h3>Protectores</h3>

<p>Cristal templado.</p>

<div class="arrow">→</div>

</div>

<img src="https://picsum.photos/400/400?2">

</div>

<div class="card">

<div class="info">

<h3>Cargadores</h3>

<p>Carga rápida.</p>

<div class="arrow">→</div>

</div>

<img src="https://picsum.photos/400/400?3">

</div>

<div class="card">

<div class="info">

<h3>Accesorios</h3>

<p>Todo para tu móvil.</p>

<div class="arrow">→</div>

</div>

<img src="https://picsum.photos/400/400?4">

</div>

</div>

</section>

</body>
</html>
