<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{

    background:#fff;
    color:#111;

}

.colecciones{

    padding:90px 0;

}

.contenedor{

    max-width:1300px;
    margin:auto;
    padding:0 25px;

}

.subtitulo{

    font-size:12px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:#8b8b8b;

}

h2{

    margin-top:8px;
    font-size:42px;
    font-weight:700;

}

.carrusel{

    display:flex;

    gap:24px;

    overflow-x:auto;

    padding:45px 25px 10px;

    scroll-snap-type:x mandatory;

}

.carrusel::-webkit-scrollbar{

    display:none;

}

.tarjeta{

    position:relative;

    min-width:420px;
    height:520px;

    border-radius:32px;

    overflow:hidden;

    flex:none;

    scroll-snap-align:start;

    cursor:pointer;

}

.tarjeta img{

    width:100%;
    height:100%;
    object-fit:cover;

    transition:.5s;

}

.tarjeta:hover img{

    transform:scale(1.08);

}

.tarjeta::before{

    content:"";

    position:absolute;
    inset:0;

    background:linear-gradient(to top,
    rgba(0,0,0,.55),
    rgba(0,0,0,.08));

}

.info{

    position:absolute;

    left:32px;
    bottom:30px;

    color:white;

}

.info span{

    font-size:13px;

    letter-spacing:.22em;

    text-transform:uppercase;

    opacity:.8;

}

.info h3{

    margin-top:8px;

    font-size:42px;

}

.flecha{

    margin-top:18px;

    font-size:18px;

    font-weight:500;

}

@media(max-width:768px){

.colecciones{

    padding:60px 0;

}

.contenedor{

    padding:0 18px;

}

h2{

    font-size:30px;

}

.carrusel{

    padding:35px 18px 5px;

    gap:18px;

}

.tarjeta{

    min-width:280px;
    height:400px;

    border-radius:24px;

}

.info{

    left:22px;
    bottom:22px;

}

.info h3{

    font-size:30px;

}

.flecha{

    font-size:16px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<div class="contenedor">

<p class="subtitulo">
EXPLORA
</p>

<h2>
Encuentra el accesorio perfecto
</h2>

</div>

<div class="carrusel">

<div class="tarjeta">

<img src="https://picsum.photos/800/1200?1">

<div class="info">

<span>Colección</span>

<h3>Fundas</h3>

<div class="flecha">
Descubrir →
</div>

</div>

</div>

<div class="tarjeta">

<img src="https://picsum.photos/800/1200?2">

<div class="info">

<span>Colección</span>

<h3>Protectores</h3>

<div class="flecha">
Descubrir →
</div>

</div>

</div>

<div class="tarjeta">

<img src="https://picsum.photos/800/1200?3">

<div class="info">

<span>Colección</span>

<h3>Cargadores</h3>

<div class="flecha">
Descubrir →
</div>

</div>

</div>

<div class="tarjeta">

<img src="https://picsum.photos/800/1200?4">

<div class="info">

<span>Colección</span>

<h3>Accesorios</h3>

<div class="flecha">
Descubrir →
</div>

</div>

</div>

</div>

</section>

</body>
</html>
