<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Outfit",sans-serif;
}

body{

background:#fafafa;

padding:70px 20px;

}

.slider{

max-width:1200px;

height:620px;

margin:auto;

position:relative;

overflow:hidden;

border-radius:34px;

}

.slide{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:white;

transform:translateX(100%);

transition:1s cubic-bezier(.22,1,.36,1);

}

.slide.active{

transform:translateX(0);

}

.slide.salida{

transform:translateX(-100%);

}

h2{

font-size:46px;

margin-bottom:35px;

}

img{

width:85%;

max-width:760px;

height:380px;

object-fit:cover;

border-radius:30px;

box-shadow:0 20px 45px rgba(0,0,0,.10);

}

a{

margin-top:35px;

text-decoration:none;

color:#111;

font-size:18px;

font-weight:600;

}

a:hover{

letter-spacing:.05em;

}

@media(max-width:768px){

.slider{

height:470px;

}

h2{

font-size:32px;

}

img{

height:220px;

width:92%;

border-radius:22px;

}

}

</style>

</head>

<body>

<div class="slider">

<div class="slide active">

<h2>Fundas</h2>

<img src="https://picsum.photos/1000/600?1">

<a href="">Ver colección →</a>

</div>

<div class="slide">

<h2>Protectores</h2>

<img src="https://picsum.photos/1000/600?2">

<a href="">Ver colección →</a>

</div>

<div class="slide">

<h2>Cargadores</h2>

<img src="https://picsum.photos/1000/600?3">

<a href="">Ver colección →</a>

</div>

</div>

<script>

const slides=document.querySelectorAll(".slide");

let i=0;

setInterval(()=>{

slides[i].classList.remove("active");
slides[i].classList.add("salida");

i=(i+1)%slides.length;

slides[i].classList.remove("salida");
slides[i].classList.add("active");

setTimeout(()=>{

slides.forEach((s,index)=>{

if(index!==i){

s.classList.remove("salida");
s.style.transform="translateX(100%)";

}

});

},1000);

},4500);

</script>

</body>
</html>
