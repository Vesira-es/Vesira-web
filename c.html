<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Outfit",sans-serif;
    background:#fff;
    color:#111;
}

/* ---------- CONTENEDOR ---------- */

.producto{

    max-width:1300px;
    margin:auto;

    padding:120px 40px;

    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:90px;

}

/* ---------- GALERÍA ---------- */

.galeria{

    display:flex;
    justify-content:center;
    align-items:center;

}

.galeria img{

    width:100%;
    max-width:520px;
    transition:.35s;

}

.galeria img:hover{

    transform:scale(1.04);

}

/* ---------- INFORMACIÓN ---------- */

.info{

    display:flex;
    flex-direction:column;
    justify-content:center;

}

.categoria{

    font-size:13px;
    letter-spacing:.35em;
    color:#888;
    margin-bottom:18px;

}

h1{

    font-size:54px;
    line-height:1.05;
    margin-bottom:18px;

}

.descripcion{

    font-size:18px;
    color:#666;
    line-height:1.7;
    margin-bottom:35px;

}

.precio{

    font-size:34px;
    font-weight:700;
    margin-bottom:30px;

}

/* ---------- COLORES ---------- */

.colores{

    display:flex;
    gap:12px;
    margin-bottom:35px;

}

.color{

    width:42px;
    height:42px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition:.25s;

}

.color.activo{

    border-color:#111;

}

.negro{

    background:#111;

}

.transparente{

    background:#ddd;

}

.azul{

    background:#3357d8;

}

/* ---------- BOTÓN ---------- */

button{

    height:58px;

    border:none;

    border-radius:14px;

    background:#111;

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    background:#222;

}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){

    .producto{

        grid-template-columns:1fr;
        gap:40px;
        padding:100px 25px;

    }

    h1{

        font-size:38px;

    }

    .descripcion{

        font-size:16px;

    }

}

</style>

</head>

<body>

<section class="producto">

    <div class="galeria">

        <img
        id="imagen"
        src="https://dummyimage.com/700x700/f3f3f3/000&text=Funda"
        alt="Producto">

    </div>

    <div class="info">

        <p class="categoria">
            FUNDAS MAGSAFE
        </p>

        <h1>
            Funda MagSafe para iPhone 17 Pro
        </h1>

        <p class="descripcion">
            Diseñada para proteger tu dispositivo sin renunciar
            a un acabado limpio, ligero y elegante.
        </p>

        <div class="precio">
            19,99 €
        </div>

        <div class="colores">

            <div class="color negro activo"></div>

            <div class="color transparente"></div>

            <div class="color azul"></div>

        </div>

        <button>

            Añadir al carrito

        </button>

    </div>

</section>

<script>

const colores=document.querySelectorAll(".color");

colores.forEach(color=>{

    color.addEventListener("click",()=>{

        colores.forEach(c=>c.classList.remove("activo"));

        color.classList.add("activo");

    });

});

</script>

</body>
</html>
