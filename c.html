<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{

    background:#fff;
    color:#111;
    padding:60px 20px;

}

.colecciones{

    max-width:1200px;
    margin:auto;

}

.subtitulo{

    font-size:12px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:#8a8a8a;

}

h2{

    margin-top:8px;
    font-size:40px;
    font-weight:700;

}

.grid{

    margin-top:35px;

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:20px;

}

.tarjeta{

    position:relative;

    overflow:hidden;

    border-radius:28px;

    cursor:pointer;

    height:320px;

}

.tarjeta img{

    width:100%;
    height:100%;
    object-fit:cover;

    transition:.5s;

}

.tarjeta:hover img{

    transform:scale(1.08);

}

.overlay{

    position:absolute;

    inset:0;

    background:linear-gradient(to top,rgba(0,0,0,.55),transparent);

    display:flex;

    align-items:flex-end;

    padding:28px;

}

.overlay h3{

    color:white;
    font-size:30px;

}

.columna{

    display:grid;

    gap:20px;

}

.pequeña{

    height:150px;

}

.pequeña h3{

    font-size:22px;

}

@media(max-width:768px){

.grid{

    grid-template-columns:1fr;

}

.tarjeta{

    height:240px;

}

.pequeña{

    height:180px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<p class="subtitulo">EXPLORA</p>

<h2>Colecciones</h2>

<div class="grid">

    <div class="tarjeta">

        <img src="https://picsum.photos/900/700?1">

        <div class="overlay">

            <h3>Fundas</h3>

        </div>

    </div>

    <div class="columna">

        <div class="tarjeta pequeña">

            <img src="https://picsum.photos/600/400?2">

            <div class="overlay">

                <h3>Protectores</h3>

            </div>

        </div>

        <div class="tarjeta pequeña">

            <img src="https://picsum.photos/600/400?3">

            <div class="overlay">

                <h3>Cargadores</h3>

            </div>

        </div>

    </div>

</div>

</section>

</body>
</html>
