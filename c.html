<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{
    background:#fff;
    color:#111;
}

.por-que{

    max-width:760px;

    margin:110px auto;

    padding:0 25px;

}

.por-que h2{

    font-size:46px;

    font-weight:700;

    line-height:1.1;

    margin-bottom:40px;

}

.por-que p{

    font-size:24px;

    line-height:1.6;

    color:#666;

    margin-bottom:18px;

}

.por-que a{

    display:inline-block;

    margin-top:22px;

    color:#111;

    text-decoration:none;

    font-size:18px;

    font-weight:600;

}

.por-que a:hover{

    opacity:.65;

}

@media(max-width:768px){

.por-que{

    margin:70px auto;

}

.por-que h2{

    font-size:34px;

}

.por-que p{

    font-size:19px;

}

}

</style>

</head>

<body>

<section class="por-que">

<h2>¿Por qué comprar en Vesira?</h2>

<p>Podríamos intentar convencerte.</p>

<p>Si necesitáramos hacerlo,<br>
significaría que aún nos queda mucho por mejorar.</p>

<a href="#">Descúbrelo →</a>

</section>

</body>
</html>
