<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Outfit",sans-serif;
}

body{

background:#f5f5f7;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

.stack{

position:relative;

width:360px;

height:340px;

}

.card{

position:absolute;

width:100%;

height:150px;

background:white;

border-radius:28px;

padding:28px;

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

box-shadow:0 18px 40px rgba(0,0,0,.08);

transition:.55s cubic-bezier(.2,.9,.2,1);

}

.card h2{

font-size:34px;

font-weight:700;

}

.card p{

margin-top:6px;

color:#7a7a7a;

font-size:15px;

}

.estado{

width:34px;

height:34px;

border-radius:50%;

border:2px solid #d8d8d8;

display:flex;

align-items:center;

justify-content:center;

font-weight:700;

transition:.3s;

}

.card:nth-child(1){

transform:translateY(70px) rotate(-6deg);

}

.card:nth-child(2){

transform:translateY(100px) rotate(6deg);

}

.stack.loaded .card:nth-child(1){

transform:translateY(0) rotate(-2deg);

}

.stack.loaded .card:nth-child(2){

transform:translateY(120px) rotate(2deg);

}

.card.active{

transform:translateY(-12px) rotate(0deg)!important;

border:2px solid #111;

z-index:10;

}

.card.active .estado{

background:#111;

border-color:#111;

color:white;

}

.card:not(.active){

opacity:.88;

}

</style>

</head>

<body>

<div class="stack">

<div class="card active">

<div>

<h2>Fundas</h2>

<p>Protección premium.</p>

</div>

<div class="estado">✓</div>

</div>

<div class="card">

<div>

<h2>Protectores</h2>

<p>Cristal templado.</p>

</div>

<div class="estado"></div>

</div>

</div>

<script>

const stack=document.querySelector(".stack");

setTimeout(()=>{

stack.classList.add("loaded");

},200);

document.querySelectorAll(".card").forEach(card=>{

card.onclick=()=>{

document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));

card.classList.add("active");

document.querySelectorAll(".estado").forEach(e=>e.textContent="");

card.querySelector(".estado").textContent="✓";

}

});

</script>

</body>
</html>
