<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{
    background:#fff;
    color:#111;
    padding:70px 22px;
}

.colecciones{

    max-width:1250px;
    margin:auto;

}

.subtitulo{

    font-size:12px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:#8A8A8A;

}

h2{

    margin-top:8px;
    font-size:40px;
    font-weight:700;
    line-height:1.1;

}

.grid{

    margin-top:35px;

    display:grid;

    grid-template-columns:repeat(12,1fr);

    gap:18px;

}

.tarjeta{

    position:relative;

    overflow:hidden;

    border-radius:24px;

    cursor:pointer;

    min-height:240px;

}

.tarjeta img{

    width:100%;
    height:100%;
    object-fit:cover;

    transition:.45s;

}

.tarjeta:hover img{

    transform:scale(1.08);

}

.tarjeta::before{

    content:"";

    position:absolute;
    inset:0;

    background:linear-gradient(to top,rgba(0,0,0,.55),transparent);

}

.info{

    position:absolute;

    left:24px;
    bottom:22px;

    color:white;

}

.info h3{

    font-size:30px;
    font-weight:700;

}

.info p{

    margin-top:4px;

    font-size:15px;
    opacity:.9;

}

/* tamaños */

.fundas{

    grid-column:span 7;
    height:420px;

}

.protectores{

    grid-column:span 5;
    height:420px;

}

.cargadores{

    grid-column:span 4;
    height:220px;

}

.accesorios{

    grid-column:span 8;
    height:220px;

}

@media(max-width:768px){

body{

    padding:50px 16px;

}

h2{

    font-size:30px;

}

.grid{

    display:flex;

    overflow-x:auto;

    gap:16px;

    scroll-snap-type:x mandatory;

    padding-bottom:8px;

}

.grid::-webkit-scrollbar{

    display:none;

}

.tarjeta{

    min-width:270px;
    height:340px;

    flex:none;

    scroll-snap-align:start;

}

.info h3{

    font-size:26px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<p class="subtitulo">DESCUBRE</p>

<h2>Explora nuestras colecciones</h2>

<div class="grid">

<div class="tarjeta fundas">

<img src="https://picsum.photos/900/700?1">

<div class="info">

<h3>Fundas</h3>

<p>Protección con estilo.</p>

</div>

</div>

<div class="tarjeta protectores">

<img src="https://picsum.photos/700/700?2">

<div class="info">

<h3>Protectores</h3>

<p>Cristal templado premium.</p>

</div>

</div>

<div class="tarjeta cargadores">

<img src="https://picsum.photos/600/500?3">

<div class="info">

<h3>Cargadores</h3>

</div>

</div>

<div class="tarjeta accesorios">

<img src="https://picsum.photos/900/500?4">

<div class="info">

<h3>Accesorios</h3>

<p>Todo para tu dispositivo.</p>

</div>

</div>

</div>

</section>

</body>
</html>
