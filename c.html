<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{

    background:#fafafa;

    padding:70px 20px;

}

.colecciones{

    max-width:1200px;

    margin:auto;

}

.slider{

    position:relative;

    width:100%;

    aspect-ratio:16/9;

    max-height:650px;

    overflow:hidden;

    border-radius:34px;

}

.slide{

    position:absolute;

    inset:0;

    opacity:0;

    transform:translateX(100%);

    transition:
    transform .9s cubic-bezier(.22,1,.36,1),
    opacity .9s;

    text-decoration:none;

    color:white;

}

.slide.active{

    opacity:1;

    transform:translateX(0);

    z-index:2;

}

.slide.salida{

    transform:translateX(-100%);

    opacity:1;

}

.slide img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.overlay{

    position:absolute;

    inset:0;

    background:linear-gradient(to top,
    rgba(0,0,0,.45),
    rgba(0,0,0,.08),
    transparent);

}

.info{

    position:absolute;

    left:45px;

    bottom:40px;

}

.info h2{

    font-size:52px;

    font-weight:700;

}

.info p{

    margin-top:8px;

    font-size:17px;

    opacity:.95;

}

@media(max-width:768px){

body{

padding:18px;

}

.slider{

aspect-ratio:4/5;

border-radius:24px;

}

.info{

left:24px;

bottom:24px;

}

.info h2{

font-size:34px;

}

.info p{

font-size:15px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<div class="slider">

<a href="#" class="slide active">

<img src="https://picsum.photos/1400/900?1">

<div class="overlay"></div>

<div class="info">

<h2>Fundas</h2>

<p>Ver colección →</p>

</div>

</a>

<a href="#" class="slide">

<img src="https://picsum.photos/1400/900?2">

<div class="overlay"></div>

<div class="info">

<h2>Protectores</h2>

<p>Ver colección →</p>

</div>

</a>

<a href="#" class="slide">

<img src="https://picsum.photos/1400/900?3">

<div class="overlay"></div>

<div class="info">

<h2>Cargadores</h2>

<p>Ver colección →</p>

</div>

</a>

<a href="#" class="slide">

<img src="https://picsum.photos/1400/900?4">

<div class="overlay"></div>

<div class="info">

<h2>Accesorios</h2>

<p>Ver colección →</p>

</div>

</a>

</div>

</section>

<script>

const slides=document.querySelectorAll(".slide");

let actual=0;

setInterval(()=>{

const anterior=slides[actual];

actual=(actual+1)%slides.length;

const siguiente=slides[actual];

anterior.classList.add("salida");
anterior.classList.remove("active");

siguiente.classList.add("active");

setTimeout(()=>{

anterior.classList.remove("salida");

},900);

},4500);

</script>

</body>

</html>
