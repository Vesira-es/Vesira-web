<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Outfit",sans-serif;
}

body{

background:#f5f5f7;

padding:80px 20px;

overflow-x:hidden;

}

section{

max-width:900px;

margin:auto;

}

small{

letter-spacing:.35em;

font-size:12px;

color:#8a8a8a;

}

h2{

margin-top:10px;

font-size:42px;

font-weight:700;

}

.pila{

margin-top:60px;

display:flex;

flex-direction:column;

align-items:center;

gap:0;

}

.carta{

width:100%;

max-width:700px;

height:150px;

background:white;

border-radius:30px;

box-shadow:0 20px 45px rgba(0,0,0,.08);

display:flex;

justify-content:space-between;

align-items:center;

padding:0 40px;

margin-top:-90px;

opacity:0;

transform:translateY(-180px) rotate(-4deg);

transition:1s cubic-bezier(.2,.9,.2,1);

cursor:pointer;

}

.carta:first-child{

margin-top:0;

}

.carta.visible{

opacity:1;

transform:translateY(0) rotate(0deg);

}

.carta:hover{

transform:scale(1.02);

}

.numero{

font-size:60px;

font-weight:200;

color:#d9d9d9;

}

.texto h3{

font-size:34px;

}

.texto p{

margin-top:6px;

color:#777;

font-size:16px;

}

.flecha{

font-size:34px;

}

@media(max-width:768px){

body{

padding:50px 16px;

}

h2{

font-size:30px;

}

.carta{

height:120px;

padding:0 24px;

margin-top:-65px;

}

.texto h3{

font-size:24px;

}

.texto p{

font-size:14px;

}

.numero{

font-size:42px;

}

}

</style>

</head>

<body>

<section>

<small>EXPLORA</small>

<h2>Colecciones</h2>

<div class="pila">

<div class="carta">

<div class="texto">

<h3>Fundas</h3>

<p>Protección con estilo.</p>

</div>

<div class="numero">01</div>

</div>

<div class="carta">

<div class="texto">

<h3>Protectores</h3>

<p>Cristal templado premium.</p>

</div>

<div class="numero">02</div>

</div>

<div class="carta">

<div class="texto">

<h3>Cargadores</h3>

<p>Carga rápida.</p>

</div>

<div class="numero">03</div>

</div>

<div class="carta">

<div class="texto">

<h3>Accesorios</h3>

<p>Completa tu setup.</p>

</div>

<div class="numero">04</div>

</div>

</div>

</section>

<script>

const observer=new IntersectionObserver((entries)=>{

entries.forEach((entry,index)=>{

if(entry.isIntersecting){

setTimeout(()=>{

entry.target.classList.add("visible");

},index*250);

}

});

},{threshold:.4});

document.querySelectorAll(".carta").forEach(carta=>{

observer.observe(carta);

});

</script>

</body>
</html>
