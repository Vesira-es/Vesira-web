<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Outfit",sans-serif;
}

body{

background:#f7f7f8;

padding:80px 20px;

}

section{

max-width:1100px;

margin:auto;

}

small{

letter-spacing:.35em;

font-size:12px;

color:#999;

}

h2{

margin-top:8px;

font-size:44px;

margin-bottom:55px;

}

.stack{

position:relative;

height:650px;

}

.card{

position:absolute;

left:50%;

transform:translateX(-50%);

width:92%;

height:220px;

border-radius:34px;

background:white;

box-shadow:0 18px 45px rgba(0,0,0,.08);

overflow:hidden;

cursor:pointer;

transition:.45s cubic-bezier(.22,1,.36,1);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 45px;

}

.card:nth-child(1){

top:0;
z-index:4;

}

.card:nth-child(2){

top:110px;
width:88%;
z-index:3;

}

.card:nth-child(3){

top:220px;
width:84%;
z-index:2;

}

.card:nth-child(4){

top:330px;
width:80%;
z-index:1;

}

.card:hover{

transform:translateX(-50%) translateY(-8px);

width:95%;

z-index:20;

}

.card img{

position:absolute;

left:-25px;

bottom:-18px;

height:250px;

transition:.45s;

filter:drop-shadow(0 18px 25px rgba(0,0,0,.15));

}

.card:hover img{

transform:rotate(-8deg) scale(1.06);

}

.info{

margin-left:210px;

}

.info h3{

font-size:38px;

}

.info p{

margin-top:8px;

color:#666;

font-size:17px;

}

.arrow{

font-size:40px;

transition:.3s;

}

.card:hover .arrow{

transform:translateX(10px);

}

@media(max-width:768px){

.stack{

height:500px;

}

.card{

height:150px;

padding:0 22px;

}

.card:nth-child(2){

top:80px;

}

.card:nth-child(3){

top:160px;

}

.card:nth-child(4){

top:240px;

}

.card img{

height:155px;

left:-8px;

}

.info{

margin-left:120px;

}

.info h3{

font-size:24px;

}

.info p{

display:none;

}

.arrow{

font-size:26px;

}

h2{

font-size:32px;

}

}

</style>

</head>

<body>

<section>

<small>EXPLORA</small>

<h2>Descubre nuestras colecciones</h2>

<div class="stack">

<div class="card">

<img src="https://picsum.photos/400/400?1">

<div class="info">

<h3>Fundas</h3>

<p>Protección premium.</p>

</div>

<div class="arrow">→</div>

</div>

<div class="card">

<img src="https://picsum.photos/400/400?2">

<div class="info">

<h3>Protectores</h3>

<p>Cristal templado.</p>

</div>

<div class="arrow">→</div>

</div>

<div class="card">

<img src="https://picsum.photos/400/400?3">

<div class="info">

<h3>Cargadores</h3>

<p>Carga rápida.</p>

</div>

<div class="arrow">→</div>

</div>

<div class="card">

<img src="https://picsum.photos/400/400?4">

<div class="info">

<h3>Accesorios</h3>

<p>Todo para tu dispositivo.</p>

</div>

<div class="arrow">→</div>

</div>

</div>

</section>

</body>

</html>
