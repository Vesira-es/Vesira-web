<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Outfit",sans-serif;
}

body{

background:#fafafa;

color:#111;

}

.colecciones{

max-width:1200px;

margin:auto;

padding:90px 25px;

}

.slider{

position:relative;

height:680px;

overflow:hidden;

}

.slide{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

opacity:0;

transform:translateY(25px);

transition:.7s ease;

}

.slide.active{

opacity:1;

transform:none;

}

.tag{

font-size:12px;

letter-spacing:.35em;

text-transform:uppercase;

color:#999;

}

h2{

margin-top:12px;

font-size:50px;

font-weight:700;

}

.imagen{

margin-top:45px;

width:100%;

display:flex;

justify-content:center;

}

.imagen img{

width:min(90%,520px);

aspect-ratio:1;

object-fit:cover;

border-radius:36px;

box-shadow:0 25px 60px rgba(0,0,0,.08);

transition:.5s;

}

.slide.active img{

animation:flotar 5s ease-in-out infinite;

}

@keyframes flotar{

0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}

}

.boton{

margin-top:45px;

display:flex;

align-items:center;

gap:10px;

padding:14px 28px;

border-radius:999px;

background:#111;

color:white;

text-decoration:none;

font-size:15px;

transition:.25s;

}

.boton:hover{

transform:translateY(-3px);

}

.boton span{

transition:.25s;

}

.boton:hover span{

transform:translateX(5px);

}

@media(max-width:768px){

.colecciones{

padding:60px 18px;

}

.slider{

height:520px;

}

h2{

font-size:34px;

}

.imagen{

margin-top:30px;

}

.imagen img{

width:92%;

border-radius:26px;

}

.boton{

margin-top:30px;

padding:12px 22px;

}

}

</style>

</head>

<body>

<section class="colecciones">

<div class="slider">

<div class="slide active">

<div class="tag">

COLECCIÓN

</div>

<h2>

Fundas

</h2>

<div class="imagen">

<img src="https://picsum.photos/800/800?1">

</div>

<a href="#" class="boton">

Ver colección

<span>→</span>

</a>

</div>

<div class="slide">

<div class="tag">

COLECCIÓN

</div>

<h2>

Protectores

</h2>

<div class="imagen">

<img src="https://picsum.photos/800/800?2">

</div>

<a href="#" class="boton">

Ver colección

<span>→</span>

</a>

</div>

<div class="slide">

<div class="tag">

COLECCIÓN

</div>

<h2>

Cargadores

</h2>

<div class="imagen">

<img src="https://picsum.photos/800/800?3">

</div>

<a href="#" class="boton">

Ver colección

<span>→</span>

</a>

</div>

<div class="slide">

<div class="tag">

COLECCIÓN

</div>

<h2>

Accesorios

</h2>

<div class="imagen">

<img src="https://picsum.photos/800/800?4">

</div>

<a href="#" class="boton">

Ver colección

<span>→</span>

</a>

</div>

</div>

</section>

<script>

const slides=document.querySelectorAll(".slide");

let actual=0;

setInterval(()=>{

slides[actual].classList.remove("active");

actual=(actual+1)%slides.length;

slides[actual].classList.add("active");

},4500);

</script>

</body>

</html>
