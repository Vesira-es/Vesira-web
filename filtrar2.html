<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Bricolage Grotesque",sans-serif;
}

body{

background:#fafafa;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

.selector{

width:min(850px,100%);

}

h2{

font-size:40px;

font-weight:600;

text-align:center;

margin-bottom:15px;

}

.sub{

text-align:center;

color:#777;

margin-bottom:45px;

}

.barra{

display:flex;

align-items:center;

gap:12px;

background:white;

border:1px solid #ececec;

border-radius:999px;

padding:12px;

}

.item{

position:relative;

padding:12px 18px;

border-radius:999px;

cursor:pointer;

transition:.25s;

white-space:nowrap;

}

.item:hover{

background:#f4f4f4;

}

.separador{

color:#d5d5d5;

}

.buscar{

margin-left:auto;

width:46px;
height:46px;

border:none;

border-radius:50%;

background:black;

color:white;

cursor:pointer;

font-size:18px;

transition:.25s;

}

.buscar:hover{

transform:scale(1.05);

}

.lista{

display:none;

position:absolute;

top:60px;
left:0;

background:white;

border:1px solid #ececec;

border-radius:18px;

min-width:220px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

overflow:hidden;

animation:fade .18s;

z-index:100;

}

.opcion{

padding:14px 18px;

cursor:pointer;

transition:.2s;

}

.opcion:hover{

background:#f5f5f5;

padding-left:24px;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(-10px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media(max-width:700px){

.barra{

flex-wrap:wrap;

border-radius:24px;

}

.item{

width:100%;

}

.separador{

display:none;

}

.buscar{

width:100%;

border-radius:14px;

margin-left:0;

margin-top:8px;

}

}

</style>

</head>

<body>

<div class="selector">

<h2>Find your accessory</h2>

<div class="sub">Fast. Clean. Compatible.</div>

<div class="barra">

<div class="item">

<span id="marca">🍎 Apple</span>

<div class="lista">

<div class="opcion">🍎 Apple</div>
<div class="opcion">📱 Samsung</div>
<div class="opcion">🔷 Google</div>
<div class="opcion">⚡ Xiaomi</div>

</div>

</div>

<div class="separador">·</div>

<div class="item">

<span id="modelo">iPhone 16 Pro</span>

<div class="lista">

<div class="opcion">iPhone 16</div>
<div class="opcion">iPhone 16 Plus</div>
<div class="opcion">iPhone 16 Pro</div>
<div class="opcion">iPhone 16 Pro Max</div>

</div>

</div>

<div class="separador">·</div>

<div class="item">

<span id="producto">All products</span>

<div class="lista">

<div class="opcion">All products</div>
<div class="opcion">Cases</div>
<div class="opcion">Screen Protectors</div>
<div class="opcion">Chargers</div>

</div>

</div>

<button class="buscar">

→

</button>

</div>

</div>

<script>

document.querySelectorAll(".item").forEach(item=>{

item.onclick=(e)=>{

e.stopPropagation();

const lista=item.querySelector(".lista");

document.querySelectorAll(".lista").forEach(l=>{

if(l!==lista){

l.style.display="none";

}

});

lista.style.display=

lista.style.display==="block"

?

"none"

:

"block";

};

});

document.querySelectorAll(".opcion").forEach(op=>{

op.onclick=(e)=>{

e.stopPropagation();

op.parentElement.previousElementSibling.textContent=

op.textContent;

op.parentElement.style.display="none";

};

});

document.onclick=()=>{

document.querySelectorAll(".lista").forEach(l=>{

l.style.display="none";

});

};

</script>

</body>
</html>
