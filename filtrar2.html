<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Outfit",sans-serif;
}

body{

    background:#fafafa;
    color:#111;
    display:flex;
    justify-content:center;
    padding:60px 20px;

}

.finder{

    width:100%;
    max-width:650px;

}

.subtitulo{

    font-size:12px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:#8b8b8b;

}

h2{

    margin-top:8px;
    font-size:38px;
    font-weight:700;
    line-height:1.1;

}

.descripcion{

    margin-top:12px;
    color:#666;
    line-height:1.5;

}

.selector{

    margin-top:35px;

    background:white;

    border:1px solid #e8e8e8;

    border-radius:18px;

    padding:18px 22px;

    cursor:pointer;

    transition:.25s;

}

.selector:hover{

    border-color:#111;

}

.titulo{

    font-size:13px;
    color:#888;

}

.valor{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:6px;

    font-size:18px;
    font-weight:500;

}

.popup{

    margin-top:12px;

    background:white;

    border:1px solid #e8e8e8;

    border-radius:18px;

    overflow:hidden;

    display:none;

}

.popup input{

    width:100%;

    border:none;
    border-bottom:1px solid #ececec;

    padding:16px 18px;

    font-size:15px;

    outline:none;

}

.lista{

    max-height:260px;

    overflow-y:auto;

}

.lista::-webkit-scrollbar{

    width:5px;

}

.lista::-webkit-scrollbar-thumb{

    background:#d9d9d9;

    border-radius:20px;

}

.opcion{

    padding:16px 18px;

    transition:.2s;

    cursor:pointer;

}

.opcion:hover{

    background:#f5f5f5;

}

.boton{

    margin-top:30px;

    width:100%;

    border:none;

    background:#111;

    color:white;

    border-radius:18px;

    padding:18px;

    font-size:16px;

    cursor:pointer;

}

.boton:hover{

    background:black;

}

@media(max-width:768px){

    h2{

        font-size:30px;

    }

}

</style>

</head>
<body>

<section class="finder">

    <div class="subtitulo">
        ENCUENTRA TU MÓVIL
    </div>

    <h2>
        Todo empieza por tu dispositivo.
    </h2>

    <p class="descripcion">
        Selecciona tu marca para descubrir todos los accesorios compatibles.
    </p>

    <div class="selector" id="selector">

        <div class="titulo">
            Marca
        </div>

        <div class="valor">

            <span id="marca">
                Selecciona una marca
            </span>

            <span>⌄</span>

        </div>

    </div>

    <div class="popup" id="popup">

        <input
        type="text"
        placeholder="Buscar marca...">

        <div class="lista">

            <div class="opcion">Apple</div>
            <div class="opcion">Samsung</div>
            <div class="opcion">Google</div>
            <div class="opcion">Nothing</div>
            <div class="opcion">Xiaomi</div>
            <div class="opcion">OnePlus</div>
            <div class="opcion">Motorola</div>
            <div class="opcion">Huawei</div>
            <div class="opcion">Oppo</div>
            <div class="opcion">Vivo</div>
            <div class="opcion">Sony</div>
            <div class="opcion">Honor</div>
            <div class="opcion">Realme</div>

        </div>

    </div>

    <button class="boton">
        Ver accesorios
    </button>

</section>

<script>

const selector = document.getElementById("selector");
const popup = document.getElementById("popup");
const marca = document.getElementById("marca");

selector.onclick = ()=>{

    popup.style.display =
    popup.style.display=="block"
    ? "none"
    : "block";

}

document.querySelectorAll(".opcion").forEach(opcion=>{

    opcion.onclick=()=>{

        marca.innerHTML=opcion.innerHTML;

        popup.style.display="none";

    }

});

</script>

</body>
</html>
