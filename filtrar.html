<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Bricolage Grotesque",sans-serif;
}

body{

    background:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:30px;

}

.selector{

    width:min(500px,100%);

}

h2{

    text-align:center;

    font-size:34px;

    margin-bottom:10px;

}

p{

    text-align:center;

    color:#777;

    margin-bottom:40px;

}

/* ---------------- */

.linea{

    position:relative;

    padding:18px 0;

    border-bottom:1px solid #ececec;

    cursor:pointer;

    transition:.2s;

}

.linea:hover{

    padding-left:8px;

}

.encabezado{

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:18px;

}

.valor{

    color:#888;

}

.lista{

    display:none;

    margin-top:15px;

    animation:fade .2s;

}

.opcion{

    padding:12px 0;

    color:#555;

    cursor:pointer;

    transition:.2s;

}

.opcion:hover{

    color:black;

    padding-left:10px;

}

.buscar{

    margin-top:35px;

    width:100%;

    padding:18px;

    border:none;

    border-radius:999px;

    background:black;

    color:white;

    cursor:pointer;

    font-size:16px;

    transition:.25s;

}

.buscar:hover{

    opacity:.85;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(-10px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="selector">

<h2>Choose your device</h2>

<p>Compatible accessories in seconds.</p>

<div class="linea">

<div class="encabezado">

<span>Brand</span>

<span class="valor" id="marca">Apple</span>

</div>

<div class="lista" id="listaMarca">

<div class="opcion">Apple</div>
<div class="opcion">Samsung</div>
<div class="opcion">Google</div>
<div class="opcion">Nothing</div>
<div class="opcion">Xiaomi</div>

</div>

</div>

<div class="linea">

<div class="encabezado">

<span>Model</span>

<span class="valor" id="modelo">Select</span>

</div>

<div class="lista">

<div class="opcion">iPhone 16</div>
<div class="opcion">iPhone 16 Pro</div>
<div class="opcion">iPhone 15</div>

</div>

</div>

<div class="linea">

<div class="encabezado">

<span>Product</span>

<span class="valor" id="producto">All</span>

</div>

<div class="lista">

<div class="opcion">All</div>
<div class="opcion">Cases</div>
<div class="opcion">Screen Protectors</div>
<div class="opcion">Chargers</div>

</div>

</div>

<button class="buscar">

Explore →

</button>

</div>

<script>

document.querySelectorAll(".linea").forEach(linea=>{

linea.addEventListener("click",()=>{

const lista=linea.querySelector(".lista");

document.querySelectorAll(".lista").forEach(l=>{

if(l!==lista){

l.style.display="none";

}

});

lista.style.display=

lista.style.display==="block"

? "none"

: "block";

});

});

document.querySelectorAll(".lista").forEach(lista=>{

lista.querySelectorAll(".opcion").forEach(opcion=>{

opcion.onclick=(e)=>{

e.stopPropagation();

lista.previousElementSibling.lastElementChild.textContent=

opcion.textContent;

lista.style.display="none";

};

});

});

</script>

</body>
</html>
