  <script>

    const GOOGLE_MAPS_BROWSER_KEY =

      "AIzaSyDgFV-cuVbMDLOBjrEREn1-75r0qc-vucM";

    const ADDRESS_VALIDATION_FUNCTION_URL =

      "https://smxdiexgxxwjlvsdmzrq.supabase.co/functions/v1/validar-direccion";

    const AFFILIATE_VALIDATION_FUNCTION_URL =

      "https://smxdiexgxxwjlvsdmzrq.supabase.co/functions/v1/validar-afiliado";

    const app = document.getElementById("app");

    let affiliateState = {
      codigo: "",
      afiliado: null
    };

    let affiliateRequestId = 0;

    let googlePlacesReady = false;

    let latestAutocompleteRequest = 0;

    function getCart() {

      try {

        const data = JSON.parse(

localStorage.getItem("vesiraCarrito") || "[]"

        );

        return Array.isArray(data) ? data : [];

      } catch {

        return [];

      }

    }

    function euro(value) {

      return (

Number(value || 0)

          .toFixed(2)

          .replace(".", ",") + " €"

      );

    }

    function totalCart(cart) {

      return cart.reduce(

        (sum, item) =>

sum +

Number(item.precio || 0) *

Number(item.cantidad || 0),

        0

      );

    }

    function normalizeAffiliateCode(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, "");
    }

    function cleanAffiliateCodeForInput(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, "");
    }

    function calculateAffiliateDiscount(subtotal) {
      const percent = Number(
        affiliateState.afiliado?.descuento_porcentaje || 0
      );

      if (!affiliateState.afiliado || percent <= 0) {
        return 0;
      }

      return Math.min(
        Number(subtotal || 0),
        Number(subtotal || 0) * percent / 100
      );
    }

    function updateAffiliateSummary() {
      const cart = getCart();
      const subtotal = totalCart(cart);
      const discount = calculateAffiliateDiscount(subtotal);
      const total = Math.max(0, subtotal - discount);

      const discountRow =
        document.getElementById("affiliateDiscountRow");

      const discountAmount =
        document.getElementById("affiliateDiscountAmount");

      const checkoutTotal =
        document.getElementById("checkoutTotal");

      if (discountRow) {
        discountRow.style.display =
          discount > 0 ? "flex" : "none";
      }

      if (discountAmount) {
        discountAmount.textContent =
          discount > 0 ? `-${euro(discount)}` : euro(0);
      }

      if (checkoutTotal) {
        checkoutTotal.textContent = euro(total);
      }
    }

    async function validateAffiliateCode(code) {
      const exactCode = normalizeAffiliateCode(code);

      if (!exactCode) {
        throw new Error("Cupón no válido.");
      }

      const controller = new AbortController();

      const timeoutId = window.setTimeout(() => {
        controller.abort();
      }, 8000);

      let response;

      try {
        response = await fetch(
          AFFILIATE_VALIDATION_FUNCTION_URL,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              codigo: exactCode
            }),
            signal: controller.signal
          }
        );
      } catch (error) {
        if (error?.name === "AbortError") {
          throw new Error(
            "No se pudo comprobar el cupón. Inténtalo de nuevo."
          );
        }

        throw new Error(
          "No se pudo comprobar el cupón. Inténtalo de nuevo."
        );
      } finally {
        window.clearTimeout(timeoutId);
      }

      const result = await response
        .json()
        .catch(() => ({}));

      if (
        response.status === 401 ||
        response.status === 403
      ) {
        throw new Error(
          "No se pudo comprobar el cupón. Revisa validar-afiliado en Supabase."
        );
      }

      const valido =
        result?.valido === true ||
        result?.valid === true;

      const afiliado =
        result?.afiliado ||
        result?.affiliate ||
        null;

      if (!response.ok || !valido || !afiliado) {
        throw new Error("Cupón no válido.");
      }

      const serverCode = String(
        afiliado.codigo ?? ""
      ).trim();

      if (serverCode !== exactCode) {
        throw new Error("Cupón no válido.");
      }

      return afiliado;
    }

    async function applyAffiliateCode(code = null) {
      const input =
        document.getElementById("affiliateCode");

      const button =
        document.getElementById(
          "affiliateApplyButton"
        );

      const status =
        document.getElementById("affiliateStatus");

      const inputCode =
        cleanAffiliateCodeForInput(
          code !== null
            ? code
            : input?.value || ""
        );

      const exactCode =
        normalizeAffiliateCode(inputCode);

      if (input) {
        input.value = inputCode;
      }

      /*
       * Escribir un nuevo código NO elimina el cupón aplicado.
       * Solo un código nuevo y válido reemplaza al anterior.
       */
      const previousAffiliateState = {
        codigo: affiliateState.codigo,
        afiliado: affiliateState.afiliado
      };

      if (!exactCode) {
        affiliateRequestId++;

        if (status) {
          status.textContent =
            "Cupón no válido.";
          status.classList.remove(
            "ok",
            "loading"
          );
          status.classList.add("error");
          status.style.display = "block";
        }

        affiliateState =
          previousAffiliateState;
        updateAffiliateSummary();

        return null;
      }

      if (
        previousAffiliateState.codigo === exactCode &&
        previousAffiliateState.afiliado
      ) {
        const discountPercent =
          Number(
            previousAffiliateState.afiliado
              ?.descuento_porcentaje || 0
          );

        if (status) {
          status.textContent =
            `Código descuento aplicado · ${discountPercent}%`;
          status.classList.add("ok");
          status.classList.remove("error");
          status.style.display = "block";
        }

        updateAffiliateSummary();
        return previousAffiliateState.afiliado;
      }

      const requestId =
        ++affiliateRequestId;

      if (button) {
        button.disabled = true;
        button.textContent =
          "Comprobando...";
      }

      if (status) {
        status.textContent = "";
        status.classList.remove(
          "ok",
          "error",
          "loading"
        );
        status.style.display = "none";
      }

      try {
        const afiliado =
          await validateAffiliateCode(
            exactCode
          );

        if (
          requestId !== affiliateRequestId
        ) {
          return null;
        }

        /* Solo aquí sustituimos el cupón anterior. */
        affiliateState = {
          codigo: exactCode,
          afiliado
        };

        const discountPercent =
          Number(
            afiliado?.descuento_porcentaje || 0
          );

        if (status) {
          status.textContent =
            `Código descuento aplicado · ${discountPercent}%`;
          status.classList.add("ok");
          status.classList.remove("error");
          status.style.display = "block";
        }

        updateAffiliateSummary();

        return afiliado;
      } catch (error) {
        if (
          requestId !== affiliateRequestId
        ) {
          return null;
        }

        /* El cupón anterior sigue activo si el nuevo falla. */
        affiliateState =
          previousAffiliateState;

        updateAffiliateSummary();

        if (status) {
          status.textContent =
            error?.message ||
            "Cupón no válido.";

          status.classList.remove(
            "ok",
            "loading"
          );
          status.classList.add("error");
          status.style.display = "block";
        }

        return null;
      } finally {
        if (
          requestId === affiliateRequestId &&
          button
        ) {
          button.disabled = false;
          button.textContent =
            "Aplicar";
        }
      }
    }

    function initAffiliateUI() {
      const input =
        document.getElementById("affiliateCode");

      const button =
        document.getElementById("affiliateApplyButton");

      const status =
        document.getElementById("affiliateStatus");

      const toggle =
        document.getElementById("affiliateToggleButton");

      const box =
        document.getElementById("affiliateBox");

      if (!input || !button || !status || !toggle || !box) {
        return;
      }

      toggle.addEventListener("click", () => {
        const shouldOpen = box.hidden;

        box.hidden = !shouldOpen;
        toggle.setAttribute(
          "aria-expanded",
          String(shouldOpen)
        );

        if (shouldOpen) {
          window.requestAnimationFrame(() => {
            input.focus();
          });
        }
      });

      input.addEventListener("input", () => {
        const inputCode =
          cleanAffiliateCodeForInput(
            input.value
          );

        input.value = inputCode;

        /*
         * Solo invalidamos comprobaciones en curso.
         * El cupón activo no cambia al escribir.
         */
        affiliateRequestId++;

        if (!affiliateState.afiliado) {
          status.textContent = "";
          status.classList.remove(
            "ok",
            "error",
            "loading"
          );
          status.style.display = "none";
        }
      });

      button.addEventListener("click", async () => {
        await applyAffiliateCode();
      });

      input.addEventListener("keydown", async event => {
        if (event.key !== "Enter") {
          return;
        }

        event.preventDefault();
        await applyAffiliateCode();
      });

    }

    function setAddressStatus(message, state = "") {

      const element =

document.getElementById("address-status");

      if (!element) {

        return;

      }

      element.textContent = message;

      element.classList.remove("ok", "error");

      if (state) {

        element.classList.add(state);

      }

    }

    function showError(message) {

      const element =

document.getElementById("error");

      if (!element) {

        return;

      }

      element.textContent = message || "";

      element.classList.toggle(

        "show",

Boolean(message)

      );

    }

    async function initGooglePlaces() {
      const container =
        document.getElementById("direccion-autocomplete");
      const hiddenInput =
        document.getElementById("direccion");

      if (!container || !hiddenInput) {
        return;
      }

      function getComponent(components, type) {
        const component = (components || []).find(
          item => (item.types || []).includes(type)
        );

        return component
          ? (
              component.longText ||
              component.shortText ||
              ""
            )
          : "";
      }

      function setFallbackInput(message = "") {
        const input = document.createElement("input");

        input.type = "text";
        input.id = "direccion-fallback";
        input.name = "direccion-visible";
        input.autocomplete = "street-address";
        input.placeholder = "Calle y número";
        input.required = true;

        Object.assign(input.style, {
          width: "100%",
          height: "48px",
          minHeight: "48px",
          maxHeight: "48px",
          padding: "0 13px",
          border: "1px solid var(--b)",
          borderRadius: "13px",
          background: "var(--input)",
          color: "#fff",
          outline: "none",
          fontSize: "16px",
          lineHeight: "48px"
        });

        input.addEventListener("input", () => {
          hiddenInput.value = input.value;
          setAddressStatus("", "");
        });

        container.replaceChildren(input);

        if (message) {
          setAddressStatus(message, "error");
        }

        window.googlePlacesReady = false;
      }

      try {
        if (!window.google?.maps?.importLibrary) {
          throw new Error(
            "No se pudo inicializar Google Maps."
          );
        }

        const {
          PlaceAutocompleteElement
        } = await google.maps.importLibrary("places");

        if (!PlaceAutocompleteElement) {
          throw new Error(
            "PlaceAutocompleteElement no está disponible."
          );
        }

        const placeAutocomplete =
          new PlaceAutocompleteElement({
            includedRegionCodes: ["es"],
            requestedLanguage: "es",
            requestedRegion: "es",
            placeholder:
              "Empieza a escribir tu dirección...",
            noInputIcon: true,
            name: "direccion-autocomplete"
          });

        placeAutocomplete.style.width = "100%";
        placeAutocomplete.style.height = "48px";
        placeAutocomplete.style.minHeight = "48px";
        placeAutocomplete.style.fontFamily =
          '"Outfit", Arial, sans-serif';
        placeAutocomplete.style.fontSize = "16px";
        placeAutocomplete.style.color = "#fff";
        placeAutocomplete.style.colorScheme = "dark";

        container.replaceChildren(placeAutocomplete);

        placeAutocomplete.addEventListener(
          "gmp-select",
          async event => {
            try {
              const prediction =
                event?.placePrediction;

              if (!prediction) {
                throw new Error(
                  "No se recibió la dirección seleccionada."
                );
              }

              const place = prediction.toPlace();

              await place.fetchFields({
                fields: [
                  "addressComponents",
                  "formattedAddress"
                ]
              });

              const components =
                place.addressComponents || [];

              const street =
                getComponent(components, "route");

              const streetNumber =
                getComponent(
                  components,
                  "street_number"
                );

              const city =
                getComponent(
                  components,
                  "locality"
                ) ||
                getComponent(
                  components,
                  "postal_town"
                ) ||
                getComponent(
                  components,
                  "sublocality"
                ) ||
                getComponent(
                  components,
                  "sublocality_level_1"
                ) ||
                getComponent(
                  components,
                  "administrative_area_level_2"
                );

              const postalCode =
                getComponent(
                  components,
                  "postal_code"
                );

              const direccion =
                [street, streetNumber]
                  .filter(Boolean)
                  .join(" ")
                  .trim() ||
                place.formattedAddress ||
                placeAutocomplete.value ||
                "";

              placeAutocomplete.value =
                direccion;

              hiddenInput.value =
                direccion;

              const cityInput =
                document.getElementById("ciudad");

              const postalInput =
                document.getElementById(
                  "codigoPostal"
                );

              if (cityInput) {
                cityInput.value = city;
              }

              if (postalInput) {
                postalInput.value = postalCode;
              }

              setAddressStatus("", "");
            } catch (error) {
              console.error(
                "Google Places selection error:",
                error
              );

              hiddenInput.value = "";

              setAddressStatus(
                "No se pudieron completar los datos de la dirección.",
                "error"
              );
            }
          }
        );

        placeAutocomplete.addEventListener(
          "gmp-error",
          event => {
            console.error(
              "Google Places backend error:",
              event
            );

            setAddressStatus(
              "Google Places no está disponible. Comprueba que Places API (New) está habilitada y permitida para esta clave.",
              "error"
            );
          }
        );

        placeAutocomplete.addEventListener(
          "input",
          () => {
            hiddenInput.value =
              String(placeAutocomplete.value || "");
            setAddressStatus("", "");
          }
        );

        window.googlePlacesReady = true;
      } catch (error) {
        console.error(
          "Google Places no disponible:",
          error
        );

        setFallbackInput(
          "No se pudo cargar Google Places. Puedes introducir la dirección manualmente."
        );
      }
    }

    async function validateShippingAddress() {

      const form =

document.getElementById(

          "checkoutForm"

        );

      if (!form) {

        throw new Error(

          "No se encontró el formulario."

        );

      }

      const data =

Object.fromEntries(

new FormData(form).entries()

        );

      const response =

        await fetch(

          ADDRESS_VALIDATION_FUNCTION_URL,

          {

            method: "POST",

            headers: {

              "Content-Type":

                "application/json"

            },

            body: JSON.stringify({

              address: {

                direccion:

String(

                    data.direccion || ""

                  ).trim(),

                ciudad:

String(

                    data.ciudad || ""

                  ).trim(),

                codigoPostal:

String(

                    data.codigoPostal || ""

                  ).trim(),

                countryCode: "ES"

              }

            })

          }

        );

      const result =

        await response

          .json()

          .catch(() => ({}));

      if (!response.ok) {

        throw new Error(

          result?.error ||

          "No se pudo comprobar la dirección."

        );

      }

      if (!result?.valid) {

        throw new Error(

          "La dirección no parece estar completa o confirmada. Revisa calle, número, ciudad y código postal."

        );

      }

      setAddressStatus(

        "Dirección verificada correctamente.",

        "ok"

      );

      return result;

    }

      app.innerHTML = `

    function escapeHtml(value) {

      return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }

    async function handleSubmit(event) {

event.preventDefault();

      const form = event.currentTarget;

      const button =

document.getElementById(

          "proceedButton"

        );

      showError("");

      const data =

Object.fromEntries(

new FormData(form).entries()

        );

      const direccionField = document.getElementById("direccion");

      if (direccionField) {

        data.direccion = String(direccionField.value || "").trim();

      }

      data.email = String(data.email || "").trim();

      data.nombre = String(data.nombre || "").trim();

      data.apellidos = String(data.apellidos || "").trim();

      data.ciudad = String(data.ciudad || "").trim();

      data.codigoPostal = String(data.codigoPostal || "").trim();

      if (

        !data.email ||

        !data.nombre ||

        !data.apellidos ||

        !data.direccion ||

        !data.ciudad ||

        !data.codigoPostal

      ) {

        showError(

          "Completa todos los campos obligatorios."

        );

        return;

      }

      const cart = getCart();

      if (!cart.length) {

        showError(

          "El carrito está vacío."

        );

        return;

      }

      /*
       * El pedido utiliza el último cupón aplicado correctamente.
       * El texto que el usuario esté escribiendo todavía es un borrador.
       */
      const currentAffiliateCode =
        cleanAffiliateCodeForInput(
          affiliateState.codigo || ""
        );

      const originalButton =

        button.innerHTML;

      button.disabled = true;

      button.innerHTML =
        "Comprobando dirección...";

      try {

        await validateShippingAddress();

        const subtotalOriginal = totalCart(cart);
        const descuento = calculateAffiliateDiscount(
          subtotalOriginal
        );
        const subtotalPagado = Math.max(
          0,
          subtotalOriginal - descuento
        );

        localStorage.setItem(

          "vesiraCheckout",

JSON.stringify({

            cliente: {

              email:

String(data.email).trim(),

              nombre:

String(data.nombre).trim(),

              apellidos:

String(data.apellidos).trim(),

              direccion:

String(data.direccion).trim(),

              ciudad:

String(data.ciudad).trim(),

              codigoPostal:

String(

                  data.codigoPostal

                ).trim(),

              nota:

String(

                  data.nota || ""

                ).trim()

            },

            carrito: cart,

            afiliado: affiliateState.afiliado
              ? {
                  id:
                    affiliateState.afiliado.id || null,
                  nombre:
                    affiliateState.afiliado.nombre || "",
                  codigo:
                    affiliateState.codigo || "",
                  descuentoPorcentaje:
                    Number(
                      affiliateState.afiliado
                        .descuento_porcentaje || 0
                    ),
                  comisionPorcentaje:
                    Number(
                      affiliateState.afiliado
                        .comision_porcentaje || 0
                    )
                }
              : null,

            codigoAfiliado:
              affiliateState.codigo || null,

            subtotalOriginal,

            descuento,

            subtotalPagado,

            creadoEn:

new Date().toISOString()

          })

        );

        button.innerHTML =

          "Preparando pago...";

window.location.href =

          "pago.html";

      } catch (error) {

console.error(

          "Checkout error:",

          error

        );

        button.disabled = false;

        button.innerHTML =

          originalButton;

        showError(

          error?.message ||

          "No se pudo validar la dirección."

        );

      }

    }

    render();

  </script>
