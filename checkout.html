<html lang="es">
<head>

  <meta name="theme-color" content="#0a0a0a">
  <title>Checkout · Vesira</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600;700&family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- Google Maps JavaScript API: la clave pública está restringida a vesira.es -->
  <script>
    (g => {
      var h, a, k,
        p = "The Google Maps JavaScript API",
        c = "google",
        l = "importLibrary",
        q = "__ib__",
        m = document,
        b = window;

      b = b[c] || (b[c] = {});
      var d = b.maps || (b.maps = {});
      var r = new Set();
      var e = new URLSearchParams();
      var u = () =>
        h ||
        (h = new Promise(async (f, n) => {
          await (a = m.createElement("script"));

          e.set("libraries", [...r] + "");

          for (k in g) {
            e.set(
              k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()),
              g[k]
            );
          }

          e.set("callback", c + ".maps." + q);
          a.src = "https://maps." + c + "apis.com/maps/api/js?" + e;
          d[q] = f;

          a.onerror = () => h = n(Error(p + " could not load."));
          a.nonce = m.querySelector("script[nonce]")?.nonce || "";
          m.head.append(a);
        }));

      d[l]
        ? console.warn(p + " only loads once. Ignoring:", g)

    })({

  <style>
    :root{
      --f:#0a0a0a;
      --t:#fff;
      --s:#8c8c8c;
      --b:rgba(255,255,255,.10);
      --c:#131313;
      --input:#101010;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:var(--f);
      color:var(--t);
      font-family:"Outfit",Arial,sans-serif;
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button,input,select,textarea{
      font:inherit;
    }

    .nav{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:70px;
      padding:0 30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(10,10,10,.80);
      border-bottom:1px solid var(--b);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      z-index:100;
    }

    .nav-left{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:100px;
      height:auto;
      display:block;
    }

    .eyewear{
      color:var(--s);
      font-size:8px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .nav-btn{
      width:38px;
      height:38px;
      border:0;
      border-radius:50%;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .nav-btn:hover{
      background:var(--c);
    }

    .wrap{
      width:min(1120px,calc(100% - 28px));
      margin:auto;
      padding:112px 0 80px;
    }

    .head{
      margin-bottom:30px;
    }

    .eyebrow{
      color:var(--s);
      font-size:9px;
      letter-spacing:.22em;
      text-transform:uppercase;
      margin-bottom:10px;
    }

    h1{
      font-family:"Bricolage Grotesque",Arial,sans-serif;
      font-weight:400;
      font-size:clamp(50px,7vw,88px);
      line-height:.82;
      letter-spacing:-.075em;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 340px;
      gap:22px;
      align-items:start;
    }

    .form{
      display:grid;
      gap:12px;
    }

    .section{
      border:1px solid var(--b);
      background:#0f0f0f;
      border-radius:22px;
      padding:20px;
    }

    .section-head{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:20px;
      margin-bottom:18px;
    }

    .section-head h2{
      font-family:"Bricolage Grotesque",Arial,sans-serif;
      font-size:28px;
      font-weight:400;
      letter-spacing:-.05em;
    }

    .section-number{
      color:#5e5e5e;
      font-size:9px;
      letter-spacing:.16em;
    }

    .fields{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .field{
      display:grid;
      gap:7px;
    }

    .field.full{
      grid-column:1/-1;
    }

    label{
      color:var(--s);
      font-size:9px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    input,select,textarea{
      width:100%;
      border:1px solid var(--b);
      border-radius:13px;
      background:var(--input);
      color:#fff;
      outline:none;
      font-size:12px;
    }

    input,select{
      min-height:48px;
      padding:0 13px;
    }

    textarea{
      min-height:95px;
      resize:vertical;
      padding:13px;
    }

    input:focus,select:focus,textarea:focus{
      border-color:rgba(255,255,255,.28);
    }

    .address-wrap{
      position:relative;
      width:100%;
    }

    .address-wrap gmp-place-autocomplete{
      display:block;
      width:100%;
      --gmpx-color-surface:#101010;
      --gmpx-color-on-surface:#fff;
      --gmpx-color-on-surface-variant:#8c8c8c;
      --gmpx-color-primary:#fff;
      --gmpx-color-outline:rgba(255,255,255,.10);
      --gmpx-font-family:"Outfit",Arial,sans-serif;
      --gmpx-font-size:12px;
    }

      margin-top:7px;
      color:var(--s);
      font-size:10px;
      line-height:1.5;
    }

    .address-status.ok{
      color:#7bdba5;
    }

    .address-status.error{
      color:#ff9c9c;
    }

    .delivery-note{
      margin-top:12px;
      padding:12px 13px;
      border:1px solid var(--b);
      border-radius:13px;
      color:var(--s);
      font-size:10px;
      line-height:1.5;
    }

    .summary{
      position:sticky;
      top:88px;
      border:1px solid var(--b);
      border-radius:22px;
      background:#0f0f0f;
      padding:19px;
    }

    .summary h2{
      font-family:"Bricolage Grotesque",Arial,sans-serif;
      font-size:28px;
      font-weight:400;
      letter-spacing:-.05em;
      margin-bottom:17px;
    }

    .summary-items{
      display:grid;
      gap:10px;
      padding-bottom:15px;
      border-bottom:1px solid var(--b);
    }

    .summary-item{
      display:grid;
      grid-template-columns:52px 1fr auto;
      gap:9px;
      align-items:center;
    }

    .summary-img{
      width:52px;
      height:47px;
      border-radius:10px;
      overflow:hidden;
      background:#f2f2ef;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .summary-img img{
      width:90%;
      height:90%;
      object-fit:contain;
    }

    .summary-name{
      font-family:"Bricolage Grotesque",Arial,sans-serif;
      font-size:15px;
      letter-spacing:-.04em;
    }

    .summary-qty{
      color:var(--s);
      font-size:9px;
      margin-top:3px;
    }

    .summary-price{
      font-size:11px;
      white-space:nowrap;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:8px 0;
      color:var(--s);
      font-size:10px;
    }

    .row.total{
      border-top:1px solid var(--b);
      margin-top:7px;
      padding-top:14px;
      color:#fff;
      font-size:14px;
      font-weight:500;
    }

    .buy{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:999px;
      background:#fff;
      color:#0a0a0a;
      font-size:11px;
      cursor:pointer;
      margin-top:14px;
      transition:transform .2s ease,opacity .2s ease;

    .buy:disabled{

      opacity:.55;
      transform:none;
    }

    .back{

      margin-top:12px;
      color:var(--s);
      font-size:9px;
      text-decoration:underline;
      text-underline-offset:4px;
    }

    .error{

      color:#ddd;
      font-size:9px;
      padding:0 4px;
      line-height:1.5;

      margin:120px auto;
      border:1px solid var(--b);
      border-radius:22px;
      padding:60px 20px;
      text-align:center;
    }

    .empty h2{
      font-family:"Bricolage Grotesque",Arial,sans-serif;
      font-size:40px;
      font-weight:400;
      letter-spacing:-.06em;
      margin-bottom:10px;
    }

    .empty p{
      color:var(--s);
      font-size:11px;
      margin-bottom:20px;
    }

    .empty a{
      display:inline-flex;
      min-height:45px;
      padding:0 19px;
      align-items:center;
      border-radius:999px;
      background:#fff;
      color:#0a0a0a;
      font-size:10px;

    @media(max-width:850px){

        padding:0 18px;

      }

        font-size:7px;
      }

      .wrap{
        width:calc(100% - 28px);
        padding:100px 0 65px;
      }

      h1{
        font-size:55px;
      }

      .section{
        padding:16px;
        border-radius:18px;
      }

      .section-head h2{
        font-size:25px;
      }

        grid-template-columns:1fr;
      }

      .field.full{
        grid-column:auto;
      }

      input,select{
        min-height:47px;
      }

      .summary{
        padding:16px;
        border-radius:18px;
      }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="nav-left">
      <a href="index.html">
        <img src="img/logo2.png" class="logo" alt="Vesira">
      </a>
      <span class="eyewear">Eyewear</span>

    <a class="nav-btn material-symbols-outlined" href="carrito.html" aria-label="Carrito">
      shopping_bag
    </a>
  </nav>

  <main id="app"></main>

  <script>
    const GOOGLE_MAPS_BROWSER_KEY =
      "PON_AQUI_TU_CLAVE_VESIRA_CHECKOUT";

    const ADDRESS_VALIDATION_FUNCTION_URL =
      "https://smxdiexgxxwjlvsdmzrq.supabase.co/functions/v1/validar-direccion";

    const app = document.getElementById("app");

    let googlePlacesReady = false;
    let latestAutocompleteRequest = 0;

    function getCart() {
      try {
        const data = JSON.parse(
          localStorage.getItem("vesiraCarrito") || "[]"
        );

        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function euro(value) {
      return (
        Number(value || 0)
          .toFixed(2)
          .replace(".", ",") + " €"
      );
    }

    function totalCart(cart) {
      return cart.reduce(
        (sum, item) =>
          sum +
          Number(item.precio || 0) *
          Number(item.cantidad || 0),
        0
      );
    }

    function setAddressStatus(message, state = "") {
      const element =
        document.getElementById("address-status");

      if (!element) {
        return;
      }

      element.textContent = message;
      element.classList.remove("ok", "error");

      if (state) {
        element.classList.add(state);
      }
    }

    function showError(message) {
      const element =
        document.getElementById("error");

      if (!element) {
        return;
      }

      element.textContent = message || "";
      element.classList.toggle(
        "show",
        Boolean(message)
      );
    }

    async function initGooglePlaces() {
      try {
        if (
          !GOOGLE_MAPS_BROWSER_KEY ||
          GOOGLE_MAPS_BROWSER_KEY ===
            "PON_AQUI_TU_CLAVE_VESIRA_CHECKOUT"
        ) {
          setAddressStatus(
            "Introduce tu dirección manualmente.",
            "error"
          );
          return;
        }

        await google.maps.importLibrary("places");

        const container =
          document.getElementById("direccion-autocomplete");

        const hiddenInput =
          document.getElementById("direccion");

        if (!container || !hiddenInput) {
          return;
        }

        const autocomplete =
          new google.maps.places.PlaceAutocompleteElement({
            includedRegionCodes: ["es"]
          });

        autocomplete.placeholder =
          "Empieza a escribir tu dirección...";

        autocomplete.includedRegionCodes = ["es"];
        autocomplete.requestedLanguage = "es";
        autocomplete.requestedRegion = "es";
        autocomplete.setAttribute(
          "aria-label",
          "Dirección de entrega"
        );

        container.replaceChildren(autocomplete);

        autocomplete.addEventListener(
          "gmp-select",
          async (event) => {
            try {
              const prediction =
                event.placePrediction;

              if (!prediction) {
                return;
              }

              const place =
                prediction.toPlace();

              await place.fetchFields({
                fields: [
                  "addressComponents",
                  "formattedAddress"
                ]
              });

              let street = "";
              let streetNumber = "";
              let city = "";
              let postalCode = "";
              let countryCode = "ES";

              for (const component of place.addressComponents || []) {
                const types = component.types || [];
                const longText = component.longText || "";
                const shortText = component.shortText || "";

                if (types.includes("route")) {
                  street = longText;
                }

                if (types.includes("street_number")) {
                  streetNumber = longText;
                }

                if (
                  !city &&
                  (
                    types.includes("locality") ||
                    types.includes("postal_town") ||
                    types.includes("sublocality") ||
                    types.includes("sublocality_level_1")
                  )
                ) {
                  city = longText;
                }

                if (types.includes("postal_code")) {
                  postalCode = longText;
                }

                if (types.includes("country")) {
                  countryCode = shortText || "ES";
                }
              }

              const direccion =
                [street, streetNumber]
                  .filter(Boolean)
                  .join(" ") ||
                place.formattedAddress ||
                "";

              hiddenInput.value = direccion;

              const cityInput =
                document.getElementById("ciudad");
              const postalInput =
                document.getElementById("codigoPostal");
              const country =
                document.getElementById("pais");

              if (cityInput) {
                cityInput.value = city;
              }

              if (postalInput) {
                postalInput.value = postalCode;
              }

              if (country && countryCode === "ES") {
                country.value = "España";
              }

              setAddressStatus(
                "Dirección seleccionada. La comprobaremos antes de continuar.",
                "ok"
              );
            } catch (error) {
              console.error(
                "Google Places selection error:",
                error
              );

              setAddressStatus(
                "No se pudieron completar los datos de la dirección.",
                "error"
              );
            }
          }
        );

        setAddressStatus(
          "Empieza a escribir y selecciona una de las sugerencias.",
          ""
        );

      } catch (error) {
        console.error(
          "Google Places no disponible:",
          error
        );

        setAddressStatus(
          "Google no está disponible ahora. Puedes escribir la dirección manualmente.",
          "error"
        );

        // Fallback manual si el widget no carga.
        const container =
          document.getElementById("direccion-autocomplete");
        const hiddenInput =
          document.getElementById("direccion");

        if (container && hiddenInput) {
          const input = document.createElement("input");
          input.type = "text";
          input.id = "direccion-fallback";
          input.autocomplete = "street-address";
          input.placeholder = "Calle y número";
          input.required = true;
          input.style.width = "100%";
          input.style.minHeight = "48px";
          input.style.padding = "0 13px";
          input.style.border = "1px solid var(--b)";
          input.style.borderRadius = "13px";
          input.style.background = "var(--input)";
          input.style.color = "#fff";
          input.style.outline = "none";
          input.style.fontSize = "12px";

          input.addEventListener("input", () => {
            hiddenInput.value = input.value;
          });

          container.replaceChildren(input);
        }
      }
    }

    async function validateShippingAddress() {
      const form =
        document.getElementById(
          "checkoutForm"
        );

      if (!form) {
        throw new Error(
          "No se encontró el formulario."
        );
      }

      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );

      const response =
        await fetch(
          ADDRESS_VALIDATION_FUNCTION_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              address: {
                direccion:
                  String(
                    data.direccion || ""
                  ).trim(),
                ciudad:
                  String(
                    data.ciudad || ""
                  ).trim(),
                codigoPostal:
                  String(
                    data.codigoPostal || ""
                  ).trim(),
                countryCode: "ES"
              }
            })
          }
        );

      const result =
        await response
          .json()
          .catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result?.error ||
          "No se pudo comprobar la dirección."
        );
      }

      if (!result?.valid) {
        throw new Error(
          "La dirección no parece estar completa o confirmada. Revisa calle, número, ciudad y código postal."
        );
      }

      setAddressStatus(
        "Dirección verificada correctamente.",
        "ok"
      );

      return result;
    }

    function render() {
      const cart = getCart();

      if (!cart.length) {
        app.innerHTML = `
          <section class="empty">
            <h2>Tu carrito está vacío.</h2>
            <p>Añade un par antes de continuar.</p>
            <a href="index.html">Ver gafas</a>
          </section>
        `;
        return;
      }

      const subtotal = totalCart(cart);

      app.innerHTML = `
        <section class="wrap">
          <header class="head">
            <div class="eyebrow">VESIRA</div>
            <h1>Checkout.</h1>
          </header>

          <form id="checkoutForm" class="layout">
            <div class="form">

              <section class="section">
                <div class="section-head">

                  <span class="section-number">01</span>
                </div>

                <div class="fields">
                  <div class="field full">
                    <label for="email">Email</label>
                    <input
                      id="email"
                      name="email"
                      type="email"
                      autocomplete="email"
                      required
                      placeholder="tu@email.com"
                    >
                  </div>
                </div>
              </section>

              <section class="section">
                <div class="section-head">
                  <h2>Entrega.</h2>
                  <span class="section-number">02</span>
                </div>

                <div class="fields">

                  <div class="field">
                    <label for="nombre">Nombre</label>
                    <input
                      id="nombre"
                      name="nombre"
                      autocomplete="given-name"
                      required
                    >
                  </div>

                  <div class="field">
                    <label for="apellidos">Apellidos</label>
                    <input
                      id="apellidos"
                      name="apellidos"
                      autocomplete="family-name"
                      required
                    >
                  </div>

                  <div class="field full">
                    <label for="direccion">Dirección</label>

                    <div class="address-wrap">
                      <input
                        id="direccion"
                        name="direccion"
                        autocomplete="street-address"
                        required
                        placeholder="Calle y número"
                      >

                      <div
                        id="address-suggestions"
                        class="address-suggestions"
                        role="listbox"
                        aria-label="Sugerencias de dirección"
                      ></div>
                    </div>

                    <div
                      id="address-status"
                      class="address-status"
                      aria-live="polite"
                    ></div>
                  </div>

                  <div class="field">
                    <label for="ciudad">Ciudad</label>
                    <input
                      id="ciudad"
                      name="ciudad"
                      autocomplete="address-level2"
                      required
                    >
                  </div>

                  <div class="field">
                    <label for="codigoPostal">Código postal</label>
                    <input
                      id="codigoPostal"
                      name="codigoPostal"
                      inputmode="numeric"
                      autocomplete="postal-code"
                      required
                    >
                  </div>

                  <div class="field full">
                    <label for="pais">País</label>
                    <select
                      id="pais"
                      name="pais"
                      autocomplete="country-name"
                      required
                    >
                      <option value="España" selected>
                        España
                      </option>
                    </select>
                  </div>
                </div>

                <div class="delivery-note">
                  Envío gratis · entrega estimada en un máximo de 5 días.
                  Recibirás la información de seguimiento del pedido.
                </div>
              </section>

              <section class="section">
                <div class="section-head">
                  <h2>Nota.</h2>
                  <span class="section-number">03</span>
                </div>

                <div class="fields">
                  <div class="field full">
                    <label for="nota">
                      Nota para el pedido · opcional
                    </label>
                    <textarea
                      id="nota"
                      name="nota"
                      placeholder="Algo que debamos saber sobre la entrega..."
                    ></textarea>
                  </div>
                </div>
              </section>

              <div class="error" id="error"></div>
            </div>

            <aside class="summary">
              <h2>Tu pedido.</h2>

              <div class="summary-items">
                ${cart.map(item => `
                  <div class="summary-item">
                    <div class="summary-img">
                      <img
                        src="${escapeHtml(item.imagen || "")}"
                        alt="${escapeHtml(item.nombre || "Vesira")}"
                      >
                    </div>

                    <div>
                      <div class="summary-name">
                        ${escapeHtml(item.nombre || "")}
                      </div>
                      <div class="summary-qty">
                        Cantidad · ${Number(item.cantidad || 1)}
                      </div>
                    </div>

                    <div class="summary-price">
                      ${euro(
                        Number(item.precio || 0) *
                        Number(item.cantidad || 1)
                      )}
                    </div>
                  </div>
                `).join("")}
              </div>

              <div class="row">
                <span>Subtotal</span>
                <strong>${euro(subtotal)}</strong>
              </div>

              <div class="row">
                <span>Envío</span>
                <strong>Gratis</strong>
              </div>

              <div class="row total">
                <span>Total</span>
                <strong>${euro(subtotal)}</strong>
              </div>

              <button
                class="buy"
                type="submit"
                id="proceedButton"
              >
                Proceder al pago
                <span
                  class="material-symbols-outlined"
                  style="font-size:15px;vertical-align:middle"
                >arrow_forward</span>
              </button>

              <a class="back" href="carrito.html">
                Volver al carrito
              </a>
            </aside>
          </form>
        </section>
      `;

      document
        .getElementById("checkoutForm")
        .addEventListener(
          "submit",
          handleSubmit
        );

      initGooglePlaces();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function handleSubmit(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const button =
        document.getElementById(
          "proceedButton"
        );

      showError("");

      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );

      if (
        !data.email ||
        !data.nombre ||
        !data.apellidos ||
        !data.direccion ||
        !data.ciudad ||
        !data.codigoPostal ||
        !data.pais
      ) {
        showError(
          "Completa todos los campos obligatorios."
        );
        return;
      }

      const cart = getCart();

      if (!cart.length) {
        showError(
          "El carrito está vacío."
        );
        return;
      }

      const originalButton =
        button.innerHTML;

      button.disabled = true;
      button.innerHTML =
        "Comprobando dirección...";

      try {
        await validateShippingAddress();

        localStorage.setItem(
          "vesiraCheckout",
          JSON.stringify({
            cliente: {
              email:
                String(data.email).trim(),
              nombre:
                String(data.nombre).trim(),
              apellidos:
                String(data.apellidos).trim(),
              direccion:
                String(data.direccion).trim(),
              ciudad:
                String(data.ciudad).trim(),
              codigoPostal:
                String(
                  data.codigoPostal
                ).trim(),
              pais:
                String(
                  data.pais ||
                  "España"
                ).trim(),
              nota:
                String(
                  data.nota || ""
                ).trim()
            },
            carrito: cart,
            creadoEn:
              new Date().toISOString()
          })
        );

        button.innerHTML =
          "Preparando pago...";

        window.location.href =
          "pago.html";

      } catch (error) {
        console.error(
          "Checkout error:",
          error
        );

        button.disabled = false;
        button.innerHTML =
          originalButton;

        showError(
          error?.message ||
          "No se pudo validar la dirección."
        );
      }
    }

    render();
  </script>
</body>
</html>
