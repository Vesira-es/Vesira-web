  <main id="app"></main>


  <div

  <div

    id="toast"
  ></div>


  <script>

    const app =
      document.getElementById("app");

    const toast =
      document.getElementById("toast");

    const success =
      document.getElementById("success");


    const CHECKOUT_FUNCTION_URL =
      "https://smxdiexgxxwjlvsdmzrq.supabase.co/functions/v1/crear-checkout";


    /*
      IMPORTANTE:
      Pon aquí TU Publishable Key de Stripe.

      Debe empezar por:
      pk_live_
      o
      pk_test_

      NUNCA pongas una sk_live_ o sk_test_ aquí.
    */
    const STRIPE_PUBLISHABLE_KEY =
      "pk_live_51UDtwY1OfdcxS98rJb2cdPhIwfEafeCT97a13f4qlJugVdNvVFtmu1GIdclfNJgZuHa0EGkXRuP00jX2HqgiJ5pX00f7FxB9OQ";


    let stripe = null;
    let elements = null;
    let cardElement = null;
    let expressCheckoutElement = null;


    function getCart(){

      try{

        return JSON.parse(
          localStorage.getItem(
            "vesiraCarrito"
          ) || "[]"
        );

      }catch{

        return [];

      }

    }


    function euro(value){

      return Number(value)
        .toFixed(2)
        .replace(".", ",") + " €";

    }


    function totalCart(cart){

      return cart.reduce(
        (sum, item) =>
          sum +
          Number(item.precio || 0) *
          Number(item.cantidad || 0),
        0
      );

    }


    function showError(message){

      const errorBox =
        document.getElementById("error");

      if(!errorBox) return;

      errorBox.textContent =
        message || "";

      errorBox.classList.toggle(
        "show",
        Boolean(message)
      );

    }


    function showCardError(message){

      const box =
        document.getElementById(
          "card-errors"
        );

      if(!box) return;

      box.textContent =
        message || "";

      box.classList.toggle(
        "show",
        Boolean(message)
      );

    }


    function setButtonLoading(loading){

      const button =
        document.getElementById(
          "buyButton"
        );

      if(!button) return;

      button.disabled = loading;

      if(loading){

        button.innerHTML = `
          Procesando pago...
          <span
            class="material-symbols-outlined"
            style="font-size:15px;vertical-align:middle"
          >
            progress_activity
          </span>
        `;

      }else{

        const cart = getCart();

        button.innerHTML = `
          Pagar ${euro(totalCart(cart))}
          <span
            class="material-symbols-outlined"
            style="font-size:15px;vertical-align:middle"
          >
            arrow_forward
          </span>
        `;

      }

    }


    function stripeAppearance(){

      return {

        theme: "night",

        variables: {

          colorPrimary: "#ffffff",

          colorBackground: "#101010",

          colorText: "#ffffff",

          colorTextSecondary: "#8c8c8c",

          colorDanger: "#ff6b6b",

          fontFamily:
            "Outfit, Arial, sans-serif",

          borderRadius: "13px",

          spacingUnit: "4px"

        },

        rules: {

          ".Input": {
            border:
              "1px solid rgba(255,255,255,.10)",
            boxShadow: "none"
          },

          ".Input:focus": {
            border:
              "1px solid rgba(255,255,255,.28)",
            boxShadow: "none"
          },

          ".Label": {
            color: "#8c8c8c"
          }

        }

      };

    }


    function initStripe(cart){

      if(!window.Stripe){

        showError(
          "No se ha podido cargar Stripe. Recarga la página."
        );

        return false;

      }


      if(
        !STRIPE_PUBLISHABLE_KEY ||
        !STRIPE_PUBLISHABLE_KEY.startsWith("pk_")
      ){

        showError(
          "La Publishable Key de Stripe no está configurada."
        );

        return false;

      }


      stripe =
        window.Stripe(
          STRIPE_PUBLISHABLE_KEY
        );


      /*
        El amount aquí sirve para que Apple Pay
        / Google Pay conozcan el importe que
        mostrarán en su interfaz.

        El importe definitivo SIEMPRE se calcula
        de nuevo en crear-checkout en el servidor.
      */
      const amount =
        Math.round(
          totalCart(cart) * 100
        );


      elements =
        stripe.elements({

          mode: "payment",

          amount: amount,

          currency: "eur",

          locale: "es",

          appearance:
            stripeAppearance()

        });


      /*
        EXPRESS CHECKOUT

        Solo:
        - Apple Pay
        - Google Pay

        Link y PayPal están desactivados.
      */
      expressCheckoutElement =
        elements.create(
          "expressCheckout",
          {

            paymentMethods: {

              applePay: "always",

              googlePay: "always",

              link: "never",

              paypal: "never",

              amazonPay: "never",

              klarna: "never"

            },

            buttonType: {

              applePay: "check-out",

              googlePay: "checkout"

            },

            buttonHeight: 52,

            layout: {
  maxColumns: 2,
  maxRows: 1,
  overflow: "auto"
}

          }
        );


      expressCheckoutElement.mount(
        "#express-checkout-element"
      );


 expressCheckoutElement.on(
  "ready",
  ({ availablePaymentMethods }) => {

    console.log(
      "APPLE/GOOGLE DISPONIBLES:",
      availablePaymentMethods
    );

    const walletBox =
      document.getElementById("wallets");

    if(!walletBox) return;

    walletBox.style.display =
      availablePaymentMethods
        ? "grid"
        : "none";
  }
);


      /*
        Cuando el usuario confirma
        Apple Pay / Google Pay.
      */
      expressCheckoutElement.on(
        "confirm",
        handleWalletPayment
      );


      /*
        CARD ELEMENT
      */
      cardElement =
        elements.create(
          "card",
          {

            hidePostalCode: true,

            disableLink: true,

            style: {

              base: {

                color: "#ffffff",

                fontFamily:
                  "Outfit, Arial, sans-serif",

                fontSize: "14px",

                fontWeight: "400",

                iconColor: "#ffffff",

                "::placeholder": {
                  color: "#666666"
                }

              },

              invalid: {

                color: "#ff6b6b",

                iconColor: "#ff6b6b"

              }

            }

          }
        );


      cardElement.mount(
        "#card-element"
      );


      cardElement.on(
        "change",
        (event) => {

          showCardError(
            event.error?.message || ""
          );

        }
      );


      return true;

    }


    async function createPaymentIntent(){

      const cart =
        getCart();

      if(!cart.length){

        throw new Error(
          "El carrito está vacío."
        );

      }


      const form =
        document.getElementById(
          "checkoutForm"
        );


      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );


      const response =
        await fetch(
          CHECKOUT_FUNCTION_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              items:

                cart.map(item => ({
                  id: item.id,
                  cantidad:
                    Number(
                      item.cantidad || 1
                    )
                })),

              cliente: {

                email:
                  String(data.email || ""),

                nombre:
                  String(data.nombre || ""),

                apellidos:
                  String(
                    data.apellidos || ""
                  ),

                direccion:
                  String(
                    data.direccion || ""
                  ),

                ciudad:
                  String(
                    data.ciudad || ""
                  ),

                codigoPostal:
                  String(
                    data.codigoPostal || ""
                  ),

                pais:
                  String(
                    data.pais || "España"
                  ),

                nota:
                  String(
                    data.nota || ""
                  )

              }

            })

          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result?.error ||
          "No se pudo iniciar el pago."
        );

      }


      if(!result?.clientSecret){

        throw new Error(
          "Stripe no devolvió el client secret."
        );

      }


      return result;

    }


    async function handleWalletPayment(event){

      showError("");
      showCardError("");

      const form =
        document.getElementById(
          "checkoutForm"
        );

      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );


      if(
        !data.email ||
        !data.nombre ||
        !data.apellidos ||
        !data.direccion ||
        !data.ciudad ||
        !data.codigoPostal
      ){

        showError(
          "Completa tus datos de contacto y entrega antes de pagar."
        );

        return;

      }


      try{

        const {
          error: submitError
        } = await elements.submit();


        if(submitError){

          showError(
            submitError.message
          );

          return;

        }


        const result =
          await createPaymentIntent();


        const paymentResult =
          await stripe.confirmPayment({

            elements: elements,

            clientSecret:
              result.clientSecret,

            confirmParams: {

              return_url:
                window.location.origin +
                "/checkout-exito.html"

            }

          });


        if(paymentResult.error){

          showError(
            paymentResult.error.message ||
            "No se pudo completar el pago."
          );

        }

      }catch(error){

        console.error(error);

        showError(
          error?.message ||
          "Ha ocurrido un error al procesar el pago."
        );

      }

    }


    async function handleCheckout(event){

      event.preventDefault();


      showError("");
      showCardError("");


      const form =
        event.currentTarget;

      const data =
        Object.fromEntries(
          new FormData(form).entries()
        );


      if(
        !data.email ||
        !data.nombre ||
        !data.apellidos ||
        !data.direccion ||
        !data.ciudad ||
        !data.codigoPostal
      ){

        showError(
          "Completa todos los campos obligatorios."
        );

        return;

      }


      if(
        !stripe ||
        !cardElement
      ){

        showError(
          "El formulario de tarjeta todavía no está listo."
        );

        return;

      }


      const cart =
        getCart();


      if(!cart.length){

        showError(
          "El carrito está vacío."
        );

        return;

      }


      setButtonLoading(true);


      try{

        /*
          Creamos el PaymentIntent en servidor.
          El servidor recalcula el precio.
        */
        const result =
          await createPaymentIntent();


        /*
          Confirmación de tarjeta.
        */
        const paymentResult =
          await stripe.confirmCardPayment(

            result.clientSecret,

            {

              payment_method: {

                card: cardElement,

                billing_details: {

                  name:
                    `${data.nombre} ${data.apellidos}`
                      .trim(),

                  email:
                    String(data.email),

                  address: {

                    line1:
                      String(
                        data.direccion
                      ),

                    city:
                      String(
                        data.ciudad
                      ),

                    postal_code:
                      String(
                        data.codigoPostal
                      ),

                    country:
                      "ES"

                  }

                }

              }

            }

          );


        if(paymentResult.error){

          throw new Error(
            paymentResult.error.message ||
            "No se pudo procesar el pago."
          );

        }


        const paymentIntent =
          paymentResult.paymentIntent;


        if(
          !paymentIntent ||
          paymentIntent.status !== "succeeded"
        ){

          throw new Error(
            "El pago no se ha completado."
          );

        }


        /*
          El webhook seguirá siendo la fuente
          definitiva para crear el pedido.
        */
        localStorage.removeItem(
          "vesiraCarrito"
        );


        window.location.href =
          "checkout-exito.html?payment_intent=" +
          encodeURIComponent(
            paymentIntent.id
          );


      }catch(error){

        console.error(error);

        showError(
          error?.message ||
          "Ha ocurrido un error al procesar el pago."
        );

        setButtonLoading(false);

      }

    }

                <div

                  <div class="wallets-title">
                    Pago rápido
                  </div>

                  <div

                <div class="wallet-divider">

                <!-- TARJETA -->

                <div

              <!-- NOTA -->

              <section class="section">

            <!-- RESUMEN -->

            <aside class="summary">

              <h2>

              <div class="summary-items">

                ${cart.map(item => `

                  <div class="summary-item">

                    <div class="summary-img">

                      <div class="summary-qty">
                        Cantidad ·
                        ${Number(
                          item.cantidad || 1

                    </div>


                    <div class="summary-price">

                      ${euro(

              <div class="row">

              <div class="row">

                <span>
                  Envío

                  Gratis

              </div>


              <div class="row total">

              </div>


              <button
                class="buy"
                type="submit"

                Pagar ${euro(subtotal)}

                <span

                  style="font-size:15px;vertical-align:middle"
                >
                  arrow_forward

              </button>


              <a
                class="back"
                href="carrito.html"

                Volver al carrito
              </a>

            </aside>


          </form>

        </section>

      `;


      const stripeReady =
        initStripe(cart);


      if(!stripeReady){
        return;
      }


      document
        .getElementById(
          "checkoutForm"

        .addEventListener(
          "submit",
          handleCheckout

    }


    render();

  </script>
