  <script>

    const GOOGLE_MAPS_BROWSER_KEY =

      "AIzaSyDgFV-cuVbMDLOBjrEREn1-75r0qc-vucM";

    const ADDRESS_VALIDATION_FUNCTION_URL =

      "https://smxdiexgxxwjlvsdmzrq.supabase.co/functions/v1/validar-direccion";

    const app = document.getElementById("app");

    let googlePlacesReady = false;

    let latestAutocompleteRequest = 0;

    function getCart() {

      try {

        const data = JSON.parse(

localStorage.getItem("vesiraCarrito") || "[]"

        );

        return Array.isArray(data) ? data : [];

      } catch {

        return [];

      }

    }

    function euro(value) {

      return (

Number(value || 0)

          .toFixed(2)

          .replace(".", ",") + " €"

      );

    }

    function totalCart(cart) {

      return cart.reduce(

        (sum, item) =>

sum +

Number(item.precio || 0) *

Number(item.cantidad || 0),

        0

      );

    }

    function setAddressStatus(message, state = "") {

      const element =

document.getElementById("address-status");

      if (!element) {

        return;

      }

      element.textContent = message;

      element.classList.remove("ok", "error");

      if (state) {

        element.classList.add(state);

      }

    }

    function showError(message) {

      const element =

document.getElementById("error");

      if (!element) {

        return;

      }

      element.textContent = message || "";

      element.classList.toggle(

        "show",

Boolean(message)

      );

    }

    async function initGooglePlaces() {

      try {

        if (!GOOGLE_MAPS_BROWSER_KEY) {

          throw new Error("Falta la clave pública de Google Maps.");

        }

// Esperamos a que el script async de Google termine de cargar.

        if (window.vesiraGoogleReady) {

          await window.vesiraGoogleReady;

        }

        if (!window.google?.maps?.importLibrary) {

          throw new Error("Google Maps JavaScript API no está disponible.");

        }

// PlaceAutocompleteElement viene exportado por la librería places.

        const { PlaceAutocompleteElement } =

          await google.maps.importLibrary("places");

        if (!PlaceAutocompleteElement) {

          throw new Error("PlaceAutocompleteElement no está disponible.");

        }

        const container =

document.getElementById("direccion-autocomplete");

        const hiddenInput =

document.getElementById("direccion");

        if (!container || !hiddenInput) {

          throw new Error("No se encontró el campo de dirección.");

        }

        const autocomplete =

new PlaceAutocompleteElement({

            includedRegionCodes: ["es"]

          });

        autocomplete.placeholder =

          "Empieza a escribir tu dirección...";

        autocomplete.includedRegionCodes = ["es"];

        autocomplete.requestedLanguage = "es";

        autocomplete.requestedRegion = "es";

        autocomplete.setAttribute(

          "aria-label",

          "Dirección de entrega"

        );

        container.replaceChildren(autocomplete);

        autocomplete.addEventListener(

          "gmp-select",

          async (event) => {

            try {

              const prediction =

event.placePrediction;

              if (!prediction) {

                return;

              }

              const place =

                prediction.toPlace();

              await place.fetchFields({

                fields: [

                  "addressComponents",

                  "formattedAddress"

                ]

              });

              let street = "";

              let streetNumber = "";

              let city = "";

              let postalCode = "";

              let countryCode = "ES";

              for (const component of place.addressComponents || []) {

                const types = component.types || [];

                const longText = component.longText || "";

                const shortText = component.shortText || "";

                if (types.includes("route")) {

                  street = longText;

                }

                if (types.includes("street_number")) {

                  streetNumber = longText;

                }

                if (

                  !city &&

                  (

                    types.includes("locality") ||

                    types.includes("postal_town") ||

                    types.includes("sublocality") ||

                    types.includes("sublocality_level_1")

                  )

                ) {

                  city = longText;

                }

                if (types.includes("postal_code")) {

                  postalCode = longText;

                }

                if (types.includes("country")) {

                  countryCode = shortText || "ES";

                }

              }

              const direccion =

                [street, streetNumber]

                  .filter(Boolean)

                  .join(" ") ||

                place.formattedAddress ||

                "";

              hiddenInput.value = direccion;

              const cityInput =

document.getElementById("ciudad");

              const postalInput =

document.getElementById("codigoPostal");


              if (cityInput) {

                cityInput.value = city;

              }

              if (postalInput) {

                postalInput.value = postalCode;

              }
setAddressStatus(

                "Dirección seleccionada. La comprobaremos antes de continuar.",

                "ok"

              );

            } catch (error) {

console.error(

                "Google Places selection error:",

                error

              );

              setAddressStatus(

                "No se pudieron completar los datos de la dirección.",

                "error"

              );

            }

          }

        );

        setAddressStatus(

          "Empieza a escribir y selecciona una de las sugerencias.",

          ""

        );

      } catch (error) {

console.error(

          "Google Places no disponible:",

          error

        );

        setAddressStatus(

          "Google no está disponible ahora. Puedes escribir la dirección manualmente.",

          "error"

        );

// Fallback manual si el widget no carga.

        const container =

document.getElementById("direccion-autocomplete");

        const hiddenInput =

document.getElementById("direccion");

        if (container && hiddenInput) {

          const input = document.createElement("input");

          input.type = "text";

          input.id = "direccion-fallback";

          input.autocomplete = "street-address";

          input.placeholder = "Calle y número";

          input.required = true;

          input.style.width = "100%";

          input.style.minHeight = "48px";

          input.style.padding = "0 13px";

          input.style.border = "1px solid var(--b)";

          input.style.borderRadius = "13px";

          input.style.background = "var(--input)";

          input.style.color = "#fff";

          input.style.outline = "none";

          input.style.fontSize = "12px";

          input.addEventListener("input", () => {

            hiddenInput.value = input.value;

          });

          container.replaceChildren(input);

        }

      }

    }

    async function validateShippingAddress() {

      const form =

document.getElementById(

          "checkoutForm"

        );

      if (!form) {

        throw new Error(

          "No se encontró el formulario."

        );

      }

      const data =

Object.fromEntries(

new FormData(form).entries()

        );

      const response =

        await fetch(

          ADDRESS_VALIDATION_FUNCTION_URL,

          {

            method: "POST",

            headers: {

              "Content-Type":

                "application/json"

            },

            body: JSON.stringify({

              address: {

                direccion:

String(

                    data.direccion || ""

                  ).trim(),

                ciudad:

String(

                    data.ciudad || ""

                  ).trim(),

                codigoPostal:

String(

                    data.codigoPostal || ""

                  ).trim(),

                countryCode: "ES"

              }

            })

          }

        );

      const result =

        await response

          .json()

          .catch(() => ({}));

      if (!response.ok) {

        throw new Error(

          result?.error ||

          "No se pudo comprobar la dirección."

        );

      }

      if (!result?.valid) {

        throw new Error(

          "La dirección no parece estar completa o confirmada. Revisa calle, número, ciudad y código postal."

        );

      }

      setAddressStatus(

        "Dirección verificada correctamente.",

        "ok"

      );

      return result;

    }

              <div class="summary-items">

                ${cart.map(item => `

                    </div>

                  </div>

                `).join("")}

              </div>

              <div class="row">

                <span>Subtotal</span>

                <strong>${euro(subtotal)}</strong>

              </div>

              <div class="row">

                <span>Envío</span>

                <strong>Gratis</strong>

              </div>

              <div class="row total">

                <span>Total</span>

                <strong>${euro(subtotal)}</strong>

              </div>

              <button

                class="buy"

                type="submit"

                id="proceedButton"

              >

                Proceder al pago

                <span

                  class="material-symbols-outlined"

                  style="font-size:15px;vertical-align:middle"

                >arrow_forward</span>

              </button>

              <a class="back" href="carrito.html">

                Volver al carrito

              </a>

            </aside>

          </form>

        </section>

      `;

document

        .getElementById("checkoutForm")

        .addEventListener(

          "submit",

          handleSubmit

        );

      initGooglePlaces();

    }

    function escapeHtml(value) {

      return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }

    async function handleSubmit(event) {

event.preventDefault();

      const form = event.currentTarget;

      const button =

document.getElementById(

          "proceedButton"

        );

      showError("");

      const data =

Object.fromEntries(

new FormData(form).entries()

        );

      const direccionField = document.getElementById("direccion");
      if (direccionField) {
        data.direccion = String(direccionField.value || "").trim();
      }

      data.email = String(data.email || "").trim();
      data.nombre = String(data.nombre || "").trim();
      data.apellidos = String(data.apellidos || "").trim();
      data.ciudad = String(data.ciudad || "").trim();
      data.codigoPostal = String(data.codigoPostal || "").trim();

      if (

        !data.email ||

        !data.nombre ||

        !data.apellidos ||

        !data.direccion ||

        !data.ciudad ||

        !data.codigoPostal

      ) {

        showError(

          "Completa todos los campos obligatorios."

        );

        return;

      }

      const cart = getCart();

      if (!cart.length) {

        showError(

          "El carrito está vacío."

        );

        return;

      }

      const originalButton =

        button.innerHTML;

      button.disabled = true;

      button.innerHTML =

        "Comprobando dirección...";

      try {

        await validateShippingAddress();

localStorage.setItem(

          "vesiraCheckout",

JSON.stringify({

            cliente: {

              email:

String(data.email).trim(),

              nombre:

String(data.nombre).trim(),

              apellidos:

String(data.apellidos).trim(),

              direccion:

String(data.direccion).trim(),

              ciudad:

String(data.ciudad).trim(),

              codigoPostal:

String(

                  data.codigoPostal

                ).trim(),

              nota:

String(

                  data.nota || ""

                ).trim()

            },

            carrito: cart,

            creadoEn:

new Date().toISOString()

          })

        );

        button.innerHTML =

          "Preparando pago...";

window.location.href =

          "pago.html";

      } catch (error) {

console.error(

          "Checkout error:",

          error

        );

        button.disabled = false;

        button.innerHTML =

          originalButton;

        showError(

          error?.message ||

          "No se pudo validar la dirección."

        );

      }

    }

    render();

  </script>

</body>

</html>
