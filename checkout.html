  <script>

        /* ==========================================================
       GOOGLE PLACES + VALIDACIÓN DE DIRECCIÓN
       ========================================================== */

    /* CLAVE PÚBLICA: solo para Places Autocomplete en www.vesira.es */
    const GOOGLE_MAPS_BROWSER_KEY = "AIzaSyDgFV-cuVbMDLOBjrEREn1-75r0qc-vucM";

    /* Edge Function de Supabase. La clave secreta de Google NO va aquí. */
    const ADDRESS_VALIDATION_FUNCTION_URL =
      "https://smxdiexgxxwjlvsdmzrq.supabase.co/functions/v1/validar-direccion";

    function setAddressStatus(message, state) {
      const status = document.getElementById("address-status");
      if (!status) return;
      status.textContent = message || "";
      status.classList.remove("valid", "invalid");
      if (state) status.classList.add(state);
    }

    function loadGoogleMapsPlaces() {
      return new Promise((resolve, reject) => {
        if (window.google?.maps?.importLibrary) {
          resolve();
          return;
        }

        if (!GOOGLE_MAPS_BROWSER_KEY || GOOGLE_MAPS_BROWSER_KEY === "TU_GOOGLE_MAPS_BROWSER_KEY") {
          console.warn("Google Places: falta GOOGLE_MAPS_BROWSER_KEY.");
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.src =
          "https://maps.googleapis.com/maps/api/js?key=" +
          encodeURIComponent(GOOGLE_MAPS_BROWSER_KEY) +
          "&loading=async&v=weekly";
        script.async = true;
        script.defer = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error("No se pudo cargar Google Maps."));
        document.head.appendChild(script);
      });
    }

    async function initGoogleAddressAutocomplete() {
      const container = document.getElementById("direccion-autocomplete");
      const visibleInput = document.getElementById("direccion-visible");
      const hiddenInput = document.getElementById("direccion");

      if (!container || !visibleInput || !hiddenInput) return;

      visibleInput.addEventListener("input", () => {
        hiddenInput.value = visibleInput.value.trim();
      });

      try {
        await loadGoogleMapsPlaces();

        if (!window.google?.maps?.importLibrary) {
          throw new Error("Google Maps JS API no disponible");
        }

        const { PlaceAutocompleteElement } =
          await google.maps.importLibrary("places");

        const autocomplete = new PlaceAutocompleteElement({
          includedRegionCodes: ["es"]
        });

        autocomplete.placeholder = "Empieza a escribir tu dirección...";
        autocomplete.setAttribute("aria-label", "Dirección");

        container.replaceChildren(autocomplete);
        container.hidden = false;
        visibleInput.hidden = true;

        autocomplete.addEventListener("gmp-select", async ({ placePrediction }) => {
          try {
            const place = placePrediction.toPlace();
            await place.fetchFields({
              fields: ["addressComponents", "formattedAddress"]
            });

            let street = "";
            let streetNumber = "";
            let city = "";
            let postalCode = "";
            let countryCode = "ES";

            for (const component of place.addressComponents || []) {
              const types = component.types || [];
              const value = component.longText || "";
              const shortValue = component.shortText || "";

              if (types.includes("route")) street = value;
              if (types.includes("street_number")) streetNumber = value;
              if (types.includes("locality") || types.includes("postal_town") || types.includes("sublocality")) {
                if (!city) city = value;
              }
              if (types.includes("postal_code")) postalCode = value;
              if (types.includes("country")) countryCode = shortValue || "ES";
            }

            hiddenInput.value =
              [street, streetNumber].filter(Boolean).join(" ") ||
              place.formattedAddress ||
              "";

            document.getElementById("ciudad").value = city;
            document.getElementById("codigoPostal").value = postalCode;

            const pais = document.getElementById("pais");
            if (pais && countryCode === "ES") pais.value = "España";

            setAddressStatus(
              "Dirección seleccionada correctamente. La comprobaremos antes de continuar.",
              "valid"
            );
          } catch (error) {
            console.error("Google Places error:", error);
            setAddressStatus(
              "No se pudieron completar los datos. Puedes escribir la dirección manualmente.",
              "invalid"
            );
          }
        });

        setAddressStatus(
          "Empieza a escribir y selecciona una dirección de Google.",
          null
        );
      } catch (error) {
        console.error("Google Places no disponible:", error);
        container.hidden = true;
        visibleInput.hidden = false;
        setAddressStatus(
          "Autocompletado no disponible. Puedes escribir la dirección manualmente.",
          "invalid"
        );
      }
    }

    async function validateShippingAddress() {
      const form = document.getElementById("checkoutForm");
      if (!form) throw new Error("No se encontró el formulario de checkout.");

      const data = Object.fromEntries(new FormData(form).entries());

      const response = await fetch(
        ADDRESS_VALIDATION_FUNCTION_URL,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            address: {
              direccion: String(data.direccion || "").trim(),
              ciudad: String(data.ciudad || "").trim(),
              codigoPostal: String(data.codigoPostal || "").trim(),
              countryCode: "ES"
            }
          })
        }
      );

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result?.error || "No se pudo comprobar la dirección."
        );
      }

      if (!result?.valid) {
        throw new Error(
          "La dirección no parece estar completa o confirmada. Revisa calle, número, ciudad y código postal."
        );
      }

      setAddressStatus(
        "Dirección verificada correctamente.",
        "valid"
      );

      return result;
    }

const app =

document.getElementById("app");



    function getCart(){

      try{

        return JSON.parse(

localStorage.getItem(

            "vesiraCarrito"

          ) || "[]"

        );

      }catch{

        return [];

      }

    }



    function euro(value){

      return Number(value)

        .toFixed(2)

        .replace(".", ",") + " €";

    }



    function totalCart(cart){

      return cart.reduce(

        (sum, item) =>

sum +

Number(item.precio || 0) *

Number(item.cantidad || 0),

        0

      );

    }



    function showError(message){

      const errorBox =

document.getElementById("error");

      if(!errorBox) return;

      errorBox.textContent =

message || "";

      errorBox.classList.toggle(

        "show",

Boolean(message)

      );

    }

      const subtotal =

                    >

                    <input

                      class="address-hidden-input"
                      type="text"
                      tabindex="-1"
                      required
                    >

                    <div
                      id="address-status"
                      class="address-status"
                      aria-live="polite"
                    >Escribe tu dirección o selecciona una sugerencia de Google.</div>
                  </div>



                  <div class="field">

            </div>



            <!-- RESUMEN -->

            <aside class="summary">

              <div class="summary-items">

    async function handleSubmit(event){

event.preventDefault();



      const form =

event.currentTarget;



      const button =

document.getElementById(

          "proceedButton"

        );



      showError("");



      const data =

Object.fromEntries(

new FormData(form).entries()

        );



      if(

        !data.email ||

        !data.nombre ||

        !data.apellidos ||

        !data.direccion ||

        !data.ciudad ||

        !data.codigoPostal ||

        !data.pais

      ){

        showError(

          "Completa todos los campos obligatorios."

        );

        return;

      }



      const cart =

        getCart();



      if(!cart.length){

        showError(

          "El carrito está vacío."

        );

        return;

      }


      try {
        button.disabled = true;
        button.innerHTML = `
          Comprobando dirección...
          <span
            class="material-symbols-outlined"
            style="font-size:15px;vertical-align:middle"
          >
            progress_activity
          </span>
        `;

        await validateShippingAddress();
      } catch (error) {
        button.disabled = false;
        button.innerHTML = `
          Proceder al pago
          <span
            class="material-symbols-outlined"
            style="font-size:15px;vertical-align:middle"
          >
            arrow_forward
          </span>
        `;

        showError(
          error?.message ||
          "No se pudo validar la dirección."
        );

        return;
      }

      /*

        Guardamos temporalmente los datos

        del checkout para que pago.html

        pueda crear el PaymentIntent.

        Esto NO marca el pedido como pagado.

      */

localStorage.setItem(

        "vesiraCheckout",

JSON.stringify({

          cliente:{

            email:

String(data.email).trim(),

            nombre:

String(data.nombre).trim(),

            apellidos:

String(data.apellidos).trim(),

            direccion:

String(data.direccion).trim(),

            ciudad:

String(data.ciudad).trim(),

            codigoPostal:

String(

                data.codigoPostal

              ).trim(),

            pais:

String(

                data.pais || "España"

              ).trim(),

            nota:

String(

                data.nota || ""

              ).trim()

          },

          carrito:cart,

          creadoEn:

new Date().toISOString()

        })

      );



      button.disabled = true;

      button.innerHTML = `

        Preparando pago...

        <span

          class="material-symbols-outlined"

          style="font-size:15px;vertical-align:middle"

        >

          progress_activity

        </span>

      `;



/*

        Pasamos a la segunda página.

      */

window.location.href =

        "pago.html";

    }



    render();
    initGoogleAddressAutocomplete();

  </script>

</body>

</html>
