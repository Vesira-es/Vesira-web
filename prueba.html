<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seleccionar dispositivo | Vesira</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #111;
        }

        /* =========================
           CONTENEDOR
        ========================= */

        .selector-pagina {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 20px;
        }

        .selector-contenido {
            width: 100%;
            max-width: 760px;
        }


        /* =========================
           CABECERA
        ========================= */

        .cabecera {
            text-align: center;

            margin-bottom: 45px;
        }

        .cabecera small {
            display: block;

            font-size: 10px;
            letter-spacing: .25em;
            text-transform: uppercase;

            color: #999;

            margin-bottom: 18px;
        }

        .cabecera h1 {
            font-size: 44px;
            font-weight: 500;

            letter-spacing: -.03em;

            margin-bottom: 14px;
        }

        .cabecera p {
            color: #777;

            font-size: 15px;
            line-height: 1.6;
        }


        /* =========================
           SELECTOR
        ========================= */

        .selector {

            background: #fff;

            border: 1px solid #dfdfdf;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0,0,0,.04);
        }


        /* =========================
           CABECERA SELECTOR
        ========================= */

        .selector-cabecera {

            min-height: 82px;

            padding: 18px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #ededed;
        }

        .selector-cabecera-izquierda {

            display: flex;
            align-items: center;

            gap: 15px;
        }

        .selector-icono {

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #111;
            color: #fff;

            font-size: 21px;
        }

        .selector-textos {

            display: flex;
            flex-direction: column;

            gap: 4px;
        }

        .selector-label {

            font-size: 9px;
            letter-spacing: .16em;
            text-transform: uppercase;

            color: #999;
        }

        .selector-valor {

            font-size: 16px;
            font-weight: 500;
        }


        /* =========================
           PASOS
        ========================= */

        .pasos {

            display: flex;
            align-items: center;
            gap: 8px;

            margin-right: 6px;
        }

        .paso {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #d9d9d9;
        }

        .paso.activo {
            background: #111;
        }


        /* =========================
           CONTENIDO OPCIONES
        ========================= */

        .selector-opciones {

            padding: 10px 0;
        }

        .opcion {

            width: 100%;

            min-height: 68px;

            padding: 0 24px;

            border: none;
            background: transparent;

            display: flex;
            align-items: center;
            justify-content: space-between;

            cursor: pointer;

            text-align: left;

            transition:
                background .2s ease,
                padding .2s ease;
        }

        .opcion:hover {

            background: #f7f7f7;

            padding-left: 30px;
        }

        .opcion-nombre {

            font-size: 16px;
            font-weight: 400;
        }

        .opcion-subtitulo {

            margin-top: 5px;

            font-size: 11px;
            color: #999;
        }

        .opcion-derecha {

            display: flex;
            align-items: center;
            gap: 8px;

            color: #999;
        }

        .opcion:hover .opcion-derecha {
            color: #111;
        }


        /* =========================
           VOLVER
        ========================= */

        .volver {

            height: 58px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-top: 1px solid #ededed;

            background: #fff;

            color: #777;

            font-size: 12px;

            cursor: pointer;

            transition: color .2s ease;
        }

        .volver:hover {
            color: #111;
        }


        /* =========================
           CONFIRMACIÓN
        ========================= */

        .confirmacion {

            display: none;

            padding: 32px 25px;
            text-align: center;
        }

        .confirmacion-icono {

            width: 52px;
            height: 52px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #111;
            color: #fff;
        }

        .confirmacion h2 {

            font-size: 23px;
            font-weight: 500;

            margin-bottom: 8px;
        }

        .confirmacion p {

            color: #777;
            font-size: 14px;

            margin-bottom: 25px;
        }

        .boton-ver-productos {

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            min-width: 220px;
            height: 48px;

            padding: 0 20px;

            background: #111;
            color: #fff;

            border: none;
            border-radius: 10px;

            text-decoration: none;

            font-size: 13px;

            cursor: pointer;

            transition: background .2s ease;
        }

        .boton-ver-productos:hover {
            background: #292929;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .selector-pagina {
                padding: 35px 16px;
            }

            .cabecera {
                margin-bottom: 30px;
            }

            .cabecera h1 {
                font-size: 34px;
            }

            .cabecera p {
                font-size: 14px;
            }

            .selector-cabecera {
                min-height: 74px;

                padding: 14px 16px;
            }

            .selector-icono {
                width: 38px;
                height: 38px;
            }

            .opcion {
                min-height: 62px;

                padding: 0 18px;
            }

            .opcion:hover {
                padding-left: 22px;
            }

        }

    </style>

</head>


<body>


    <main class="selector-pagina">

        <div class="selector-contenido">


            <!-- CABECERA -->

            <div class="cabecera">

                <small>
                    VESIRA · COMPATIBILIDAD
                </small>

                <h1>
                    ¿Qué dispositivo tienes?
                </h1>

                <p>
                    Selecciona tu dispositivo y te mostraremos
                    únicamente productos compatibles.
                </p>

            </div>


            <!-- SELECTOR -->

            <div class="selector">


                <!-- CABECERA DEL SELECTOR -->

                <div class="selector-cabecera">

                    <div class="selector-cabecera-izquierda">

                        <div class="selector-icono">
                            <span class="material-symbols-outlined">
                                smartphone
                            </span>
                        </div>

                        <div class="selector-textos">

                            <span class="selector-label" id="selectorLabel">
                                Selecciona una marca
                            </span>

                            <span
                                class="selector-valor"
                                id="selectorValor">
                                Marca
                            </span>

                        </div>

                    </div>


                    <div class="pasos">

                        <span
                            class="paso activo"
                            id="pasoMarca">
                        </span>

                        <span
                            class="paso"
                            id="pasoModelo">
                        </span>

                    </div>

                </div>



                <!-- PASO MARCA -->

                <div
                    class="selector-opciones"
                    id="opcionesMarca">

                    <button
                        class="opcion"
                        data-marca="Apple">

                        <div>

                            <div class="opcion-nombre">
                                Apple
                            </div>

                            <div class="opcion-subtitulo">
                                iPhone
                            </div>

                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>


                    <button
                        class="opcion"
                        data-marca="Samsung">

                        <div>

                            <div class="opcion-nombre">
                                Samsung
                            </div>

                            <div class="opcion-subtitulo">
                                Galaxy
                            </div>

                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>


                    <button
                        class="opcion"
                        data-marca="Xiaomi">

                        <div>

                            <div class="opcion-nombre">
                                Xiaomi
                            </div>

                            <div class="opcion-subtitulo">
                                Redmi · Xiaomi
                            </div>

                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>

                </div>



                <!-- PASO MODELO -->

                <div
                    class="selector-opciones"
                    id="opcionesModelo"
                    style="display:none;">

                    <button
                        class="opcion"
                        data-modelo="iPhone 17">

                        <div class="opcion-nombre">
                            iPhone 17
                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>


                    <button
                        class="opcion"
                        data-modelo="iPhone 17 Pro">

                        <div class="opcion-nombre">
                            iPhone 17 Pro
                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>


                    <button
                        class="opcion"
                        data-modelo="iPhone 17 Pro Max">

                        <div class="opcion-nombre">
                            iPhone 17 Pro Max
                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>


                    <button
                        class="opcion"
                        data-modelo="iPhone Air">

                        <div class="opcion-nombre">
                            iPhone Air
                        </div>

                        <div class="opcion-derecha">

                            <span class="material-symbols-outlined">
                                arrow_forward
                            </span>

                        </div>

                    </button>

                </div>



                <!-- VOLVER -->

                <button
                    class="volver"
                    id="volverMarca"
                    style="display:none;">

                    <span class="material-symbols-outlined">
                        arrow_back
                    </span>

                    &nbsp; Volver a marcas

                </button>



                <!-- CONFIRMACIÓN -->

                <div
                    class="confirmacion"
                    id="confirmacion">

                    <div class="confirmacion-icono">

                        <span class="material-symbols-outlined">
                            check
                        </span>

                    </div>

                    <h2>
                        iPhone 17 Pro
                    </h2>

                    <p>
                        Ya sabemos qué dispositivo tienes.
                    </p>

                    <a
                        href="productos.html"
                        class="boton-ver-productos">

                        Ver productos compatibles

                        <span class="material-symbols-outlined">
                            arrow_forward
                        </span>

                    </a>

                </div>


            </div>

        </div>

    </main>



    <script>

        const opcionesMarca =
            document.querySelectorAll(
                "#opcionesMarca .opcion"
            );

        const opcionesModelo =
            document.querySelectorAll(
                "#opcionesModelo .opcion"
            );

        const bloqueMarca =
            document.getElementById(
                "opcionesMarca"
            );

        const bloqueModelo =
            document.getElementById(
                "opcionesModelo"
            );

        const volverMarca =
            document.getElementById(
                "volverMarca"
            );

        const confirmacion =
            document.getElementById(
                "confirmacion"
            );

        const selectorLabel =
            document.getElementById(
                "selectorLabel"
            );

        const selectorValor =
            document.getElementById(
                "selectorValor"
            );

        const pasoMarca =
            document.getElementById(
                "pasoMarca"
            );

        const pasoModelo =
            document.getElementById(
                "pasoModelo"
            );

        let marcaSeleccionada = "";



        /* =========================
           ELEGIR MARCA
        ========================= */

        opcionesMarca.forEach(opcion => {

            opcion.addEventListener(
                "click",
                () => {

                    marcaSeleccionada =
                        opcion.dataset.marca;


                    selectorLabel.textContent =
                        "Selecciona un modelo";


                    selectorValor.textContent =
                        marcaSeleccionada;


                    pasoMarca.classList.remove(
                        "activo"
                    );

                    pasoModelo.classList.add(
                        "activo"
                    );


                    bloqueMarca.style.display =
                        "none";

                    bloqueModelo.style.display =
                        "block";

                    volverMarca.style.display =
                        "flex";

                }
            );

        });



        /* =========================
           ELEGIR MODELO
        ========================= */

        opcionesModelo.forEach(opcion => {

            opcion.addEventListener(
                "click",
                () => {

                    const modelo =
                        opcion.dataset.modelo;


                    localStorage.setItem(
                        "marca",
                        marcaSeleccionada
                    );

                    localStorage.setItem(
                        "modelo",
                        modelo
                    );


                    selectorLabel.textContent =
                        "Dispositivo seleccionado";

                    selectorValor.textContent =
                        modelo;


                    pasoModelo.classList.remove(
                        "activo"
                    );


                    bloqueModelo.style.display =
                        "none";

                    volverMarca.style.display =
                        "none";

                    confirmacion.style.display =
                        "block";


                    confirmacion.querySelector(
                        "h2"
                    ).textContent =
                        modelo;

                }
            );

        });



        /* =========================
           VOLVER
        ========================= */

        volverMarca.addEventListener(
            "click",
            () => {

                bloqueModelo.style.display =
                    "none";

                bloqueMarca.style.display =
                    "block";

                volverMarca.style.display =
                    "none";

                selectorLabel.textContent =
                    "Selecciona una marca";

                selectorValor.textContent =
                    "Marca";

                pasoModelo.classList.remove(
                    "activo"
                );

                pasoMarca.classList.add(
                    "activo"
                );

            }
        );

    </script>

</body>

</html>
