<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search,shopping_bag" />

    <style>

    .barra-navegacion {
        position: relative;
        margin-top: -35px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 100px;
    }
        
    .busqueda {
        position: absolute;
        background-color: rgb(248, 235, 235);
        margin-left: 0%;
        margin-top: 0px;
        width: 60%;
        border: 1px solid black;
        border-radius: 15px;
        height: 115px;
        z-index: 1;

    }

    .barra-navegacion img {
        width: 250px;
        height: 250px;
        z-index: 2;
    }

    .material-symbols-outlined {
        font-size: 50px;
        z-index: 2;
        font-variation-settings:
        'FILL' 0,
        'wght' 500,
        'GRAD' 0,
        'opsz' 504
    }

    .material-symbols-outlined {
        margin-right: -50px;
        z-index: 2;
        font-variation-settings:
        'FILL' 0,
        'wght' 200,
        'GRAD' 0,
        'opsz' 24
    }

    </style>

</head>
<body>
    <div class = "barra-navegacion">
        <div class = "busqueda"></div>
        <img src = "img/logo.png"> 
        <span class="material-symbols-outlined">search</span>
        <span class="material-symbols-outlined">shopping_bag</span>
    </div>
    
    
</body>
</html>
