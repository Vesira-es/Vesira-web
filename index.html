<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
    padding:80px 20px 20px;
}

/* ================= NAVBAR ================= */

.barra-navegacion{

    position:fixed;
    top:0;
    left:0;
    z-index:1000;

    width:100%;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    background:white;

    border-bottom:1px solid #ececec;

    opacity:0;
    transform:translateY(-20px);
    transition:.8s ease;

}

/* ---------- LOGO + LUPA ---------- */

.normal{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:35px;

    padding:8px 25px 8px 25px;

    background:#fffffd;

    border:1px solid #8f8f8f;

    border-radius:999px;

}

.logo{

    width:115px;
    height:auto;
    margin-left: 0;


}

/* ---------- BUSCADOR ---------- */

.buscar{

    display:none;

    flex:1;

    align-items:center;

    gap:12px;

    background:#FAFAFA;

    border:1px solid #E6E6E6;

    border-radius:999px;

    padding:15px 25px;

    margin:0 25px;

}

.buscar input{

    flex: 1;

    background:transparent;

    border:none;

    outline:none;

    font-size:17px;

    color:#222;

}

.buscar input::placeholder {
    color:#9A9A9A;
}

.buscar:hover{

    background:#F4F4F4;

}

.buscar:focus-within{

    border:1px solid #222;

}

.buscar{

    transition:.25s;

}

/* ---------- ICONOS ---------- */

.iconos{

    display:flex;
    align-items:center;
    gap:18px;

}

.material-symbols-outlined{

    font-size:32px;
    cursor:pointer;

}

button{

    border:none;
    background:none;
    cursor:pointer;
    font-size:22px;

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    body{
        padding:80px 10px 10px;
    }

    .barra-navegacion{

        padding:0 15px;

    }

    .material-symbols-outlined{

        font-size:28px;

    }

    .buscar{

        margin:0 10px;

        padding:10px 15px;

    }

    .buscar input{

        font-size:14px;

    }

    .botonIA {
        margin-right: 5px;
    }
    
    .eslogan{

        font-size:13px;
        letter-spacing:0.8px;
    }

}

#abrirBusqueda {
    animation: moverLupa 0.75s;
}


@keyframes moverLupa {

    0%{
        transform: translate(-60px, 0);
        opacity: 0;
    }

    60%{
        transform: translate(-10px, -8px);
        opacity: 1;
    }

    100%{
        transform: translate(0, 0);
    }

}

#botonIA {
    margin-right: 50px;
    cursor: pointer;

    font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24
}

.IA-activa {
    color:#F4B400;
    font-variation-settings:
    'FILL' 1,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
}

.eslogan{

    font-family:'Roboto',sans-serif;

    font-weight:700;

    font-size:20px;

    letter-spacing:3px;

    animation:introEslogan 4s ease forwards;

}

@keyframes introEslogan{

    0%{

        opacity:0;
        transform:translateY(20px);

    }

    20%{

        opacity:1;
        transform:translateY(0);

    }

    75%{

        opacity:1;
        transform:translateY(0);

    }

    100%{

        opacity:0;
        transform:translateY(-25px);

    }

}

.born{

    color:#FFFFFF;

    -webkit-text-stroke:0.5px #1d1d1d;

}

.in-the{

    color:#0057B8;

    -webkit-text-stroke:0.5px #1d1d1d;

}

.atlantic{

    color:#FFD100;

    -webkit-text-stroke:0.5px #1d1d1d;

}

.intro{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:80px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:white;

    z-index:2000;

}


</style>

</head>

<body>

<div class="intro">

    <div class="eslogan">

        <span class="born">BORN</span>
        <span class="in-the">IN THE</span>
        <span class="atlantic">ATLANTIC</span>

    </div>

</div>


<nav class="barra-navegacion">

    <div class="normal">

        <img src="img/logo.png" class="logo">

        <span
        class="material-symbols-outlined"
        id="abrirBusqueda">
            search
        </span>

    </div>

    <div class="buscar">

        <span class="material-symbols-outlined">
            search
        </span>

        <input
        type="text"
        placeholder="¿Qué estás buscando?">

        <span class="material-symbols-outlined" id = "botonIA">auto_awesome</span>

        <button id="cerrarBusqueda">
            ✕
        </button>

    </div>

    <div class="iconos">

        <span class="material-symbols-outlined">
            shopping_bag
        </span>

        <span class="material-symbols-outlined">
            person
        </span>
        
        <span class="material-symbols-outlined">
            menu
        </span>

    </div>  

</nav>

<script>

const normal = document.querySelector(".normal");
const buscar = document.querySelector(".buscar");
const iconos = document.querySelector(".iconos");
const IA = document.getElementById("botonIA");

let iaActiva = false;


document.getElementById("abrirBusqueda").addEventListener("click",()=>{

    normal.style.display = "none";
    iconos.style.display = "none";
    buscar.style.display = "flex";

    buscar.querySelector("input").focus();

});


document.getElementById("cerrarBusqueda").addEventListener("click",()=>{

    buscar.style.display = "none";
    normal.style.display = "flex";
    iconos.style.display = "flex";

});


IA.addEventListener("click",()=>{

    iaActiva = !iaActiva;

    if(iaActiva){

        IA.classList.add("IA-activa");

    } else {

        IA.classList.remove("IA-activa");

    }

});

const intro = document.querySelector(".intro");
const navbar = document.querySelector(".barra-navegacion");

setTimeout(()=>{

    intro.style.display = "none";

    navbar.style.opacity = "1";
    navbar.style.transform = "translateY(0)";

},500);

</script>

</body>

</html>
