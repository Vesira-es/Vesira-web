<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vesira</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >

    <style>

        /* =========================
           TEMA GENERAL
        ========================= */

        :root {
            --fondo: #0c0c0c;
            --texto: #ffffff;
            --borde: #292929;
            --caja: #171717;
            --texto-suave: #8b8b8b;
        }


        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--fondo);
            color: var(--texto);

            overflow-x: hidden;

            transition:
                background .3s ease,
                color .3s ease;
        }


        /* =========================
   MARQUEE VESIRA
========================= */

.marquee-vesira {
    width: 100%;
    overflow: hidden;

    background: transparent;

    padding: 45px 0;

    border-top: 1px solid var(--borde);
    border-bottom: 1px solid var(--borde);
}

.marquee-vesira-track {
    display: flex;

    width: max-content;

    animation:
        vesiraLoop 16s linear infinite;
}

.marquee-vesira-group {
    display: flex;
    align-items: center;

    flex-shrink: 0;

    gap: 90px;

    padding-right: 90px;
}

.marquee-vesira-group img {
    width: 165px;
    height: auto;

    display: block;

    flex-shrink: 0;
}

@keyframes vesiraLoop {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }

}


@media (max-width: 700px) {

    .marquee-vesira {
        padding: 32px 0;
    }

    .marquee-vesira-group {
        gap: 55px;
        padding-right: 55px;
    }

    .marquee-vesira-group img {
        width: 120px;
    }

}
        
        /* =========================
           INTRO
        ========================= */

        .intro {
            position: fixed;

            top: 0;
            left: 0;

            z-index: 2000;

            width: 100%;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--fondo);

            border-bottom:
                1px solid var(--borde);

            opacity: 1;

            transition:
                opacity .35s ease;
        }


        .eslogan {
            width: 410px;
            height: auto;
            display: block;
        }


        /* =========================
           NAVBAR
        ========================= */

        .barra-navegacion {
            position: fixed;

            top: 0;
            left: 0;

            z-index: 1000;

            width: 100%;
            height: 80px;

            background: var(--fondo);

            border-bottom:
                1px solid var(--borde);

            opacity: 0;

            transform:
                translateY(-20px);

            transition:
                .8s ease;
        }


        /* =========================
           LOGO + LUPA
        ========================= */

        .normal {
            position: absolute;

            left: 30px;
            top: 50%;

            transform:
                translateY(-50%);

            display: flex;

            align-items: center;

            gap: 35px;

            padding:
                8px 25px;

            background:
                var(--caja);

            border:
                1px solid var(--borde);

            border-radius:
                999px;
        }


        .logo {
            width: 115px;
            height: auto;
            display: block;
        }


        /* =========================
           BUSCADOR
        ========================= */

        .buscar {
            display: none;

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 620px;
            max-width: 50vw;

            height: 52px;

            align-items: center;

            gap: 12px;

            padding:
                0 22px;

            background:
                var(--caja);

            border:
                1px solid var(--borde);

            border-radius:
                999px;
        }


        .buscar input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            background:
                transparent;

            color:
                var(--texto);

            font-size:
                17px;
        }


        .buscar input::placeholder {
            color: #999;
        }


        /* =========================
           ICONOS DERECHA
        ========================= */

        .iconos {
            position: absolute;

            right: 30px;
            top: 50%;

            transform:
                translateY(-50%);

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .iconos span {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius:
                50%;

            color:
                var(--texto);

            cursor:
                pointer;
        }


        .iconos span:hover {
            background:
                var(--caja);
        }


        /* =========================
           BUSCADOR
        ========================= */

        #abrirBusqueda,
        #botonIA {
            cursor:
                pointer;
        }


        #cerrarBusqueda {
            border:
                none;

            background:
                transparent;

            color:
                var(--texto);

            cursor:
                pointer;

            font-size:
                19px;

            padding:
                0;
        }


        .IA-activa {
            color:
                #f4b400 !important;
        }


        /* =========================
           MÓVIL NAVBAR
        ========================= */

        @media (max-width: 700px) {

            .intro,
            .barra-navegacion {
                height:
                    72px;
            }


            .eslogan {
                width:
                    325px;
            }


            .normal {
                left:
                    14px;

                gap:
                    20px;

                padding:
                    7px 18px;
            }


            .logo {
                width:
                    103px;
            }


            .buscar {
                width:
                    220px;

                max-width:
                    none;

                height:
                    42px;

                padding:
                    0 14px;

                gap:
                    8px;
            }


            .buscar input {
                font-size:
                    14px;
            }


            .iconos {
                right:
                    14px;

                gap:
                    2px;
            }


            .iconos span {
                width:
                    36px;

                height:
                    36px;
            }

        }


        /* =========================
           IMAGEN PRINCIPAL
        ========================= */

        .imagen-principal {
    width: 100%;
    margin-top: -5px;

    height: 600px;
    overflow: hidden;

    background: var(--fondo);

    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.imagen-principal img {
    width: 100%;
    height: auto;
    display: block;
}


        

        @media (max-width: 700px) {

    .imagen-principal {
        margin-top: 72px;
        height: auto;
        overflow: visible;
    }

    .imagen-principal img {
        width: 100%;
        height: auto;
    }

}

        /* =========================
           PRODUCTOS
        ========================= */

        .productos {
            padding:
                55px 5vw 110px;
        }


        /* CABECERA + INTERRUPTOR */

        .productos-cabecera {
            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                30px;

            margin-bottom:
                24px;
        }


        .productos-cabecera h2 {
            font-family:
                "Bricolage Grotesque",
                sans-serif;

            font-size:
                clamp(42px, 5vw, 68px);

            font-weight:
                400;

            line-height:
                .88;

            letter-spacing:
                -.065em;
        }


        /* =========================
           CONTROL GENERAL IMÁGENES
        ========================= */

        .control-imagenes {
            display:
                flex;

            align-items:
                center;

            justify-content:
                flex-end;

            margin:
                0;

        }


        .control-imagenes-texto {
            display: none;
        }


        .interruptor-imagenes {
            display:
                flex;

            align-items:
                center;

            gap:
                4px;

            padding:
                4px;

            border:
                1px solid var(--borde);

            border-radius:
                999px;

            background:
                var(--caja);
        }


        .opcion-imagen {
            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                5px;

            min-width:
                74px;

            height:
                30px;

            padding:
                0 10px;

            border:
                none;

            border-radius:
                999px;

            background:
                transparent;

            color:
                var(--texto-suave);

            font-size:
                9px;

            cursor:
                pointer;

            transition:
                .2s ease;
        }


        .opcion-imagen.activa {
            background:
                var(--texto);

            color:
                var(--fondo);
        }


        .opcion-imagen
        .material-symbols-outlined {
            font-size:
                15px;
        }


        /* =========================
           GRID
        ========================= */

        .grid-productos {
            display:
                grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap:
                22px;
        }


        /* =========================
           CARD
        ========================= */

        .producto-card {
            position:
                relative;

            display:
                block;

            padding:
                14px;

            background:
                var(--caja);

            border:
                1px solid var(--borde);

            border-radius:
                22px;

            color:
                var(--texto);

            text-decoration:
                none;

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }


        .producto-card:hover {
            transform:
                translateY(-4px);

            border-color:
                rgba(255,255,255,.18);

            box-shadow:
                0 16px 40px
                rgba(0,0,0,.28);
        }


        /* =========================
           CUADRO IMAGEN
        ========================= */

        .producto-imagen {
            position:
                relative;

            width:
                100%;

            aspect-ratio:
                1 / .83;

            overflow:
                hidden;

            border-radius:
                16px;

            background:
                #101010;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transition:
                background .3s ease;
        }


        .producto-imagen.modo-claro {
            background:
                #f2f2ef;
        }


        .producto-imagen img {
            width:
                88%;

            height:
                88%;

            object-fit:
                contain;

            display:
                block;

            transition:
                transform .45s
                cubic-bezier(.2,.8,.2,1);
        }


        .producto-card:hover
        .producto-imagen img {
            transform:
                scale(1.06);
        }


        /* =========================
           INFORMACIÓN PRODUCTO
        ========================= */

        .producto-info {
            padding:
                17px 3px 3px;

            display:
                grid;

            grid-template-columns:
                1fr auto;

            grid-template-rows:
                auto auto;

            column-gap:
                20px;

            align-items:
                start;
        }


        .producto-nombre {
            grid-column:
                1;

            grid-row:
                1;

            font-family:
                "Bricolage Grotesque",
                sans-serif;

            font-size:
                20px;

            font-weight:
                400;

            letter-spacing:
                -.035em;

            line-height:
                1;

            margin:
                0;
        }


        .producto-descripcion {
            grid-column:
                1;

            grid-row:
                2;

            font-size:
                10px;

            line-height:
                1.55;

            color:
                var(--texto-suave);

            max-width:
                280px;

            margin-top:
                7px;
        }


        .producto-precio {
            grid-column:
                2;

            grid-row:
                1 / 3;

            align-self:
                center;

            font-size:
                14px;

            font-weight:
                500;

            letter-spacing:
                -.01em;

            color:
                var(--texto);

            white-space:
                nowrap;
        }


        /* =========================
           MENSAJE
        ========================= */

        .productos-mensaje {
            grid-column:
                1 / -1;

            padding:
                80px 20px;

            text-align:
                center;

            color:
                #999;

            font-size:
                13px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .grid-productos {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap:
                    18px;
            }

        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .productos {
                padding:
                    55px
                    14px
                    75px;
            }


            .productos-cabecera {
                margin-bottom:
                    18px;
            }


            .productos-cabecera h2 {
                font-size:
                    42px;
            }


            .interruptor-imagenes {
                gap:
                    3px;

                padding:
                    3px;
            }


            .opcion-imagen {
                min-width:
                    58px;

                height:
                    28px;

                padding:
                    0 8px;

                font-size:
                    8px;
            }


            .opcion-imagen
            .material-symbols-outlined {
                font-size:
                    14px;
            }


            .grid-productos {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap:
                    12px;
            }


            .producto-card {
                padding:
                    9px;

                border-radius:
                    17px;
            }


            .producto-imagen {
                aspect-ratio:
                    1 / .86;

                border-radius:
                    12px;
            }


            .producto-imagen img {
                width:
                    84%;

                height:
                    84%;
            }


            .producto-info {
                padding:
                    12px 2px 2px;

                column-gap:
                    8px;
            }


            .producto-nombre {
                font-size:
                    15px;
            }


            .producto-descripcion {
                font-size:
                    9px;

                margin-top:
                    5px;
            }


            .producto-precio {
                font-size:
                    11px;
            }

        }

    </style>

</head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        /* =========================
           REFERENCIAS
        ========================= */

        const intro =
            document.getElementById("intro");

        const navbar =
            document.getElementById("navbar");

        const normal =
            document.querySelector(".normal");

        const buscar =
            document.querySelector(".buscar");

        const abrirBusqueda =
            document.getElementById("abrirBusqueda");

        const cerrarBusqueda =
            document.getElementById("cerrarBusqueda");

        const inputBusqueda =
            document.getElementById("inputBusqueda");

        const botonIA =
            document.getElementById("botonIA");

        const gridProductos =
            document.getElementById("gridProductos");

        const imagenOscura =
            document.getElementById("imagenOscura");

        const imagenClara =
            document.getElementById("imagenClara");


        /* =========================
           INTRO → NAVBAR
        ========================= */

        setTimeout(() => {

            intro.style.opacity =
                "0";

            navbar.style.opacity =
                "1";

            navbar.style.transform =
                "translateY(0)";

            setTimeout(() => {

                intro.style.display =
                    "none";

            }, 350);

        }, 1500);


        /* =========================
           BUSCADOR
        ========================= */

        abrirBusqueda.addEventListener(
            "click",
            () => {

                normal.style.visibility =
                    "hidden";

                buscar.style.display =
                    "flex";

                inputBusqueda.focus();

            }
        );


        cerrarBusqueda.addEventListener(
            "click",
            () => {

                buscar.style.display =
                    "none";

                normal.style.visibility =
                    "visible";

                inputBusqueda.value =
                    "";

            }
        );


        /* =========================
           IA
        ========================= */

        let iaActiva = false;


        botonIA.addEventListener(
            "click",
            () => {

                iaActiva =
                    !iaActiva;

                botonIA.classList.toggle(
                    "IA-activa",
                    iaActiva
                );

                inputBusqueda.placeholder =
                    iaActiva
                        ? "Pregúntale a la IA"
                        : "¿Qué estás buscando?";

            }
        );


        /* =========================
           FONDO GENERAL DE FOTOS
        ========================= */

        let fondoClaro =
            false;


        function aplicarFondoImagenes(
            claro
        ) {

            fondoClaro =
                claro;


            document
                .querySelectorAll(
                    ".producto-imagen"
                )
                .forEach(
                    (imagen) => {

                        imagen.classList.toggle(
                            "modo-claro",
                            claro
                        );

                    }
                );


            imagenOscura.classList.toggle(
                "activa",
                !claro
            );


            imagenClara.classList.toggle(
                "activa",
                claro
            );

        }


        imagenOscura.addEventListener(
            "click",
            () => {

                aplicarFondoImagenes(
                    false
                );

            }
        );


        imagenClara.addEventListener(
            "click",
            () => {

                aplicarFondoImagenes(
                    true
                );

            }
        );


        /* =========================
           CARGAR PRODUCTOS
        ========================= */

        async function cargarProductos() {

            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .from("Productos")

                    .select(`
                        id,
                        nombre,
                        descripcion,
                        precio,
                        categoria,
                        activo,
                        created_at,
                        imagen_url
                    `)

                    .eq(
                        "activo",
                        true
                    )

                    .order(
                        "created_at",
                        {
                            ascending:
                                true
                        }
                    );


                if (error) {

                    throw error;

                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    gridProductos.innerHTML = `
                        <div class="productos-mensaje">
                            No hay gafas disponibles.
                        </div>
                    `;

                    return;

                }


                gridProductos.innerHTML =
                    "";


                data.forEach(
                    (producto) => {

                        const tarjeta =
                            document.createElement(
                                "a"
                            );


                        tarjeta.className =
                            "producto-card";


                        tarjeta.href =
                            `producto.html?id=${producto.id}`;


                        const precio =
                            Number(
                                producto.precio
                            )
                                .toFixed(2)
                                .replace(
                                    ".",
                                    ","
                                );


                        tarjeta.innerHTML = `

                            <div
                                class="producto-imagen"
                            >

                                <img
                                    src="${producto.imagen_url || ""}"
                                    alt="${producto.nombre}"
                                    loading="lazy"
                                >

                            </div>


                            <div
                                class="producto-info"
                            >

                                <h3
                                    class="producto-nombre"
                                >
                                    ${producto.nombre}
                                </h3>


                                ${
                                    producto.descripcion
                                        ? `
                                            <p
                                                class="producto-descripcion"
                                            >
                                                ${producto.descripcion}
                                            </p>
                                        `
                                        : ""
                                }


                                <span
                                    class="producto-precio"
                                >
                                    ${precio} €
                                </span>

                            </div>

                        `;


                        gridProductos.appendChild(
                            tarjeta
                        );

                    }
                );


                aplicarFondoImagenes(
                    fondoClaro
                );


            } catch (error) {

                console.error(
                    "Error cargando productos:",
                    error
                );


                gridProductos.innerHTML = `
                    <div class="productos-mensaje">
                        No se ha podido cargar la colección.
                    </div>
                `;

            }

        }


        cargarProductos();

    </script>


</body>

</html>
