<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fff;
}

/* ---------------- NAVBAR ---------------- */

.barra-navegacion{

    width:100%;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 40px;

    background:white;
}

.normal{

    display:flex;
    align-items:center;
    gap:20px;

}

.buscar{

    display:none;

    align-items:center;
    gap:15px;

    flex:1;

    max-width:700px;

    background:#f3f3f3;

    border-radius:40px;

    padding:12px 20px;

    margin-right:30px;
}

.buscar input{

    width:100%;

    border:none;

    outline:none;

    background:transparent;

    font-size:17px;

}

.iconos{

    display:flex;
    align-items:center;
    gap:20px;

}

.logo{

    width:170px;
    height:auto;

}

.material-symbols-outlined{

    font-size:34px;
    cursor:pointer;

}

button{

    border:none;
    background:transparent;
    font-size:22px;
    cursor:pointer;

}

/* ---------- MÓVIL ---------- */

@media(max-width:768px){

    .barra-navegacion{

        padding:0 15px;

    }

    .logo{

        width:120px;

    }

    .material-symbols-outlined{

        font-size:30px;

    }

    .buscar{

        margin-right:10px;

    }

}

</style>

</head>

<body>

<nav class="barra-navegacion">

    <div class="normal">

        <img src="img/logo.png" class="logo">

        <span class="material-symbols-outlined" id="abrirBusqueda">
            search
        </span>

    </div>

    <div class="buscar">

        <span class="material-symbols-outlined">
            search
        </span>

        <input
        type="text"
        placeholder="¿Qué estás buscando?">

        <button id="cerrarBusqueda">✕</button>

    </div>

    <div class="iconos">

        <span class="material-symbols-outlined">
            shopping_bag
        </span>

        <span class="material-symbols-outlined">
            person
        </span>

    </div>

</nav>

<script>

const normal = document.querySelector(".normal");
const buscar = document.querySelector(".buscar");

document
.getElementById("abrirBusqueda")
.addEventListener("click",()=>{

    normal.style.display="none";
    buscar.style.display="flex";

    buscar.querySelector("input").focus();

});

document
.getElementById("cerrarBusqueda")
.addEventListener("click",()=>{

    buscar.style.display="none";
    normal.style.display="flex";

});

</script>

</body>
</html>
