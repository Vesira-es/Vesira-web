<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
    padding: 80px;
}

/* ================= NAVBAR ================= */

.barra-navegacion{

    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;

    width:100%;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    background:white;

    border-bottom:1px solid #ececec;
}

/* ---------- LOGO + LUPA ---------- */

.normal{

    display:flex;
    align-items:center;
    gap:30px;

}

.logo{

    width:115px;
    height:auto;
    margin-left: 5vw;


}

/* ---------- BUSCADOR ---------- */

.buscar{

    display:none;

    flex:1;

    align-items:center;

    gap:12px;

    background:#FAFAFA;

    border:1px solid #E6E6E6;

    border-radius:999px;

    padding:15px 25px;

    margin:0 25px;

}

.buscar input{

    flex: 1;
    background:transparent;

    border:none;

    outline:none;

    font-size:17px;

    color:#222;

}

.buscar input::placeholder {
    color:#9A9A9A;
}

.buscar:hover{

    background:#F4F4F4;

}

.buscar:focus-within{

    border:1px solid #222;

}

.buscar{

    transition:.25s;

}

/* ---------- ICONOS ---------- */

.iconos{

    display:flex;
    align-items:center;
    gap:18px;

}

.material-symbols-outlined{

    font-size:32px;
    cursor:pointer;

}

button{

    border:none;
    background:none;
    cursor:pointer;
    font-size:22px;

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    .barra-navegacion{

        padding:0 15px;

    }

    .logo{

        width:90px;

    }

    .material-symbols-outlined{

        font-size:28px;

    }

    .buscar{

        margin:0 10px;

        padding:10px 15px;

    }

    .buscar input{

        font-size:14px;

    }

}

#abrirBusqueda {
    animation: moverLupa 0.75s;
}


@keyframes moverLupa {

    0%{
        transform: translate(-60px, 0);
        opacity: 0;
    }

    60%{
        transform: translate(-10px, -8px);
        opacity: 1;
    }

    100%{
        transform: translate(0, 0);
    }

}

</style>

</head>

<body>

<nav class="barra-navegacion">

    <div class="normal">

        <img src="img/logo.png" class="logo">

        <span
        class="material-symbols-outlined"
        id="abrirBusqueda">
            search
        </span>

    </div>

    <div class="buscar">

        <span class="material-symbols-outlined">
            search
        </span>

        <input
        type="text"
        placeholder="¿Qué estás buscando?">

        <button id="cerrarBusqueda">
            ✕
        </button>

    </div>

    <div class="iconos">

        <span class="material-symbols-outlined">
            shopping_bag
        </span>

        <span class="material-symbols-outlined">
            person
        </span>
        
        <span class="material-symbols-outlined">
            menu
        </span>

    </div>

</nav>

<script>

const normal = document.querySelector(".normal");
const buscar = document.querySelector(".buscar");
const iconos = document.querySelector(".iconos");

document.getElementById("abrirBusqueda").addEventListener("click",()=>{

    normal.style.display="none";
    iconos.style.display="none";
    buscar.style.display="flex";

    buscar.querySelector("input").focus();

});

document.getElementById("cerrarBusqueda").addEventListener("click",()=>{

    buscar.style.display="none";
    normal.style.display="flex";
    iconos.style.display="flex";

});

</script>

</body>

</html>
