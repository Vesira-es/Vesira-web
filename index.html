<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vesira</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >

    <style>

        :root {
            --fondo: #ffffff;
            --texto: #111111;
            --borde: #e6e6e6;
            --caja: #ffffff;
        }

        body.modo-oscuro {
            --fondo: #0c0c0c;
            --texto: #ffffff;
            --borde: #292929;
            --caja: #171717;
        }


        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--fondo);
            color: var(--texto);

            overflow-x: hidden;

            transition: .3s ease;
        }


        /* =========================
           INTRO EN ZONA NAVBAR
        ========================= */

        .intro {
            position: fixed;

            top: 0;
            left: 0;

            z-index: 2000;

            width: 100%;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--fondo);

            border-bottom: 1px solid var(--borde);

            opacity: 1;

            transition: opacity .35s ease;
        }

        .eslogan {
            width: 410px;
            height: auto;
            display: block;
        }


        /* =========================
           NAVBAR
        ========================= */

        .barra-navegacion {
            position: fixed;

            top: 0;
            left: 0;

            z-index: 1000;

            width: 100%;
            height: 80px;

            background: var(--fondo);

            border-bottom: 1px solid var(--borde);

            opacity: 0;

            transform: translateY(-20px);

            transition: .8s ease;
        }


        /* =========================
           LOGO + LUPA
        ========================= */

        .normal {
            position: absolute;

            left: 30px;
            top: 50%;

            transform: translateY(-50%);

            display: flex;
            align-items: center;

            gap: 35px;

            padding: 8px 25px;

            background: var(--caja);

            border: 1px solid var(--borde);

            border-radius: 999px;
        }

        .logo {
            width: 115px;
            height: auto;
            display: block;
        }


        /* =========================
           BUSCADOR
        ========================= */

        .buscar {
            display: none;

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 620px;
            max-width: 50vw;

            height: 52px;

            align-items: center;
            gap: 12px;

            padding: 0 22px;

            background: var(--caja);

            border: 1px solid var(--borde);

            border-radius: 999px;
        }

        .buscar input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            color: var(--texto);

            font-size: 17px;
        }

        .buscar input::placeholder {
            color: #999;
        }


        /* =========================
           ICONOS DERECHA
        ========================= */

        .iconos {
            position: absolute;

            right: 30px;
            top: 50%;

            transform: translateY(-50%);

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .iconos span,
        .tema-boton {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--texto);

            cursor: pointer;
        }

        .iconos span:hover,
        .tema-boton:hover {
            background: var(--caja);
        }

        .tema-boton {
            border: none;
            background: transparent;
        }


        /* =========================
           BUSCADOR
        ========================= */

        #abrirBusqueda,
        #botonIA {
            cursor: pointer;
        }

        #cerrarBusqueda {
            border: none;
            background: transparent;

            color: var(--texto);

            cursor: pointer;

            font-size: 19px;
            padding: 0;
        }

        .IA-activa {
            color: #f4b400 !important;
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .intro,
            .barra-navegacion {
                height: 72px;
            }

            .eslogan {
                width: 325px;
            }

            .normal {
                left: 14px;

                gap: 20px;

                padding: 7px 18px;
            }

            .logo {
                width: 103px;
            }

            .buscar {
                width: 220px;

                max-width: none;

                height: 42px;

                padding: 0 14px;

                gap: 8px;
            }

            .buscar input {
                font-size: 14px;
            }

            .iconos {
                right: 14px;

                gap: 2px;
            }

            .iconos span,
            .tema-boton {
                width: 36px;
                height: 36px;
            }

        }

        /* =========================
   IMAGEN PRINCIPAL
========================= */
/* =========================
   IMAGEN PRINCIPAL
========================= */

/* =========================
   IMAGEN PRINCIPAL
========================= */

.imagen-principal {
    width: 100%;
    margin-top: 130px;

    overflow: hidden;

    background: var(--fondo);

    display: flex;
    justify-content: center;
}

.imagen-principal img {
    width: 100%;
    height: auto;

    display: block;
}


/* =========================
   MÓVIL
========================= */

@media (max-width: 700px) {

    .imagen-principal {
        margin-top: 72px;
    }

    .imagen-principal img {
        width: 100%;
        height: auto;
        margin: 0;
    }

}

        
/* =========================
   PRODUCTOS
========================= */

.productos {
    padding: 125px 5vw 110px;
}

.productos-cabecera {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 30px;

    margin-bottom: 38px;
}

.productos-cabecera span {
    display: block;

    margin-bottom: 10px;

    font-size: 9px;
    letter-spacing: .22em;
    text-transform: uppercase;

    color: #999;
}

.productos-cabecera h2 {
    font-family: "Bricolage Grotesque", sans-serif;

    font-size: clamp(42px, 5vw, 68px);

    font-weight: 400;

    line-height: .88;

    letter-spacing: -.065em;
}

.productos-cabecera p {
    max-width: 230px;

    font-size: 12px;

    line-height: 1.6;

    color: #888;

    text-align: right;
}


/* =========================
   GRID
========================= */

.grid-productos {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 22px;
}


/* =========================
   CARD
========================= */

.producto-card {
    position: relative;

    display: block;

    padding: 14px;

    background: var(--caja);

    border: 1px solid var(--borde);

    border-radius: 22px;

    color: var(--texto);

    text-decoration: none;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.producto-card:hover {
    transform: translateY(-4px);

    border-color:
        rgba(120,120,120,.35);

    box-shadow:
        0 16px 40px rgba(0,0,0,.07);
}

body.modo-oscuro .producto-card:hover {
    box-shadow:
        0 16px 40px rgba(0,0,0,.28);
}


/* =========================
   IMAGEN
========================= */

.producto-imagen {
    position: relative;

    width: 100%;

    aspect-ratio: 1 / .83;

    overflow: hidden;

    border-radius: 16px;

    background: var(--gris);

    display: flex;

    align-items: center;
    justify-content: center;
}

.producto-imagen img {
    width: 88%;
    height: 88%;

    object-fit: contain;

    display: block;

    transition:
        transform .45s cubic-bezier(.2,.8,.2,1);
}

.producto-card:hover
.producto-imagen img {
    transform: scale(1.06);
}


/* =========================
   INFORMACIÓN
========================= */

.producto-info {
    padding:
        16px
        4px
        4px;
}

.producto-nombre-precio {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.producto-nombre {
    font-family:
        "Bricolage Grotesque",
        sans-serif;

    font-size: 19px;

    font-weight: 400;

    letter-spacing: -.025em;
}

.producto-precio {
    flex-shrink: 0;

    padding:
        7px
        10px;

    border:
        1px solid var(--borde);

    border-radius: 999px;

    font-size: 11px;

    color: var(--texto);
}

.producto-descripcion {
    margin-top: 8px;

    font-size: 10px;

    line-height: 1.5;

    color: #999;

    max-width: 280px;
}


/* =========================
   PEQUEÑO DETALLE
========================= */


/* =========================
   MENSAJE
========================= */

.productos-mensaje {
    grid-column: 1 / -1;

    padding: 80px 20px;

    text-align: center;

    color: #999;

    font-size: 13px;
}


/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .grid-productos {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 18px;
    }

}


/* =========================
   MÓVIL
========================= */

@media (max-width: 700px) {

    .productos {
        padding:
            95px
            14px
            75px;
    }

    .productos-cabecera {
        flex-direction: column;

        align-items: flex-start;

        gap: 12px;

        margin-bottom: 28px;
    }

    .productos-cabecera h2 {
        font-size: 42px;
    }

    .productos-cabecera p {
        text-align: left;

        max-width: 240px;
    }

    .grid-productos {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }

    .producto-card {
        padding: 9px;

        border-radius: 17px;
    }

    .producto-imagen {
        aspect-ratio: 1 / .86;

        border-radius: 12px;
    }

    .producto-imagen img {
        width: 84%;
        height: 84%;
    }

    .producto-info {
        padding-top: 12px;
    }

    .producto-nombre {
        font-size: 15px;
    }

    .producto-precio {
        padding: 5px 8px;

        font-size: 9px;
    }

    .producto-descripcion {
        font-size: 9px;

        margin-top: 6px;
    }


}

    </style>

</head>


<body>


    <!-- =========================
         INTRO
    ========================= -->

    <div
        class="intro"
        id="intro"
    >

        <img
            src="img/eslogan.png"
            alt="Vesira"
            class="eslogan"
        >

    </div>



    <!-- =========================
         NAVBAR
         NO TOCADA
    ========================= -->

    <nav
        class="barra-navegacion"
        id="navbar"
    >

        <div class="normal">

            <img
                src="img/logo.png"
                class="logo"
                id="logoVesira"
                alt="Vesira"
            >

            <span
                class="material-symbols-outlined"
                id="abrirBusqueda">
                search
            </span>

        </div>


        <div class="buscar">

            <span class="material-symbols-outlined">
                search
            </span>

            <input
                id="inputBusqueda"
                type="text"
                placeholder="¿Qué estás buscando?"
            >

            <span
                class="material-symbols-outlined"
                id="botonIA">
                auto_awesome
            </span>

            <button
                id="cerrarBusqueda"
                aria-label="Cerrar búsqueda">
                ✕
            </button>

        </div>


        <div class="iconos">

            <span class="material-symbols-outlined">
                shopping_bag
            </span>

            <button
                class="tema-boton material-symbols-outlined"
                id="cambiarTema"
                aria-label="Cambiar tema">
                dark_mode
            </button>

            <span class="material-symbols-outlined">
                menu
            </span>

        </div>

    </nav>


    <!-- IMAGEN PRINCIPAL -->
     <!-- =========================
     IMAGEN PRINCIPAL
========================= -->

<section class="imagen-principal">

    <img
        src="img/imagen-principal.png"
        alt="Personas llevando gafas Vesira"
    >

</section>


<!-- =========================
     PRODUCTOS
========================= -->

<section class="productos">

    <div class="productos-cabecera">

        <div>

            <span>
                VESIRA · EYEWEAR
            </span>

            <h2>
                Las gafas.
            </h2>

        </div>


    </div>

    <div
        class="grid-productos"
        id="gridProductos">
    </div>

</section>

    <!-- =========================
         PRODUCTOS
    ========================= -->

    <section class="productos">


        <div
            class="grid-productos"
            id="gridProductos"
        >

        </div>

    </section>



    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>



    <script>

        /* =========================
           REFERENCIAS
        ========================= */

        const intro =
            document.getElementById("intro");

        const navbar =
            document.getElementById("navbar");

        const normal =
            document.querySelector(".normal");

        const buscar =
            document.querySelector(".buscar");

        const abrirBusqueda =
            document.getElementById("abrirBusqueda");

        const cerrarBusqueda =
            document.getElementById("cerrarBusqueda");

        const inputBusqueda =
            document.getElementById("inputBusqueda");

        const botonIA =
            document.getElementById("botonIA");

        const cambiarTema =
            document.getElementById("cambiarTema");

        const logoVesira =
            document.getElementById("logoVesira");

        const gridProductos =
            document.getElementById("gridProductos");


        /* =========================
           TEMA + LOGO
        ========================= */

        function aplicarTema(oscuro) {

            if (oscuro) {

                document.body.classList.add(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "light_mode";

                logoVesira.src =
                    "img/logo2.png";

            } else {

                document.body.classList.remove(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "dark_mode";

                logoVesira.src =
                    "img/logo.png";

            }

        }


        const temaGuardado =
            localStorage.getItem(
                "vesiraTema"
            );


        aplicarTema(
            temaGuardado === "oscuro"
        );


        cambiarTema.addEventListener(
            "click",
            () => {

                const oscuro =
                    !document.body.classList.contains(
                        "modo-oscuro"
                    );

                localStorage.setItem(
                    "vesiraTema",
                    oscuro
                        ? "oscuro"
                        : "claro"
                );

                aplicarTema(oscuro);

            }
        );


        /* =========================
           INTRO → NAVBAR
        ========================= */

        setTimeout(() => {

            intro.style.opacity = "0";

            navbar.style.opacity = "1";

            navbar.style.transform =
                "translateY(0)";

            setTimeout(() => {

                intro.style.display =
                    "none";

            }, 350);

        }, 1500);


        /* =========================
           BUSCADOR
        ========================= */

        abrirBusqueda.addEventListener(
            "click",
            () => {

                normal.style.visibility =
                    "hidden";

                buscar.style.display =
                    "flex";

                inputBusqueda.focus();

            }
        );


        cerrarBusqueda.addEventListener(
            "click",
            () => {

                buscar.style.display =
                    "none";

                normal.style.visibility =
                    "visible";

                inputBusqueda.value = "";

            }
        );


        /* =========================
           IA
        ========================= */

        let iaActiva = false;


        botonIA.addEventListener(
            "click",
            () => {

                iaActiva =
                    !iaActiva;

                botonIA.classList.toggle(
                    "IA-activa",
                    iaActiva
                );

                inputBusqueda.placeholder =
                    iaActiva
                        ? "Pregúntale a la IA"
                        : "¿Qué estás buscando?";

            }
        );


        /* =========================
           CARGAR PRODUCTOS
        ========================= */

        async function cargarProductos() {

            try {

                const {
    data,
    error
} = await supabaseClient
    .from("Productos")

                    .select(`
                        id,
                        nombre,
                        descripcion,
                        precio,
                        imagen_url,
                        categoria,
                        activo,
                        created_at
                    `)

                    .eq(
                        "activo",
                        true
                    )

                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


                if (error) {

                    throw error;

                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    gridProductos.innerHTML = `
                        <div class="productos-mensaje">
                            No hay gafas disponibles.
                        </div>
                    `;

                    return;

                }


                gridProductos.innerHTML = "";


                data.forEach(producto => {

                    const tarjeta =
                        document.createElement("a");


                    tarjeta.className =
                        "producto-card";


                    tarjeta.href =
                        `producto.html?id=${producto.id}`;


                    const precio =
                        Number(producto.precio)
                            .toFixed(2)
                            .replace(
                                ".",
                                ","
                            );


                    tarjeta.innerHTML = `

                        <div class="producto-imagen">

                            <img
                                src="${producto.imagen_url || ""}"
                                alt="${producto.nombre}"
                                loading="lazy"
                            >

                        </div>


                        <div class="producto-info">

                            <div class="producto-nombre-precio">

                                <h3 class="producto-nombre">
                                    ${producto.nombre}
                                </h3>

                                <span class="producto-precio">
                                    ${precio} €
                                </span>

                            </div>


                            ${
                                producto.descripcion
                                    ? `
                                        <p class="producto-descripcion">
                                            ${producto.descripcion}
                                        </p>
                                    `
                                    : ""
                            }

                        </div>

                    `;


                    gridProductos.appendChild(
                        tarjeta
                    );

                });

            } catch (error) {

                console.error(
                    "Error cargando productos:",
                    error
                );

                gridProductos.innerHTML = `
                    <div class="productos-mensaje">
                        No se ha podido cargar la colección.
                    </div>
                `;

            }

        }


        cargarProductos();

    </script>


</body>

</html>
