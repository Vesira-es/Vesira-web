<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vesira</title>


    <!-- ICONOS -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >


    <style>

        /* =========================
           VARIABLES
        ========================= */

        :root {

            --fondo: #ffffff;
            --texto: #111111;
            --borde: #e6e6e6;
            --caja: #ffffff;

        }


        body.modo-oscuro {

            --fondo: #0c0c0c;
            --texto: #ffffff;
            --borde: #292929;
            --caja: #171717;

        }


        /* =========================
           GENERAL
        ========================= */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        body {

            background: var(--fondo);
            color: var(--texto);

            transition:
                background .3s ease,
                color .3s ease;

            overflow-x: hidden;

        }


        /* =========================
           NAVBAR
        ========================= */

        .barra-navegacion {

            position: fixed;

            top: 0;
            left: 0;

            z-index: 1000;

            width: 100%;
            height: 80px;

            background: var(--fondo);

            border-bottom:
                1px solid var(--borde);

        }


        /* =========================
           IZQUIERDA
        ========================= */

        .normal {

            position: absolute;

            left: 30px;
            top: 50%;

            transform: translateY(-50%);

            display: flex;

            align-items: center;

            gap: 35px;

            padding: 8px 25px;

            background: var(--caja);

            border:
                1px solid var(--borde);

            border-radius: 999px;

        }


        .logo {

            width: 115px;

            height: auto;

            display: block;

        }


        /* =========================
           BUSCADOR
        ========================= */

        .buscar {

            display: none;

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: min(620px, 50vw);

            align-items: center;

            gap: 12px;

            padding: 15px 25px;

            background: var(--caja);

            border:
                1px solid var(--borde);

            border-radius: 999px;

        }


        .buscar input {

            flex: 1;

            min-width: 0;

            border: none;

            outline: none;

            background: transparent;

            color: var(--texto);

            font-size: 17px;

        }


        .buscar input::placeholder {

            color: #999;

        }


        /* =========================
           DERECHA
        ========================= */

        .iconos {

            position: absolute;

            right: 30px;
            top: 50%;

            transform: translateY(-50%);

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .iconos span,
        .tema-boton {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--texto);

            cursor: pointer;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .iconos span:hover,
        .tema-boton:hover {

            background: var(--caja);

            transform: translateY(-2px);

        }


        .tema-boton {

            border: none;

            background: transparent;

        }


        /* =========================
           BOTONES BUSCADOR
        ========================= */

        #abrirBusqueda {

            cursor: pointer;

        }


        #cerrarBusqueda {

            border: none;

            background: transparent;

            color: var(--texto);

            cursor: pointer;

            font-size: 20px;

            padding: 0;

        }


        #botonIA {

            cursor: pointer;

        }


        .IA-activa {

            color: #f4b400 !important;

        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .barra-navegacion {

                height: 72px;

            }


            .normal {

                left: 14px;

                gap: 20px;

                padding:
                    7px
                    18px;

            }


            .logo {

                width: 103px;

            }


            .iconos {

                right: 14px;

                gap: 2px;

            }


            .iconos span,
            .tema-boton {

                width: 36px;

                height: 36px;

            }


            .buscar {

                width:
                    calc(100vw - 155px);

                padding:
                    11px
                    15px;

            }


            .buscar input {

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="barra-navegacion">


        <!-- IZQUIERDA -->

        <div class="normal">

            <img
                src="img/logo.png"
                class="logo"
                id="logoVesira"
                alt="Vesira"
            >

            <span
                class="material-symbols-outlined"
                id="abrirBusqueda">
                search
            </span>

        </div>


        <!-- CENTRO -->

        <div class="buscar">

            <span class="material-symbols-outlined">
                search
            </span>

            <input
                id="inputBusqueda"
                type="text"
                placeholder="¿Qué estás buscando?"
            >

            <span
                class="material-symbols-outlined"
                id="botonIA">
                auto_awesome
            </span>

            <button
                id="cerrarBusqueda"
                aria-label="Cerrar búsqueda">
                ✕
            </button>

        </div>


        <!-- DERECHA -->

        <div class="iconos">

            <span class="material-symbols-outlined">
                shopping_bag
            </span>

            <button
                class="tema-boton material-symbols-outlined"
                id="cambiarTema"
                aria-label="Cambiar tema">
                dark_mode
            </button>

            <span class="material-symbols-outlined">
                menu
            </span>

        </div>

    </nav>



    <script>

        /* =========================
           REFERENCIAS
        ========================= */

        const normal =
            document.querySelector(".normal");

        const buscar =
            document.querySelector(".buscar");

        const abrirBusqueda =
            document.getElementById(
                "abrirBusqueda"
            );

        const cerrarBusqueda =
            document.getElementById(
                "cerrarBusqueda"
            );

        const inputBusqueda =
            document.getElementById(
                "inputBusqueda"
            );

        const botonIA =
            document.getElementById(
                "botonIA"
            );

        const cambiarTema =
            document.getElementById(
                "cambiarTema"
            );

        const logoVesira =
            document.getElementById(
                "logoVesira"
            );


        /* =========================
           BUSCADOR
        ========================= */

        abrirBusqueda.addEventListener(
            "click",
            () => {

                normal.style.visibility =
                    "hidden";

                buscar.style.display =
                    "flex";

                inputBusqueda.focus();

            }
        );


        cerrarBusqueda.addEventListener(
            "click",
            () => {

                buscar.style.display =
                    "none";

                normal.style.visibility =
                    "visible";

                inputBusqueda.value = "";

            }
        );


        /* =========================
           IA
        ========================= */

        let iaActiva = false;


        botonIA.addEventListener(
            "click",
            () => {

                iaActiva =
                    !iaActiva;


                botonIA.classList.toggle(
                    "IA-activa",
                    iaActiva
                );


                inputBusqueda.placeholder =
                    iaActiva
                        ? "Pregúntale a la IA"
                        : "¿Qué estás buscando?";

            }
        );


        /* =========================
           TEMA + LOGO
        ========================= */

        function aplicarTema(oscuro) {

            if (oscuro) {

                document.body.classList.add(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "light_mode";

                logoVesira.src =
                    "img/logo2.png";

            } else {

                document.body.classList.remove(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "dark_mode";

                logoVesira.src =
                    "img/logo.png";

            }

        }


        const temaGuardado =
            localStorage.getItem(
                "vesiraTema"
            );


        aplicarTema(
            temaGuardado === "oscuro"
        );


        cambiarTema.addEventListener(
            "click",
            () => {

                const oscuro =
                    !document.body.classList.contains(
                        "modo-oscuro"
                    );


                localStorage.setItem(
                    "vesiraTema",
                    oscuro
                        ? "oscuro"
                        : "claro"
                );


                aplicarTema(oscuro);

            }
        );

    </script>


</body>

</html>
