<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vesira</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >

    <style>

        :root {
            --fondo: #ffffff;
            --texto: #111111;
            --borde: #e6e6e6;
            --caja: #ffffff;
        }

        body.modo-oscuro {
            --fondo: #0c0c0c;
            --texto: #ffffff;
            --borde: #292929;
            --caja: #171717;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            transition: .3s ease;
        }


        /* =========================
           NAVBAR
        ========================= */

        .barra-navegacion {

            position: fixed;

            top: 0;
            left: 0;

            z-index: 1000;

            width: 100%;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: var(--fondo);

            border-bottom: 1px solid var(--borde);

        }


        /* LOGO + LUPA */

        .normal {

            display: flex;
            align-items: center;

            gap: 35px;

            padding: 8px 25px;

            background: var(--caja);

            border: 1px solid var(--borde);

            border-radius: 999px;

        }


        .logo {

            width: 115px;
            height: auto;

        }


        /* BUSCADOR */

        .buscar {

            display: none;

            flex: 1;

            align-items: center;

            gap: 12px;

            margin: 0 25px;

            padding: 15px 25px;

            background: var(--caja);

            border: 1px solid var(--borde);

            border-radius: 999px;

        }


        .buscar input {

            flex: 1;

            min-width: 0;

            border: none;

            outline: none;

            background: transparent;

            color: var(--texto);

            font-size: 17px;

        }


        .buscar input::placeholder {
            color: #999;
        }


        /* ICONOS */

        .iconos {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .iconos span,
        .tema-boton {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--texto);

            cursor: pointer;

        }


        .iconos span:hover,
        .tema-boton:hover {

            background: var(--caja);

        }


        .tema-boton {

            border: none;

            background: transparent;

        }


        #cerrarBusqueda {

            border: none;

            background: transparent;

            color: var(--texto);

            cursor: pointer;

            font-size: 20px;

        }


        #botonIA {

            cursor: pointer;

        }


        .IA-activa {

            color: #f4b400 !important;

        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .barra-navegacion {

                height: 72px;

                padding: 0 14px;

            }


            .normal {

                gap: 20px;

                padding: 7px 18px;

            }


            .logo {

                width: 103px;

            }


            .iconos {

                gap: 2px;

            }


            .iconos span,
            .tema-boton {

                width: 36px;

                height: 36px;

            }


            .buscar {

                margin: 0 10px;

                padding: 11px 15px;

            }


            .buscar input {

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


    <nav class="barra-navegacion">


        <!-- LOGO + LUPA -->

        <div class="normal">

            <img
                src="img/logo.png"
                class="logo"
                id="logoVesira"
                alt="Vesira"
            >

            <span
                class="material-symbols-outlined"
                id="abrirBusqueda">
                search
            </span>

        </div>


        <!-- BUSCADOR -->

        <div class="buscar">

            <span class="material-symbols-outlined">
                search
            </span>

            <input
                id="inputBusqueda"
                type="text"
                placeholder="¿Qué estás buscando?"
            >

            <span
                class="material-symbols-outlined"
                id="botonIA">
                auto_awesome
            </span>

            <button id="cerrarBusqueda">
                ✕
            </button>

        </div>


        <!-- ICONOS -->

        <div class="iconos">

            <span class="material-symbols-outlined">
                shopping_bag
            </span>

            <button
                class="tema-boton material-symbols-outlined"
                id="cambiarTema">
                dark_mode
            </button>

            <span class="material-symbols-outlined">
                menu
            </span>

        </div>

    </nav>


    <script>

        /* =========================
           REFERENCIAS
        ========================= */

        const normal =
            document.querySelector(".normal");

        const buscar =
            document.querySelector(".buscar");

        const iconos =
            document.querySelector(".iconos");

        const abrirBusqueda =
            document.getElementById("abrirBusqueda");

        const cerrarBusqueda =
            document.getElementById("cerrarBusqueda");

        const inputBusqueda =
            document.getElementById("inputBusqueda");

        const botonIA =
            document.getElementById("botonIA");

        const cambiarTema =
            document.getElementById("cambiarTema");

        const logoVesira =
            document.getElementById("logoVesira");


        /* =========================
           BUSCADOR
        ========================= */

        abrirBusqueda.addEventListener("click", () => {

            normal.style.display = "none";
            iconos.style.display = "none";
            buscar.style.display = "flex";

            inputBusqueda.focus();

        });


        cerrarBusqueda.addEventListener("click", () => {

            buscar.style.display = "none";
            normal.style.display = "flex";
            iconos.style.display = "flex";

            inputBusqueda.value = "";

        });


        /* =========================
           IA
        ========================= */

        let iaActiva = false;

        botonIA.addEventListener("click", () => {

            iaActiva = !iaActiva;

            botonIA.classList.toggle(
                "IA-activa",
                iaActiva
            );

            inputBusqueda.placeholder =
                iaActiva
                    ? "Pregúntale a la IA"
                    : "¿Qué estás buscando?";

        });


        /* =========================
           TEMA + LOGO
        ========================= */

        function aplicarTema(oscuro) {

            if (oscuro) {

                document.body.classList.add(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "light_mode";

                logoVesira.src =
                    "img/logo2.png";

            } else {

                document.body.classList.remove(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "dark_mode";

                logoVesira.src =
                    "img/logo.png";

            }

        }


        const temaGuardado =
            localStorage.getItem("vesiraTema");


        aplicarTema(
            temaGuardado === "oscuro"
        );


        cambiarTema.addEventListener(
            "click",
            () => {

                const oscuro =
                    !document.body.classList.contains(
                        "modo-oscuro"
                    );

                localStorage.setItem(
                    "vesiraTema",
                    oscuro
                        ? "oscuro"
                        : "claro"
                );

                aplicarTema(oscuro);

            }
        );

    </script>


</body>

</html>
