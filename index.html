<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600&family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
:root{
  --fondo:#0c0c0c;
  --texto:#fff;
  --borde:#262626;
  --caja:#151515;
  --suave:#8d8d8d;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--fondo);
  color:var(--texto);
  font-family:"Outfit",Arial,sans-serif;
  overflow-x:hidden;
}
button{font:inherit}

/* INTRO */
.intro{
  position:fixed;
  inset:0;
  z-index:2000;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--fondo);
  border-bottom:1px solid var(--borde);
  transition:opacity .35s ease;
}
.eslogan{width:410px;max-width:78vw;height:auto;display:block}

/* NAVBAR */
.barra-navegacion{
  position:fixed;
  top:0;
  left:0;
  z-index:1000;
  width:100%;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:rgba(12,12,12,.78);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  opacity:0;
  transform:translateY(-18px);
  transition:opacity .7s ease,transform .7s ease;
}
.nav-left{
  display:flex;
  align-items:center;
  min-width:0;
}
.normal{
  display:flex;
  align-items:center;
  gap:14px;
  padding:8px 16px 8px 14px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.10);
  border-radius:999px;
}
.logo{
  width:114px;
  height:auto;
  display:block;
}
.nav-divider{
  width:1px;
  height:18px;
  background:rgba(255,255,255,.14);
}
.nav-word{
  color:var(--suave);
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  white-space:nowrap;
}
.iconos{
  display:flex;
  align-items:center;
  gap:6px;
}
.nav-icon{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:var(--texto);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .2s ease,transform .2s ease;
}
.nav-icon:hover{background:var(--caja);transform:translateY(-1px)}

/* HERO */
.imagen-principal{
  position:relative;
  width:100%;
  margin-top:0;
  height:min(680px,56vw);
  min-height:440px;
  overflow:hidden;
  background:var(--fondo);
}
.imagen-principal img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center top;
}
.imagen-principal::before,
.imagen-principal::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  z-index:2;
  pointer-events:none;
}
.imagen-principal::before{
  top:0;
  height:120px;
  background:linear-gradient(to bottom,var(--fondo),rgba(12,12,12,.76),transparent);
}
.imagen-principal::after{
  bottom:0;
  height:150px;
  background:linear-gradient(to top,var(--fondo),rgba(12,12,12,.78),transparent);
}

/* PRODUCTOS */
.productos{
  padding:54px 5vw 110px;
}
.productos-cabecera{
  margin-bottom:24px;
}
.productos-cabecera h2 {
      font-family:
                Impact,
                "Arial Black",
                "Bricolage Grotesque",
                sans-serif;
      font-size:
                clamp(46px, 5.4vw, 76px);
      font-weight:
                900;
      line-height:
                .82;
      letter-spacing:
                -.055em;
      text-transform:
                uppercase;
      transform:
                skewX(-8deg);
      transform-origin:
                left center;
    }
.grid-productos{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}
.producto-card{
  display:block;
  color:var(--texto);
  text-decoration:none;
  background:var(--caja);
  border:1px solid rgba(255,255,255,.07);
  border-radius:22px;
  padding:12px;
  transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}
.producto-card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.15);
  box-shadow:0 18px 45px rgba(0,0,0,.25);
}
.producto-imagen{
  width:100%;
  aspect-ratio:1/.86;
  overflow:hidden;
  border-radius:16px;
  background:#f2f2ef;
  display:flex;
  align-items:center;
  justify-content:center;
}
.producto-imagen img{
  width:86%;
  height:86%;
  object-fit:contain;
  display:block;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.producto-card:hover .producto-imagen img{transform:scale(1.05)}
.producto-info{
  padding:15px 3px 4px;
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-rows:auto auto;
  column-gap:14px;
}
.producto-nombre{
  grid-column:1;
  grid-row:1;
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:19px;
  font-weight:400;
  line-height:1;
  letter-spacing:-.035em;
}
.producto-descripcion{
  grid-column:1;
  grid-row:2;
  margin-top:6px;
  max-width:300px;
  color:var(--suave);
  font-size:10px;
  line-height:1.5;
}
.producto-precio{
  grid-column:2;
  grid-row:1 / 3;
  align-self:center;
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
}
.productos-mensaje{
  grid-column:1/-1;
  padding:70px 20px;
  text-align:center;
  color:#999;
}

/* MARQUEE */
.marquee-vesira{
  width:100%;
  overflow:hidden;
  background:transparent;
  padding:34px 0;
  border-top:1px solid var(--borde);
}
.marquee-vesira-track{
  display:flex;
  width:max-content;
  animation:vesiraLoop 18s linear infinite;
}
.marquee-vesira-group{
  display:flex;
  align-items:center;
  gap:70px;
  padding-right:70px;
  flex-shrink:0;
}
.marquee-vesira-group img{
  width:155px;
  height:60px;
  object-fit:contain;
  display:block;
  flex-shrink:0;
}
@keyframes vesiraLoop{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:3000;
  transform:translate(-50%,20px);
  opacity:0;
  padding:12px 17px;
  border:1px solid var(--borde);
  border-radius:999px;
  background:rgba(20,20,20,.95);
  backdrop-filter:blur(12px);
  font-size:11px;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
}
.toast.visible{
  opacity:1;
  transform:translate(-50%,0);
}

/* RESPONSIVE */
@media(max-width:1000px){
  .grid-productos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .intro,.barra-navegacion{height:70px}
  .eslogan{width:300px;max-width:80vw}
  .barra-navegacion{padding:0 12px}
  .normal{padding:7px 13px;gap:10px}
  .logo{width:96px}
  .nav-divider{display:block;width:1px;height:16px;background:rgba(255,255,255,.14)}
  .nav-word{display:block;font-size:8px;letter-spacing:.14em;color:var(--suave)}
  .nav-icon{width:36px;height:36px}
  .imagen-principal{
    margin-top:70px;
    height:430px;
    min-height:430px;
  }
  .imagen-principal img{
    height:100%;
    object-fit:cover;
    object-position:center top;
  }
  .imagen-principal::before{height:90px}
  .imagen-principal::after{height:120px}
  .productos{
    padding:46px 14px 80px;
  }
  .productos-cabecera{margin-bottom:18px}
  .productos-cabecera h2{font-size:30px}
  .grid-productos{gap:10px}
  .producto-card{
    padding:8px;
    border-radius:17px;
  }
  .producto-imagen{border-radius:12px;aspect-ratio:1/.9}
  .producto-imagen img{width:84%;height:84%}
  .producto-info{
    padding:11px 2px 3px;
    column-gap:7px;
  }
  .producto-nombre{font-size:15px}
  .producto-descripcion{font-size:8.5px;margin-top:4px}
  .producto-precio{font-size:10px}
  .marquee-vesira{padding:24px 0}
  .marquee-vesira-group{gap:45px;padding-right:45px}
  .marquee-vesira-group img{width:115px;height:48px}
}
</style>
</head>

<body>
  <div class="intro" id="intro">
    <img src="img/eslogan.png" alt="Vesira" class="eslogan">
  </div>

  <nav class="barra-navegacion" id="navbar">
    <div class="nav-left">
      <div class="normal">
        <img src="img/logo2.png" class="logo" alt="Vesira">
        <span class="nav-divider"></span>
        <span class="nav-word">Eyewear</span>
      </div>
    </div>

    <div class="iconos">
      <button class="nav-icon material-symbols-outlined" id="abrirCarrito" aria-label="Carrito">
        shopping_bag
      </button>
      <button class="nav-icon material-symbols-outlined" id="menu" aria-label="Menú">
        menu
      </button>
    </div>
  </nav>

  <main>
    <section class="imagen-principal">
      <picture>
        <img src="img/imagen-principal.png?v=21" alt="Personas llevando gafas Vesira">
      </picture>
    </section>

    <section class="productos">
      <div class="productos-cabecera">
        <h2>El match perfecto</h2>
      </div>

      <div class="grid-productos" id="gridProductos">
        <div class="productos-mensaje">Cargando productos...</div>
      </div>
    </section>

    <section class="marquee-vesira">
      <div class="marquee-vesira-track">
        <div class="marquee-vesira-group">
          <img src="img/logo2.png" alt="Vesira">
          <img src="img/logo15.png" alt="">
          <img src="img/logo2.png" alt="Vesira">
          <img src="img/logo15.png" alt="">
          <img src="img/logo2.png" alt="Vesira">
          <img src="img/logo15.png" alt="">
        </div>
        <div class="marquee-vesira-group">
          <img src="img/logo2.png" alt="Vesira">
          <img src="img/logo15.png" alt="">
          <img src="img/logo2.png" alt="Vesira">
          <img src="img/logo15.png" alt="">
          <img src="img/logo2.png" alt="Vesira">
          <img src="img/logo15.png" alt="">
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Menú</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const intro = document.getElementById("intro");
    const navbar = document.getElementById("navbar");
    const gridProductos = document.getElementById("gridProductos");
    const toast = document.getElementById("toast");

    function mostrarToast(mensaje){
      toast.textContent = mensaje;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 1600);
    }

    setTimeout(() => {
      intro.style.opacity = "0";
      navbar.style.opacity = "1";
      navbar.style.transform = "translateY(0)";

      setTimeout(() => {
        intro.style.display = "none";
      }, 350);
    }, 1500);

    document.getElementById("abrirCarrito").addEventListener("click", () => {
      window.location.href = "carrito.html";
    });

    document.getElementById("menu").addEventListener("click", () => {
      mostrarToast("Menú");
    });

    async function cargarProductos(){
      try{
        const { data, error } = await supabaseClient
          .from("Productos")
          .select(`
            id,
            nombre,
            descripcion,
            precio,
            categoria,
            activo,
            created_at,
            imagen_url
          `)
          .eq("activo", true)
          .order("created_at", { ascending: true });

        if(error) throw error;

        if(!data || data.length === 0){
          gridProductos.innerHTML = `
            <div class="productos-mensaje">
              No hay gafas disponibles.
            </div>
          `;
          return;
        }

        gridProductos.innerHTML = "";

        data.forEach(producto => {
          const tarjeta = document.createElement("a");
          tarjeta.className = "producto-card";
          tarjeta.href = `producto.html?id=${producto.id}`;

          const precio = Number(producto.precio)
            .toFixed(2)
            .replace(".", ",");

          tarjeta.innerHTML = `
            <div class="producto-imagen">
              <img
                src="${producto.imagen_url || ""}"
                alt="${producto.nombre}"
                loading="lazy"
              >
            </div>

            <div class="producto-info">
              <h3 class="producto-nombre">${producto.nombre}</h3>
              ${
                producto.descripcion
                ? `<p class="producto-descripcion">${producto.descripcion}</p>`
                : ""
              }
              <span class="producto-precio">${precio} €</span>
            </div>
          `;

          gridProductos.appendChild(tarjeta);
        });
      }catch(error){
        console.error("Error cargando productos:", error);
        gridProductos.innerHTML = `
          <div class="productos-mensaje">
            No se han podido cargar los productos.
          </div>
        `;
      }
    }

    cargarProductos();
  </script>
</body>

</html>
