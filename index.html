<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vesira</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >

    <style>

        :root {
            --fondo: #ffffff;
            --texto: #111111;
            --borde: #e6e6e6;
            --caja: #ffffff;
        }

        body.modo-oscuro {
            --fondo: #0c0c0c;
            --texto: #ffffff;
            --borde: #292929;
            --caja: #171717;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================= */

        .barra-navegacion {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;

            width: 100%;
            height: 80px;

            background: var(--fondo);
            border-bottom: 1px solid var(--borde);
        }


        /* =========================
           BLOQUE IZQUIERDO
        ========================= */

        .normal {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            align-items: center;

            gap: 35px;

            padding: 8px 25px;

            background: var(--caja);
            border: 1px solid var(--borde);
            border-radius: 999px;
        }

        .logo {
            width: 115px;
            height: auto;
            display: block;
        }


        /* =========================
           BUSCADOR
        ========================= */

        .buscar {
            display: none;

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 620px;
            max-width: 50vw;

            height: 52px;

            align-items: center;
            gap: 12px;

            padding: 0 22px;

            background: var(--caja);
            border: 1px solid var(--borde);
            border-radius: 999px;
        }

        .buscar input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            background: transparent;
            color: var(--texto);

            font-size: 17px;
        }

        .buscar input::placeholder {
            color: #999;
        }


        /* =========================
           ICONOS DERECHA
        ========================= */

        .iconos {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .iconos span,
        .tema-boton {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--texto);

            cursor: pointer;
        }

        .iconos span:hover,
        .tema-boton:hover {
            background: var(--caja);
        }

        .tema-boton {
            border: none;
            background: transparent;
        }


        /* =========================
           BOTONES BUSCADOR
        ========================= */

        #abrirBusqueda,
        #botonIA {
            cursor: pointer;
        }

        #cerrarBusqueda {
            flex: 0 0 auto;

            border: none;
            background: transparent;

            color: var(--texto);

            cursor: pointer;

            font-size: 19px;
            padding: 0;
        }

        .IA-activa {
            color: #f4b400 !important;
        }


        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 700px) {

            .barra-navegacion {
                height: 72px;
            }

            /* BLOQUE IZQUIERDO */
            .normal {
                left: 14px;

                width: auto;

                gap: 20px;

                padding: 7px 18px;
            }

            .logo {
                width: 103px;
            }


            /* BUSCADOR EN MÓVIL:
               MISMA POSICIÓN Y MISMO TAMAÑO SIEMPRE */
            .buscar {
                left: 14px;
                right: auto;

                top: 50%;

                transform: translateY(-50%);

                width: 220px;
                max-width: none;

                height: 42px;

                padding: 0 14px;

                gap: 8px;
            }

            .buscar input {
                width: 130px;
                min-width: 0;

                font-size: 14px;
            }

            .buscar .material-symbols-outlined {
                font-size: 21px;
            }

            #cerrarBusqueda {
                font-size: 17px;
            }


            /* ICONOS SIEMPRE A LA DERECHA */
            .iconos {
                right: 14px;
                gap: 2px;
            }

            .iconos span,
            .tema-boton {
                width: 36px;
                height: 36px;
            }

        }

    </style>

</head>


<body>


    <nav class="barra-navegacion">


        <!-- LOGO + LUPA -->

        <div class="normal">

            <img
                src="img/logo.png"
                class="logo"
                id="logoVesira"
                alt="Vesira"
            >

            <span
                class="material-symbols-outlined"
                id="abrirBusqueda">
                search
            </span>

        </div>


        <!-- BUSCADOR -->

        <div class="buscar">

            <span class="material-symbols-outlined">
                search
            </span>

            <input
                id="inputBusqueda"
                type="text"
                placeholder="¿Qué estás buscando?"
            >

            <span
                class="material-symbols-outlined"
                id="botonIA">
                auto_awesome
            </span>

            <button
                id="cerrarBusqueda"
                aria-label="Cerrar búsqueda">
                ✕
            </button>

        </div>


        <!-- ICONOS -->

        <div class="iconos">

            <span class="material-symbols-outlined">
                shopping_bag
            </span>

            <button
                class="tema-boton material-symbols-outlined"
                id="cambiarTema">
                dark_mode
            </button>

            <span class="material-symbols-outlined">
                menu
            </span>

        </div>

    </nav>


    <script>

        const normal =
            document.querySelector(".normal");

        const buscar =
            document.querySelector(".buscar");

        const abrirBusqueda =
            document.getElementById("abrirBusqueda");

        const cerrarBusqueda =
            document.getElementById("cerrarBusqueda");

        const inputBusqueda =
            document.getElementById("inputBusqueda");

        const botonIA =
            document.getElementById("botonIA");

        const cambiarTema =
            document.getElementById("cambiarTema");

        const logoVesira =
            document.getElementById("logoVesira");


        /* =========================
           BUSCADOR
        ========================= */

        abrirBusqueda.addEventListener("click", () => {

            normal.style.visibility = "hidden";

            buscar.style.display = "flex";

            inputBusqueda.focus();

        });


        cerrarBusqueda.addEventListener("click", () => {

            buscar.style.display = "none";

            normal.style.visibility = "visible";

            inputBusqueda.value = "";

        });


        /* =========================
           IA
        ========================= */

        let iaActiva = false;

        botonIA.addEventListener("click", () => {

            iaActiva = !iaActiva;

            botonIA.classList.toggle(
                "IA-activa",
                iaActiva
            );

            inputBusqueda.placeholder =
                iaActiva
                    ? "Pregúntale a la IA"
                    : "¿Qué estás buscando?";

        });


        /* =========================
           TEMA
        ========================= */

        function aplicarTema(oscuro) {

            if (oscuro) {

                document.body.classList.add(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "light_mode";

                logoVesira.src =
                    "img/logo2.png";

            } else {

                document.body.classList.remove(
                    "modo-oscuro"
                );

                cambiarTema.textContent =
                    "dark_mode";

                logoVesira.src =
                    "img/logo.png";

            }

        }


        const temaGuardado =
            localStorage.getItem("vesiraTema");

        aplicarTema(
            temaGuardado === "oscuro"
        );


        cambiarTema.addEventListener(
            "click",
            () => {

                const oscuro =
                    !document.body.classList.contains(
                        "modo-oscuro"
                    );

                localStorage.setItem(
                    "vesiraTema",
                    oscuro
                        ? "oscuro"
                        : "claro"
                );

                aplicarTema(oscuro);

            }
        );

    </script>


</body>

</html>
