<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:white;
    padding:80px 20px 20px;
}

/* ================= NAVBAR ================= */

.barra-navegacion{

    position:fixed;
    top:0;
    left:0;
    z-index:1000;

    width:100%;
    height:80px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    background:white;

    border-bottom:1px solid #ececec;

    opacity:0;
    transform:translateY(-20px);
    transition:.8s ease;

}

/* ---------- LOGO + LUPA ---------- */

.normal{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:35px;

    padding:8px 25px 8px 25px;

    background:#fffffd;

    border:1px solid #8f8f8f;

    border-radius:999px;

}

.logo{

    width:115px;
    height:auto;
    margin-left: 0;


}

/* ---------- BUSCADOR ---------- */

.buscar{

    display:none;

    flex:1;

    align-items:center;

    gap:12px;

    background:#FAFAFA;

    border:1px solid #E6E6E6;

    border-radius:999px;

    padding:15px 25px;

    margin:0 25px;

}

.buscar input{

    flex: 1;

    min-width: 0;

    background:transparent;

    border:none;

    outline:none;

    font-size:17px;

    color:#222;

}

.buscar input::placeholder {
    color:#9A9A9A;
}

.buscar:hover{

    background:#F4F4F4;

}

.buscar:focus-within{

    border:1px solid #222;

}

.buscar{

    transition:.25s;

}

/* ---------- ICONOS ---------- */

.iconos{

    display:flex;
    align-items:center;
    gap:18px;

}

.material-symbols-outlined{

    font-size:32px;
    cursor:pointer;

}

button{

    border:none;
    background:none;
    cursor:pointer;
    font-size:22px;

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    body{
        padding:80px 10px 10px;
    }

    .barra-navegacion{

        padding:0 15px;

    }

    .material-symbols-outlined{

        font-size:28px;

    }

    .buscar{

        margin:0 10px;

        padding:10px 15px;

    }

    .buscar input{

        font-size:16px;

    }
    
    .intro{

        padding:0 40px;

    }

    .eslogan{

        width:100%;
        max-width:180px;
        height:auto;

    }

}

#abrirBusqueda {
    animation: moverLupa 0.75s;
}


@keyframes moverLupa {

    0%{
        transform: translate(-60px, 0);
        opacity: 0;
    }

    60%{
        transform: translate(-10px, -8px);
        opacity: 1;
    }

    100%{
        transform: translate(0, 0);
    }

}

#botonIA {
    margin-left:12px;
    margin-right: 25px;
    cursor: pointer;

    font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24
}

.IA-activa {
    color:#F4B400;
    font-variation-settings:
    'FILL' 1,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24;
}

.eslogan{

    width:100%;

    max-width:420px;

    height:auto;

    animation:introEslogan 4s ease forwards;

}

@keyframes introEslogan{

    0%{

        opacity:0;
        transform:translateY(20px);

    }

    20%{

        opacity:1;
        transform:translateY(0);

    }

    75%{

        opacity:1;
        transform:translateY(0);

    }

    100%{

        opacity:0;
        transform:translateY(-25px);

    }

}

.intro{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:80px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:white;

    border-bottom:1px solid #ececec;

    z-index:2000;

    padding:0 20px;

}

.best-sellers{
    margin-top: 45px;
    padding: 0 20px;
    margin-left: -8px;
}

.subtitulo{

    font-family:"Outfit", sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:#8b8b8b;

}

.best-sellers h2{
    font-family:"Outfit", sans-serif;
    font-size:35px;
    font-weight:700;
    color:#111;
    margin-top:8px;
    line-height:1.1;
}

.carrusel-productos {
    display: flex;
    gap: 24px;
    margin-top: 35px;
    overflow:visible;
    align-items:flex-start;
}

@media(max-width:768px){

    .carrusel-productos{

        overflow-x:auto;

    }

}

.producto{
    font-family:"Outfit", sans-serif;
    width:240px;
    flex:none;    
    max-width: 280px;
    cursor: pointer;
    transition: 0.3s;
    text-align: left;
    font-size: 18px;
}

.producto:hover{
    transform:translateY(-8px);
}

.producto img{
    width:80%;
    display:block;
    margin-right:auto;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:20px;
    transition: 0.3s;
}

.producto:hover img {
    transform: scale(1.05);
}

.producto h3{
    margin-top: 12px;
}

.modelo{

    margin-top:6px;

    color:#6F6F6F;

    font-size:15px;

    font-weight:400;

    line-height:1.4;

}

.precio{

    margin-top:10px;

    font-size:18px;

    font-weight:700;

    color:#111;

}

/*1 AGOSTO*/
.buscar-dispositivo {
    margin-top: 60px;
    margin-left: 8px;
}

.buscar-dispositivo h2 {
    font-family:"Outfit", sans-serif;    
}

.selectores {
    margin-top: 20px;
    display: flex;
    gap: 25px;
}

.selectores select {
    width: 100%;
}

.marca {
}

.modelo {

}

.ir{

    display:flex;
    align-items:center;

    gap:8px;

    margin-top:15px;

    background:black;
    color:white;

    border-radius:10px;

    padding:4px 3px 4px 10px;
    width:fit-content;

    cursor:pointer;
    font-size: 17px;

}

#flecha-ir {
    font-size: 30px;
}

</style>

</head>

<body>

<div class="intro">

    <img src="img/eslogan.png" alt="Born in the Atlantic" class="eslogan">

</div>


<nav class="barra-navegacion">

    <div class="normal">

        <img src="img/logo.png" class="logo">

        <span
        class="material-symbols-outlined"
        id="abrirBusqueda">
            search
        </span>

    </div>

    <div class="buscar">

        <span class="material-symbols-outlined">
            search
        </span>

        <input
        type="text"
        placeholder="¿Qué estás buscando?">

        <span class="material-symbols-outlined" id = "botonIA">auto_awesome</span>

        <button id="cerrarBusqueda">
            ✕
        </button>

    </div>

    <div class="iconos">

        <span class="material-symbols-outlined">
            shopping_bag
        </span>

        <span class="material-symbols-outlined">
            person
        </span>
        
        <span class="material-symbols-outlined">
            menu
        </span>

    </div>  

</nav>

<section class = "best-sellers">
    <p class = "subtitulo">TE ENCANTARÁ</p>
    <h2>Más vendidos</h2>

    <div class = "carrusel-productos">

        <div class = "producto">
            <div class = "imagen-producto">
                <img src = "img/productos/funda.jpg" alt = "Funda magsafe">
            </div>
            <h3>Funda con Magsafe</h3>
            <p class = "modelo">iPhone 17 Pro Max</p>
            <span class = "precio">9,99 €</span>
        </div>

        <div class = "producto">
            <div class = "imagen-producto">
                <img src = "img/productos/funda.jpg" alt = "Funda magsafe">
            </div>
            <h3>Funda con Magsafe</h3>
            <p class = "modelo">iPhone 17 Pro Max</p>
            <span class = "precio">9,99 €</span>
        </div>

        <div class = "producto">
            <div class = "imagen-producto">
                <img src = "img/productos/funda.jpg" alt = "Funda magsafe">
            </div>
            <h3>Funda con Magsafe</h3>
            <p class = "modelo">iPhone 17 Pro Max</p>
            <span class = "precio">9,99 €</span>
        </div>

        <div class = "producto">
            <div class = "imagen-producto">
                <img src = "img/productos/funda.jpg" alt = "Funda magsafe">
            </div>
            <h3>Funda con Magsafe</h3>
            <p class = "modelo">iPhone 17 Pro Max</p>
            <span class = "precio">9,99 €</span>
        </div>

    </div>

</section>

<!--1 AGOSTO-->
<section class = "buscar-dispositivo">
    <h2>Busca tu dispositivo</h2>

    <div class = "selectores">
        <select name = "Marca del dispositivo" class = "marca">
            <option>Apple</option>
            <option>Samsung</option>
            <option>Xiaomi</option>
            <option>Oppo</option>
        </select>

        <select name = "Modelo" class = "modelo">
            <option>Piña</option>
            <option></option>
            <option></option>
            <option></option>
        </select>

    </div>

    <button class = "ir">
        Buscar
        <span class="material-symbols-outlined" id = "flecha-ir">keyboard_arrow_right</span>
    </button>

</section>



<script>

const normal = document.querySelector(".normal");
const buscar = document.querySelector(".buscar");
const iconos = document.querySelector(".iconos");
const IA = document.getElementById("botonIA");

let iaActiva = false;


document.getElementById("abrirBusqueda").addEventListener("click",()=>{

    normal.style.display = "none";
    iconos.style.display = "none";
    buscar.style.display = "flex";

    buscar.querySelector("input").focus();

});


document.getElementById("cerrarBusqueda").addEventListener("click",()=>{

    buscar.style.display = "none";
    normal.style.display = "flex";
    iconos.style.display = "flex";

});



const input = document.querySelector(".buscar input");
IA.addEventListener("click",()=>{

    iaActiva = !iaActiva;

    if(iaActiva){

        IA.classList.add("IA-activa");
        input.placeholder = "Pregúntale a la IA";

    } else {

        IA.classList.remove("IA-activa");
        input.placeholder = "¿Qué estás buscando?";

    }

});

const intro = document.querySelector(".intro");
const navbar = document.querySelector(".barra-navegacion");

setTimeout(()=>{

    intro.style.display = "none";

    navbar.style.opacity = "1";
    navbar.style.transform = "translateY(0)";

},1500);

</script>

</body>

</html>
