<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Bricolage Grotesque",sans-serif;
}

body{

    background:white;
    color:#111;

}

.contenedor{

    max-width:1300px;

    margin:auto;

    padding:70px 25px;

}

.etiqueta{

    font-size:12px;

    letter-spacing:4px;

    color:#8a8a8a;

    text-transform:uppercase;

}

h1{

    margin-top:10px;

    font-size:44px;

    font-weight:700;

}

.grid{

    margin-top:45px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:25px;

}

.producto{

    cursor:pointer;

    transition:.35s;

}

.producto:hover{

    transform:translateY(-8px);

}

.imagen{

    aspect-ratio:1;

    background:#f7f7f7;

    border-radius:26px;

    overflow:hidden;

}

.imagen img{

    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s;

}

.producto:hover img{

    transform:scale(1.05);

}

h3{

    margin-top:18px;

    font-size:19px;

    font-weight:600;

}

.modelo{

    margin-top:6px;

    color:#888;

    font-size:15px;

}

.precio{

    margin-top:10px;

    font-size:18px;

    font-weight:600;

}

@media(max-width:900px){

.grid{

    display:flex;

    overflow-x:auto;

    gap:18px;

    padding-bottom:10px;

    scroll-snap-type:x mandatory;

}

.grid::-webkit-scrollbar{

    display:none;

}

.producto{

    min-width:230px;

    scroll-snap-align:start;

}

h1{

    font-size:32px;

}

}

</style>

</head>

<body>

<section class="contenedor">

<span class="etiqueta">

FEATURED

</span>

<h1>

Best Sellers

</h1>

<div class="grid">

<div class="producto">

<div class="imagen">

<img src="https://picsum.photos/500?1">

</div>

<h3>MagSafe Case</h3>

<div class="modelo">iPhone 16 Pro</div>

<div class="precio">24,99 €</div>

</div>

<div class="producto">

<div class="imagen">

<img src="https://picsum.photos/500?2">

</div>

<h3>Clear Case</h3>

<div class="modelo">Galaxy S25</div>

<div class="precio">19,99 €</div>

</div>

<div class="producto">

<div class="imagen">

<img src="https://picsum.photos/500?3">

</div>

<h3>Silicone Case</h3>

<div class="modelo">Pixel 9</div>

<div class="precio">22,99 €</div>

</div>

<div class="producto">

<div class="imagen">

<img src="https://picsum.photos/500?4">

</div>

<h3>Leather Case</h3>

<div class="modelo">iPhone 15</div>

<div class="precio">29,99 €</div>

</div>

</div>

</section>

</body>
</html>
