<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Bricolage Grotesque",sans-serif;
}

body{

    background:#fafafa;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:20px;

}

.buscador{

    width:min(850px,100%);

}

h1{

    text-align:center;

    font-size:42px;

    margin-bottom:10px;

}

p{

    text-align:center;

    color:#777;

    margin-bottom:40px;

}

/* Barra */

.barra{

    display:flex;
    align-items:center;

    background:white;

    border:1px solid #e8e8e8;

    border-radius:999px;

    padding:8px;

    transition:.25s;

}

.barra:focus-within{

    border-color:black;

}

input{

    flex:1;

    border:none;

    outline:none;

    padding:15px 20px;

    font-size:17px;

    background:transparent;

}

button{

    width:48px;
    height:48px;

    border:none;

    border-radius:50%;

    background:black;

    color:white;

    cursor:pointer;

    font-size:18px;

    transition:.25s;

}

button:hover{

    transform:scale(1.05);

}

/* Chips */

.chips{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:22px;

}

.chip{

    position:relative;

    padding:12px 18px;

    background:white;

    border:1px solid #e8e8e8;

    border-radius:999px;

    cursor:pointer;

    transition:.25s;

}

.chip:hover{

    border-color:black;

}

.lista{

    display:none;

    position:absolute;

    top:52px;
    left:0;

    min-width:220px;

    background:white;

    border:1px solid #ececec;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 18px 35px rgba(0,0,0,.08);

    animation:fade .18s;

    z-index:10;

}

.opcion{

    padding:14px 18px;

    transition:.2s;

    cursor:pointer;

}

.opcion:hover{

    background:#f5f5f5;

    padding-left:24px;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(-8px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media(max-width:700px){

h1{

font-size:32px;

}

input{

font-size:15px;

}

.chips{

justify-content:center;

}

}

</style>

</head>

<body>

<div class="buscador">

<h1>Find your accessory</h1>

<p>Search or filter your device.</p>

<div class="barra">

<input placeholder="Search accessories...">

<button>→</button>

</div>

<div class="chips">

<div class="chip">

<span id="brand">🍎 Apple</span>

<div class="lista">

<div class="opcion">🍎 Apple</div>
<div class="opcion">📱 Samsung</div>
<div class="opcion">🔷 Google</div>
<div class="opcion">⚡ Xiaomi</div>

</div>

</div>

<div class="chip">

<span id="model">iPhone 16 Pro</span>

<div class="lista">

<div class="opcion">iPhone 16</div>
<div class="opcion">iPhone 16 Plus</div>
<div class="opcion">iPhone 16 Pro</div>
<div class="opcion">iPhone 16 Pro Max</div>

</div>

</div>

<div class="chip">

<span id="type">All products</span>

<div class="lista">

<div class="opcion">All products</div>
<div class="opcion">Cases</div>
<div class="opcion">Screen protectors</div>
<div class="opcion">Chargers</div>

</div>

</div>

</div>

</div>

<script>

document.querySelectorAll(".chip").forEach(chip=>{

chip.onclick=(e)=>{

e.stopPropagation();

const lista=chip.querySelector(".lista");

document.querySelectorAll(".lista").forEach(l=>{

if(l!==lista){

l.style.display="none";

}

});

lista.style.display=

lista.style.display==="block"

?

"none"

:

"block";

};

});

document.querySelectorAll(".opcion").forEach(op=>{

op.onclick=(e)=>{

e.stopPropagation();

op.parentElement.previousElementSibling.textContent=

op.textContent;

op.parentElement.style.display="none";

};

});

document.onclick=()=>{

document.querySelectorAll(".lista").forEach(l=>{

l.style.display="none";

});

};

</script>

</body>
</html>
